<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="theme.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0D0D0D">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.svg">
<title>Set Up Your Bag — Shot Tracker</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :root, [data-theme="dark"] {
    --bg:              #0D0D0D;
    --surface:         #171717;
    --text-primary:    #F3E7CC;
    --text-secondary:  #B8A98A;
    --gold:            #C8A96A;
    --highlight:       #D4B36A;
    --warning:         #7B3F3F;
    --success:         #8F7A2A;
    --gold-muted:      #9A7C47;
    --text-muted:      #9A9A9A;
    --on-gold:         #0D0D0D;
    --bg-primary:      var(--bg);
    --bg-card:         var(--surface);
    --border:          color-mix(in srgb, var(--gold) 15%, transparent);
  }
  [data-theme="light"] {
    --bg:              #E8DFC8;
    --surface:         #F7F1E2;
    --text-primary:    #111111;
    --text-secondary:  #4A463D;
    --gold:            #9A7C47;
    --highlight:       #1F3328;
    --warning:         #B35454;
    --success:         #2E7D32;
    --gold-muted:      #6B5730;
    --text-muted:      #4A463D;
    --on-gold:         #0D0D0D;
    --bg-primary:      var(--bg);
    --bg-card:         var(--surface);
    --border:          color-mix(in srgb, var(--gold) 15%, transparent);
  }
  :root {
    --radius:       14px;
    --safe-top:     env(safe-area-inset-top, 0px);
    --safe-bottom:  env(safe-area-inset-bottom, 0px);
  }

  html, body { height: 100%; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg-primary); overflow: hidden; }

  .app { position: relative; width: 100%; height: 100%; max-width: 430px; margin: 0 auto; overflow: hidden; }

  /* ── Background ── */
  .content { position: absolute; left: 0; right: 0; bottom: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px 16px calc(var(--safe-bottom) + 180px); z-index: 10; background: var(--bg); }

  /* ── Header ── */
  .header { position: absolute; top: 0; left: 0; right: 0; padding: calc(var(--safe-top) + 20px) 24px 16px; display: flex; align-items: center; gap: 16px; border-bottom: 0.5px solid color-mix(in srgb, var(--gold) 20%, transparent); z-index: 20; }
  .header-img-wrap { position: relative; z-index: 10; width: 100%; flex-shrink: 0; }
  .header-img { width: 100%; height: auto; display: block; }
  .header-title { font-size: 13px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-muted); flex: 1; }

  /* ── Counter bar ── */
  .counter-bar { position: absolute; left: 0; right: 0; padding: 0 20px 16px; z-index: 20; }
  .counter-inner { background: color-mix(in srgb, var(--surface) 90%, transparent); border: 0.5px solid var(--border); border-radius: 12px; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; backdrop-filter: blur(8px); }
  .counter-text { font-size: 13px; color: var(--text-muted); font-weight: 500; letter-spacing: 0.04em; }
  .counter-num { font-size: 22px; font-weight: 300; color: var(--gold); }
  .counter-max { font-size: 13px; color: var(--text-muted); }
  .counter-bar-fill-wrap { margin-top: 8px; height: 3px; background: color-mix(in srgb, var(--gold) 15%, transparent); border-radius: 10px; overflow: hidden; }
  .counter-bar-fill { height: 100%; background: var(--gold); border-radius: 10px; transition: width 0.25s; }
  .counter-bar-fill.full { background: var(--warning); }

  /* ── Scrollable club list ── */

  /* ── Category ── */
  .category { margin-bottom: 20px; }
  .category-header { font-size: 10px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold-muted); margin-bottom: 10px; padding-left: 2px; }
  .club-list { background: color-mix(in srgb, var(--surface) 85%, transparent); border-radius: var(--radius); border: 0.5px solid var(--border); overflow: hidden; backdrop-filter: blur(8px); }
  .club-row { display: flex; align-items: center; padding: 14px 16px; border-bottom: 0.5px solid color-mix(in srgb, var(--gold) 8%, transparent); cursor: pointer; gap: 14px; transition: background 0.1s; }
  .club-row:last-child { border-bottom: none; }
  .club-row:active { background: color-mix(in srgb, var(--gold) 6%, transparent); }
  .club-row.selected { background: color-mix(in srgb, var(--gold) 8%, transparent); }
  .club-check { width: 24px; height: 24px; border-radius: 50%; border: 1.5px solid color-mix(in srgb, var(--gold) 30%, transparent); display: flex; align-items: center; justify-content: center; flex-shrink: 0; transition: background 0.15s, border-color 0.15s; }
  .club-row.selected .club-check { background: var(--gold); border-color: var(--gold); }
  .club-check-tick { display: none; color: var(--on-gold); font-size: 13px; font-weight: 700; }
  .club-row.selected .club-check-tick { display: block; }
  .club-info { flex: 1; }
  .club-name { font-size: 15px; font-weight: 500; color: var(--text-primary); }
  .club-desc { font-size: 12px; color: var(--text-muted); margin-top: 2px; }
  .club-badge { font-size: 11px; font-weight: 600; padding: 3px 8px; border-radius: 20px; background: color-mix(in srgb, var(--bg) 60%, transparent); color: var(--text-muted); border: 0.5px solid color-mix(in srgb, var(--gold) 20%, transparent); flex-shrink: 0; }
  .club-row.selected .club-badge { color: var(--gold); border-color: color-mix(in srgb, var(--gold) 40%, transparent); }

  /* ── Sticky footer ── */
  .footer { position: absolute; bottom: 0; left: 0; right: 0; background: color-mix(in srgb, var(--bg) 95%, transparent); border-top: 0.5px solid var(--border); padding: 12px 16px calc(var(--safe-bottom) + 110px); z-index: 20; backdrop-filter: blur(12px); }
  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 15px; border-radius: var(--radius); border: none; font-size: 15px; font-weight: 500; cursor: pointer; transition: opacity 0.15s, transform 0.1s; margin-bottom: 8px; font-family: inherit; letter-spacing: 0.04em; }
  .btn:last-child { margin-bottom: 0; }
  .btn:active { opacity: 0.82; transform: scale(0.985); }
  .btn-primary { background: var(--gold); color: var(--on-gold); }
  .btn-secondary { background: color-mix(in srgb, var(--surface) 90%, transparent); color: var(--text-muted); border: 0.5px solid var(--border); }
  .btn-round { background: transparent; color: var(--gold); border: 0.5px solid var(--gold); }
  .btn:disabled { opacity: 0.4; cursor: default; }
  .post-save { display: none; flex-direction: column; gap: 8px; }

  /* ── Bottom sheet dialog ── */
  .dialog-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.6); z-index: 200; opacity: 0; pointer-events: none; transition: opacity 0.25s; }
  .dialog-overlay.open { opacity: 1; pointer-events: auto; }
  .dialog-sheet { position: absolute; bottom: 0; left: 0; right: 0; background: var(--surface); border-radius: 20px 20px 0 0; border-top: 0.5px solid color-mix(in srgb, var(--gold) 20%, transparent); padding: 20px 24px calc(var(--safe-bottom) + 24px); z-index: 201; transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.4,0,0.2,1); }
  .dialog-sheet.open { transform: translateY(0); }
  .dialog-handle { width: 36px; height: 3px; background: color-mix(in srgb, var(--gold) 30%, transparent); border-radius: 2px; margin: 0 auto 20px; }
  .dialog-title { font-size: 17px; font-weight: 500; color: var(--text-primary); margin-bottom: 8px; letter-spacing: 0.01em; }
  .dialog-sub { font-size: 13px; color: var(--text-muted); margin-bottom: 20px; line-height: 1.6; }
  .dialog-btn { width: 100%; padding: 14px; border: none; border-radius: 12px; font-size: 14px; font-weight: 500; cursor: pointer; font-family: inherit; letter-spacing: 0.04em; background: var(--gold); color: var(--on-gold); }
  .dialog-btn:active { opacity: 0.8; }

  /* ── Toast ── */

  /* ── Nav — identical to index.html ── */
  .nav-shell { position: absolute; bottom: 0; left: 0; right: 0; z-index: 100; }
  .nav-row { display: flex; background: rgba(13,13,13,0.92); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  .nav-primary { border-top: 0.5px solid color-mix(in srgb, var(--gold) 20%, transparent); padding-bottom: calc(var(--safe-bottom) + 6px); transform: translateY(0); transition: transform 350ms cubic-bezier(0.4,0,0.2,1); will-change: transform; position: relative; z-index: 2; }
  .nav-primary.raised { transform: translateY(-100%); }
  .nav-secondary { border-top: 0.5px solid color-mix(in srgb, var(--gold) 12%, transparent); padding-bottom: calc(var(--safe-bottom) + 6px); position: absolute; bottom: 0; left: 0; right: 0; transform: translateY(100%); transition: transform 350ms cubic-bezier(0.4,0,0.2,1); will-change: transform; z-index: 1; }
  .nav-secondary.open { transform: translateY(0); }
  .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px 4px 6px; cursor: pointer; text-decoration: none; background: none; border: none; -webkit-tap-highlight-color: transparent; transition: opacity 0.15s; }
  .nav-item:active { opacity: 0.7; }
  .nav-item img { width: 56px; height: 56px; object-fit: contain; display: block; }
  .nav-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.5); opacity: 0; pointer-events: none; transition: opacity 350ms ease; z-index: 90; }
  .nav-overlay.open { opacity: 1; pointer-events: auto; }
</style>
</head>
<body>
<div class="app">

  <!-- Header -->
  <div class="header-img-wrap">
    <img class="header-img" src="Header.webp" alt="Shot Tracker">
  </div>

  <!-- Counter bar — positioned below header dynamically -->
  <div class="counter-bar" id="counter-bar-wrap" style="top: 130px;">
    <div class="counter-inner">
      <span class="counter-text">Clubs selected</span>
      <div>
        <span class="counter-num" id="counter-num">0</span>
        <span class="counter-max"> / 14</span>
      </div>
    </div>
    <div class="counter-bar-fill-wrap">
      <div class="counter-bar-fill" id="counter-fill" style="width:0%"></div>
    </div>
  </div>

  <!-- Club list — positioned below counter bar -->
  <div class="content" id="club-content" style="top: 210px;"></div>

  <!-- Save footer -->
  <div class="footer">
    <div id="pre-save">
      <button class="btn btn-primary" id="save-btn" onclick="saveBag()">&#10003; Save My Bag</button>
    </div>
    <div class="post-save" id="post-save">
      <button class="btn btn-round" onclick="window.location.href='start.html'">&#9971; Start a Round</button>
      <button class="btn btn-round" onclick="window.location.href='distance.html'">&#9873; Driving Range</button>
      <button class="btn btn-round" onclick="window.location.href='settings.html'">&#8592; Back</button>
    </div>
  </div>

  <!-- Bottom sheet dialog -->
  <div class="dialog-overlay" id="dialog-overlay" onclick="closeDialog()"></div>
  <div class="dialog-sheet" id="dialog-sheet">
    <div class="dialog-handle"></div>
    <div class="dialog-title" id="dialog-title"></div>
    <div class="dialog-sub" id="dialog-sub"></div>
    <button class="dialog-btn" onclick="closeDialog()" id="dialog-btn">Got it</button>
  </div>

  <!-- Overlay -->
    <!-- Nav shell -->
  <div class="nav-shell">
    <div class="nav-row">
      <a class="nav-item" href="find.html"><img src="icons/Courses.png" alt="Courses"></a>
      <a class="nav-item" id="nav-play" href="start.html"><img src="icons/Play.png" alt="Play"></a>
      <a class="nav-item" href="distance.html"><img src="icons/Distance.png" alt="Distance"></a>
      <a class="nav-item" href="suggest.html"><img src="icons/Suggest.png" alt="Suggest"></a>
      <a class="nav-item" href="history.html"><img src="icons/History.png" alt="History"></a>
    </div>
  </div>

</div>


<script>
const ALL_CLUBS = [
  { id: 'driver',  name: 'Driver',        desc: '1-Wood — maximum distance off the tee',            cat: 'Woods',   badge: '1W' },
  { id: '3wood',   name: '3-Wood',        desc: 'Fairway wood — long shots from fairway or tee',    cat: 'Woods',   badge: '3W' },
  { id: '4wood',   name: '4-Wood',        desc: 'Fairway wood — between 3W and 5W',                 cat: 'Woods',   badge: '4W' },
  { id: '5wood',   name: '5-Wood',        desc: 'Fairway wood — versatile long club',               cat: 'Woods',   badge: '5W' },
  { id: '7wood',   name: '7-Wood',        desc: 'Fairway wood — easier to hit than long irons',     cat: 'Woods',   badge: '7W' },
  { id: '9wood',   name: '9-Wood',        desc: 'High-lofted wood — good from rough',               cat: 'Woods',   badge: '9W' },
  { id: '2hybrid', name: '2-Hybrid',      desc: 'Replaces 2-iron — long and forgiving',             cat: 'Hybrids', badge: '2H' },
  { id: '3hybrid', name: '3-Hybrid',      desc: 'Replaces 3-iron — popular beginner choice',        cat: 'Hybrids', badge: '3H' },
  { id: '4hybrid', name: '4-Hybrid',      desc: 'Replaces 4-iron — easier to hit from rough',       cat: 'Hybrids', badge: '4H' },
  { id: '5hybrid', name: '5-Hybrid',      desc: 'Replaces 5-iron — great for high launch',          cat: 'Hybrids', badge: '5H' },
  { id: '6hybrid', name: '6-Hybrid',      desc: 'Replaces 6-iron — extra forgiveness',              cat: 'Hybrids', badge: '6H' },
  { id: '2iron',   name: '2-Iron',        desc: 'Long iron — very difficult to hit',                cat: 'Irons',   badge: '2i' },
  { id: '3iron',   name: '3-Iron',        desc: 'Long iron — distance with low loft',               cat: 'Irons',   badge: '3i' },
  { id: '4iron',   name: '4-Iron',        desc: 'Long iron — often replaced by hybrids',            cat: 'Irons',   badge: '4i' },
  { id: '5iron',   name: '5-Iron',        desc: 'Mid iron — approach shots from distance',          cat: 'Irons',   badge: '5i' },
  { id: '6iron',   name: '6-Iron',        desc: 'Mid iron — reliable mid-range club',               cat: 'Irons',   badge: '6i' },
  { id: '7iron',   name: '7-Iron',        desc: 'Mid iron — most versatile iron in the bag',        cat: 'Irons',   badge: '7i' },
  { id: '8iron',   name: '8-Iron',        desc: 'Short iron — accurate approach shots',             cat: 'Irons',   badge: '8i' },
  { id: '9iron',   name: '9-Iron',        desc: 'Short iron — high loft, short distance',           cat: 'Irons',   badge: '9i' },
  { id: 'pw',      name: 'Pitching Wedge',desc: '45–48° — full shots from ~100–130m',              cat: 'Wedges',  badge: 'PW' },
  { id: 'gw',      name: 'Gap Wedge',     desc: '50–52° — fills gap between PW and SW',            cat: 'Wedges',  badge: 'GW' },
  { id: 'sw',      name: 'Sand Wedge',    desc: '54–56° — bunkers and short game',                 cat: 'Wedges',  badge: 'SW' },
  { id: 'lw',      name: 'Lob Wedge',     desc: '58–62° — high soft shots near green',             cat: 'Wedges',  badge: 'LW' },
  { id: 'putter',  name: 'Putter',        desc: 'Rolling the ball on the green',                   cat: 'Putter',  badge: 'PT' },
];

const DEFAULT_BAG = ['driver','3wood','5wood','4hybrid','5iron','6iron','7iron','8iron','9iron','pw','gw','sw','lw','putter'];
let selected = new Set(JSON.parse(localStorage.getItem('golf-bag-v1') || 'null') || DEFAULT_BAG);
let saved = false;

function render() {
  const cats = [...new Set(ALL_CLUBS.map(c => c.cat))];
  const content = document.getElementById('club-content');
  content.innerHTML = cats.map(cat => {
    const clubs = ALL_CLUBS.filter(c => c.cat === cat);
    return '<div class="category">' +
      '<div class="category-header">' + cat + '</div>' +
      '<div class="club-list">' +
      clubs.map(c => {
        const sel = selected.has(c.id);
        return '<div class="club-row' + (sel ? ' selected' : '') + '" onclick="toggle(\'' + c.id + '\')">' +
          '<div class="club-check"><span class="club-check-tick">&#10003;</span></div>' +
          '<div class="club-info"><div class="club-name">' + c.name + '</div><div class="club-desc">' + c.desc + '</div></div>' +
          '<span class="club-badge">' + c.badge + '</span>' +
          '</div>';
      }).join('') +
      '</div></div>';
  }).join('');
  updateCounter();
}

function toggle(id) {
  if (saved) { saved = false; document.getElementById('pre-save').style.display = 'block'; document.getElementById('post-save').style.display = 'none'; }
  if (selected.has(id)) { selected.delete(id); }
  else { if (selected.size >= 14) { showDialog('Maximum Clubs Reached', 'You can carry a maximum of 14 clubs. Remove one before adding another.'); return; } selected.add(id); }
  render();
}

function updateCounter() {
  const n = selected.size;
  document.getElementById('counter-num').textContent = n;
  const fill = document.getElementById('counter-fill');
  fill.style.width = (n / 14 * 100) + '%';
  fill.classList.toggle('full', n >= 14);
}

function saveBag() {
  if (selected.size === 0) { showDialog('No Clubs Selected', 'Select at least one club to save your bag.'); return; }
  const ordered = ALL_CLUBS.filter(c => selected.has(c.id)).map(c => c.id);
  localStorage.setItem('golf-bag-v1', JSON.stringify(ordered));
  saved = true;
  document.getElementById('pre-save').style.display = 'none';
  document.getElementById('post-save').style.display = 'flex';
}

function showDialog(title, sub) {
  document.getElementById('dialog-title').textContent = title;
  document.getElementById('dialog-sub').textContent = sub;
  document.getElementById('dialog-overlay').classList.add('open');
  document.getElementById('dialog-sheet').classList.add('open');
}

function closeDialog() {
  document.getElementById('dialog-overlay').classList.remove('open');
  document.getElementById('dialog-sheet').classList.remove('open');
}

// ── Nav drawer ──


render();
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/sw.js').catch(() => {}); }
</script>
</body>
</html>
