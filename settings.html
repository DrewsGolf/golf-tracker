<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="theme.js"></script>
<link rel="stylesheet" href="theme.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0D0D0D">
<link rel="manifest" href="manifest.json">
<title>Settings — Shot Tracker</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  /* ── Theme variables ──────────────────────────────────────────────────────
     Canonical names (per Day/Night Theme spec): --bg, --surface, --text-primary,
     --text-secondary, --gold, --highlight, --warning, --success.
     Old names used throughout this file's existing CSS are kept as aliases
     pointing at the canonical ones, so nothing else needs renaming. */
  /* ── Page-specific aliases + layout vars. Core theme colors (--bg, --gold,
     etc.) now come from theme.css, loaded in <head>. This page's --text-muted
     intentionally overrides theme.css's default to match --text-secondary,
     preserving this page's original 2-tier text behavior. ── */
  :root {
    --bg-primary:  var(--bg);
    --bg-card:     var(--surface);
    --text-muted:  var(--text-secondary);
    --safe-top:      env(safe-area-inset-top, 0px);
    --safe-bottom:   env(safe-area-inset-bottom, 0px);
  }

  html, body {
    height: 100%;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg-primary);
    overflow: hidden;
  }

  /* ── App container — identical to index.html ── */
  .app {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 430px;
    margin: 0 auto;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ── Background image ── */
  .hero {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  .hero-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    display: block;
  }

  /* ── Dark overlay on background ── */
  .hero-overlay {
    position: absolute;
    inset: 0;
    background: rgba(13,13,13,0.65);
  }

  /* ── Header ── */
  /* z-index bumped above .settings-content (also 10) — they're sibling stacking
     contexts inside .page-scroll, and tied z-index falls back to DOM order,
     which was letting the settings card paint over the header-menu dropdown. */
  .header-img-wrap { position: relative; z-index: 30; width: 100%; flex-shrink: 0; }
  .header-img { width: 100%; height: auto; display: block; }
  .header {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    padding: calc(var(--safe-top) + 20px) 24px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    border-bottom: 0.5px solid color-mix(in srgb, var(--gold) 20%, transparent);
    z-index: 10;
  }

  .header-logo { height: 80px; object-fit: contain; }
  .header-title { font-size: 13px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-muted); }

  /* ── Scrollable page content wrapper ── */
  .page-scroll {
    position: relative;
    z-index: 5;
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding-bottom: calc(110px + var(--safe-bottom));
    background: var(--bg);
  }

  /* ── Settings content ── */
  .settings-content {
    position: relative;
    z-index: 10;
    padding: 0;
    flex-shrink: 0;
  }

  .settings-card {
    background: var(--surface);
    border: 1px solid var(--gold);
    border-radius: var(--radius-lg);
    box-shadow: var(--shadow-soft);
    overflow: hidden;
  }

  .settings-item {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 18px 20px;
    text-decoration: none;
    color: inherit;
    border-bottom: 0.5px solid color-mix(in srgb, var(--gold) 10%, transparent);
    transition: background 0.15s;
  }

  .settings-item:last-child { border-bottom: none; }
  .settings-item:active { background: color-mix(in srgb, var(--gold) 8%, transparent); }

  .settings-item-icon { width: 36px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .settings-item-body { flex: 1; }
  .settings-item-title { font-size: 15px; font-weight: 600; color: var(--gold); margin-bottom: 2px; }
  .settings-item-desc { font-size: 12px; color: var(--text-muted); letter-spacing: 0.01em; }
  .settings-item-arrow { font-size: 18px; color: var(--gold-muted); }

  /* ── Toggle switch ── */
  .toggle-switch { position: relative; width: 48px; height: 28px; flex-shrink: 0; }
  .toggle-switch input { opacity: 0; width: 0; height: 0; position: absolute; }
  .toggle-track {
    position: absolute; inset: 0; border-radius: 14px;
    background: color-mix(in srgb, var(--gold) 35%, transparent);
    border: 0.5px solid color-mix(in srgb, var(--gold) 30%, transparent);
    transition: background 0.2s ease;
    cursor: pointer;
  }
  .toggle-track::before {
    content: '';
    position: absolute;
    top: 2px; left: 2px;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: var(--text-primary);
    transition: transform 0.2s ease;
  }
  .toggle-switch input:checked + .toggle-track { background: var(--gold); }
  .toggle-switch input:checked + .toggle-track::before { transform: translateX(20px); background: var(--on-gold); }

  /* ── Nav — identical to index.html ── */
  .nav-shell {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 100;
  }

  .nav-row {
    display: flex;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }

  .nav-primary {
    border-top: 0.5px solid color-mix(in srgb, var(--gold) 20%, transparent);
    padding-bottom: calc(var(--safe-bottom) + 6px);
    transform: translateY(0);
    transition: transform 350ms cubic-bezier(0.4, 0, 0.2, 1);
    will-change: transform;
    position: relative;
    z-index: 2;
  }

  .nav-primary.raised { transform: translateY(-100%); }

  .nav-secondary {
    border-top: 0.5px solid color-mix(in srgb, var(--gold) 12%, transparent);
    padding-bottom: calc(var(--safe-bottom) + 6px);
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    transform: translateY(100%);
    transition: transform 350ms cubic-bezier(0.4, 0, 0.2, 1);
    will-change: transform;
    z-index: 1;
  }

  .nav-secondary.open { transform: translateY(0); }

  .nav-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 10px 4px 6px;
    cursor: pointer;
    text-decoration: none;
    background: none;
    border: none;
    -webkit-tap-highlight-color: transparent;
    transition: opacity 0.15s;
  }

  .nav-item:active { opacity: 0.7; }
  .nav-item img { width: 70px; height: 70px; object-fit: contain; object-position: bottom; display: block; }

  .nav-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.5);
    opacity: 0;
    pointer-events: none;
    transition: opacity 350ms ease;
    z-index: 90;
  }

  .nav-overlay.open { opacity: 1; pointer-events: auto; }

  /* Header auth badge */
  .header-auth-badge { position: absolute; top: 10px; right: 14px; display: none; align-items: center; gap: 6px; background: rgba(13,13,13,0.6); backdrop-filter: blur(6px); border: 0.5px solid color-mix(in srgb, var(--gold) 20%, transparent); border-radius: 20px; padding: 5px 10px 5px 8px; }
  .header-auth-badge.visible { display: flex; }
  .header-auth-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); flex-shrink: 0; }
  .header-auth-email { font-size: 11px; font-weight: 500; color: var(--gold); white-space: nowrap; }

  /* Daylight mode: white badge, black text, per the design brief */
  [data-theme="light"] .header-auth-badge {
    background: var(--surface);
    border: 0.5px solid color-mix(in srgb, var(--gold) 30%, transparent);
  }
  [data-theme="light"] .header-auth-email {
    color: var(--text-primary);
  }

  /* ── Header menu — single hamburger button, top right, overlaid on the
     header image, in the slot the Login icon used to occupy. Opens a
     dropdown (Home / My Profile / Settings / Sign In-Out) instead of the
     old Home+Login icon pair. ── */
  .header-menu {
    position: absolute;
    bottom: 5px;
    right: 14px;
    z-index: 60;
  }

  .header-menu-btn {
    display: flex;
    align-items: center;
    justify-content: center;
    width: 30px;
    height: 30px;
    background: none;
    border: none;
    padding: 0;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .header-menu-btn img {
    width: 30px;
    height: 30px;
    object-fit: contain;
    display: block;
  }

  .header-menu-btn:active { opacity: 0.7; }

  .header-menu-dropdown {
    position: absolute;
    top: calc(100% + 8px);
    right: 0;
    min-width: 180px;
    background: var(--surface);
    border: 1px solid color-mix(in srgb, var(--gold) 20%, transparent);
    border-radius: var(--radius-lg, 14px);
    box-shadow: var(--shadow-soft);
    overflow: hidden;
    opacity: 0;
    transform: translateY(-6px);
    pointer-events: none;
    transition: opacity 0.15s, transform 0.15s;
  }

  .header-menu-dropdown.open {
    opacity: 1;
    transform: translateY(0);
    pointer-events: auto;
  }

  .header-menu-item {
    display: block;
    width: 100%;
    padding: 14px 16px;
    font-size: 15px;
    font-weight: 600;
    color: var(--gold);
    text-decoration: none;
    text-align: left;
    background: none;
    border: none;
    border-bottom: 0.5px solid color-mix(in srgb, var(--gold) 10%, transparent);
    cursor: pointer;
    font-family: inherit;
    -webkit-tap-highlight-color: transparent;
  }

  .header-menu-item:last-child { border-bottom: none; }
  .header-menu-item:active { background: color-mix(in srgb, var(--gold) 8%, transparent); }

  .header-menu-item.disabled {
    color: var(--text-muted);
    cursor: default;
    opacity: 0.55;
  }
  .header-menu-item.disabled:active { background: none; }
</style>
</head>
<body>
<div class="app">

  <!-- Background image -->
  <div class="hero">
    <img class="hero-img" src="Back_ground_New.jpg" alt="">
    <div class="hero-overlay"></div>
  </div>

  <!-- Scrollable content: header + settings -->
  <div class="page-scroll">

  <!-- Header -->
  <div class="header-img-wrap" style="position:relative;">
    <img class="header-img" src="images/header.png" alt="Shot Tracker">
    <div class="header-auth-badge" id="header-badge">
      <div class="header-auth-dot"></div>
      <span class="header-auth-email" id="header-email"></span>
    </div>
    <div class="header-menu" id="header-menu">
      <button class="header-menu-btn" onclick="toggleHeaderMenu()" aria-label="Menu">
        <img src="icons/menu.png" alt="Menu">
      </button>
      <div class="header-menu-dropdown" id="header-menu-dropdown">
        <a class="header-menu-item" href="index.html">Home</a>
        <a class="header-menu-item" href="profile.html">My Profile</a>
        <a class="header-menu-item" href="settings.html">Settings</a>
        <a class="header-menu-item" href="login.html" id="header-menu-auth">Sign In</a>
      </div>
    </div>
  </div>

  <!-- Settings content -->
  <div class="settings-content">

    <div class="settings-card">
      <div class="settings-item">
        <div class="settings-item-icon">
          <img src="icons/Sound.png" style="width:32px;height:32px;object-fit:contain;display:block;">
        </div>
        <div class="settings-item-body">
          <div class="settings-item-title">Sound Effects</div>
          <div class="settings-item-desc">Play sounds during rounds</div>
        </div>
        <label class="toggle-switch">
          <input type="checkbox" id="sound-toggle" onchange="toggleSound(this.checked)">
          <span class="toggle-track"></span>
        </label>
      </div>
      <div class="settings-item">
        <div class="settings-item-icon" id="theme-icon" style="font-size:22px;">&#127769;</div>
        <div class="settings-item-body">
          <div class="settings-item-title">Light Mode</div>
          <div class="settings-item-desc" id="theme-desc">Currently using Dark theme</div>
        </div>
        <label class="toggle-switch">
          <input type="checkbox" id="theme-toggle" onchange="toggleThemeSwitch(this.checked)">
          <span class="toggle-track"></span>
        </label>
      </div>
    </div>
  </div>

  </div>
  <!-- /page-scroll -->

  <!-- Overlay -->
    <!-- Nav shell -->
  <div class="nav-shell">
    <div class="nav-row">
      <a class="nav-item" href="find.html"><img src="icons/Courses.png" alt="Courses"></a>
      <a class="nav-item" id="nav-play" href="start.html"><img src="icons/Play.png" alt="Play"></a>
      <a class="nav-item" href="distance.html"><img src="icons/Distance.png" alt="Distance"></a>
      <a class="nav-item" href="suggest.html"><img src="icons/Suggest.png" alt="Suggest"></a>
      <a class="nav-item" href="history.html"><img src="icons/History.png" alt="History"></a>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://ryqehsqqriavmuqfnzpx.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ5cWVoc3Fxcmlhdm11cWZuenB4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM3NTQ4MzcsImV4cCI6MjA5OTMzMDgzN30.Po2m7uhlMTc43Pdg8pohwvDsQ_UDFRS-n9UnTQ44nXA';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let currentUser = null;

function setAuthUI(session) {
  const badge    = document.getElementById('header-badge');
  const hEmail   = document.getElementById('header-email');
  const authItem = document.getElementById('header-menu-auth');
  if (session) {
    currentUser = session.user;
    badge.classList.add('visible');
    hEmail.textContent = session.user.email;
    if (authItem) {
      authItem.textContent = 'Sign Out';
      authItem.removeAttribute('href');
      authItem.onclick = function(e) { e.preventDefault(); doMenuSignOut(); };
    }
  } else {
    currentUser = null;
    badge.classList.remove('visible');
    hEmail.textContent = '';
    if (authItem) {
      authItem.textContent = 'Sign In';
      authItem.setAttribute('href', 'login.html');
      authItem.onclick = null;
    }
  }
}

async function doMenuSignOut() {
  closeHeaderMenu();
  await sb.auth.signOut();
  setAuthUI(null);
  showToast('Signed out');
}

sb.auth.getSession().then(({ data }) => setAuthUI(data.session)).catch(() => setAuthUI(null));

// ── Header menu dropdown ──────────────────────────────────────────────────────
function toggleHeaderMenu() {
  const dropdown = document.getElementById('header-menu-dropdown');
  if (dropdown) dropdown.classList.toggle('open');
}
function closeHeaderMenu() {
  const dropdown = document.getElementById('header-menu-dropdown');
  if (dropdown) dropdown.classList.remove('open');
}
document.addEventListener('click', function(e) {
  const menu = document.getElementById('header-menu');
  const dropdown = document.getElementById('header-menu-dropdown');
  if (menu && dropdown && dropdown.classList.contains('open') && !menu.contains(e.target)) {
    dropdown.classList.remove('open');
  }
});

// ── Sound toggle ─────────────────────────────────────────────────────────────
function showToast(msg) {
  const existing = document.getElementById('hcp-toast');
  if (existing) existing.remove();
  const t = document.createElement('div');
  t.id = 'hcp-toast';
  t.style.cssText = 'position:fixed;bottom:130px;left:50%;transform:translateX(-50%) translateY(20px);background:color-mix(in srgb, var(--surface) 97%, transparent);color:var(--gold);border:0.5px solid color-mix(in srgb, var(--gold) 40%, transparent);padding:12px 24px;border-radius:14px;font-size:14px;font-weight:500;letter-spacing:0.03em;z-index:999;white-space:nowrap;backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);box-shadow:0 4px 24px rgba(0,0,0,0.4);transition:opacity 0.3s,transform 0.3s;opacity:0;';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => { t.style.opacity='1'; t.style.transform='translateX(-50%) translateY(0)'; }, 10);
  setTimeout(() => t.remove(), 2400);
}

const soundToggle = document.getElementById('sound-toggle');
soundToggle.checked = localStorage.getItem('golf-sound-enabled') !== 'false';
function toggleSound(enabled) {
  localStorage.setItem('golf-sound-enabled', enabled ? 'true' : 'false');
}

// ── Theme toggle ──────────────────────────────────────────────────────────────
function refreshThemeUI() {
  const isLight = getTheme() === 'light';
  const toggle = document.getElementById('theme-toggle');
  const icon   = document.getElementById('theme-icon');
  const desc   = document.getElementById('theme-desc');
  if (toggle) toggle.checked = isLight;
  if (icon)   icon.innerHTML = isLight ? '&#9728;&#65039;' : '&#127769;';
  if (desc)   desc.textContent = 'Currently using ' + (isLight ? 'Light' : 'Dark') + ' theme';
}
function toggleThemeSwitch(checked) {
  setTheme(checked ? 'light' : 'dark');
  refreshThemeUI();
}
refreshThemeUI();


</script>

<script>
// ── Continue round ────────────────────────────────────────────────────────────
(function() {
  var scores = JSON.parse(localStorage.getItem('golf-scores-v1') || '{}');
  var hole   = localStorage.getItem('golf-current-hole');
  if (Object.keys(scores).length > 0 || (hole && parseInt(hole) > 1)) {
    var el = document.getElementById('nav-play');
    if (el) el.setAttribute('href', 'round.html');
  }
})();
</script>
</body>
</html>
