<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0D0D0D">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.svg">
<title>Shot Tracker — Round</title>
<script>
  // Prevent double-tap zoom on iOS Safari without blocking normal taps
  (function() {
    var lastTap = 0;
    document.addEventListener('touchend', function(e) {
      var now = Date.now();
      if (now - lastTap < 300) e.preventDefault();
      lastTap = now;
    }, { passive: false });
  })();
</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --gold: #C8A96A; --gold-muted: #9A7C47;
    --text-primary: #F2F2F2; --text-secondary: #BDBDBD; --text-muted: #9A9A9A;
    --bg: #0D0D0D; --card: rgba(28,28,28,0.85); --border: rgba(200,169,106,0.15); --border-mid: rgba(200,169,106,0.25);
    --radius: 14px; --radius-sm: 9px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  html, body { height: 100%; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text-primary); overflow: hidden; }
  .app { position: relative; width: 100%; height: 100%; max-width: 430px; margin: 0 auto; overflow: hidden; }
  #app { display: flex; flex-direction: column; height: 100%; position: relative; z-index: 5; }

  /* Background */
  .hero { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; }
  .hero-img { width: 100%; height: 100%; object-fit: cover; object-position: center; display: block; }
  .hero-overlay { position: absolute; inset: 0; background: rgba(13,13,13,0.88); }

  /* Header */
  .header-img-wrap { position: relative; z-index: 10; width: 100%; flex-shrink: 0; }
  .header-img { width: 100%; height: auto; display: block; }
  .topbar-action { background: transparent; border: 0.5px solid rgba(200,169,106,0.4); border-radius: 8px; padding: 6px 12px; color: var(--gold); font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; font-family: inherit; position: absolute; right: 14px; bottom: 10px; }

  /* Tab bar */
  .tab-bar { background: transparent; border-bottom: 0.5px solid rgba(200,169,106,0.15); padding: 0 16px 12px; display: flex; gap: 6px; flex-shrink: 0; }
  .tab { flex: 1; padding: 8px; font-size: 13px; font-weight: 500; text-align: center; border-radius: 8px; border: 0.5px solid rgba(200,169,106,0.15); cursor: pointer; background: rgba(200,169,106,0.06); color: var(--text-muted); font-family: inherit; }
  .tab.active { background: var(--gold); color: #0D0D0D; border-color: var(--gold); }

  /* Content */
  .content { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 14px 14px calc(var(--safe-bottom) + 110px); }
  .screen { display: none; } .screen.active { display: block; }

  /* Course strip */

  /* Top row: Hole nav | Par */
  .top-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }

  .hole-nav-card { background: var(--card); border: 0.5px solid var(--border); border-radius: var(--radius); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: space-between; padding: 14px 10px; }
  .hole-nav-btn { width: 38px; height: 38px; background: rgba(200,169,106,0.12); border: 0.5px solid rgba(200,169,106,0.25); border-radius: 8px; font-size: 18px; color: var(--gold); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
  .hole-nav-btn:disabled { opacity: 0.3; cursor: default; }
  .hole-title-text { font-size: 20px; font-weight: 300; color: var(--text-primary); flex: 1; text-align: center; letter-spacing: 0.04em; }

  .par-card { background: var(--card); border: 0.5px solid var(--border); border-radius: var(--radius); backdrop-filter: blur(8px); display: flex; align-items: center; justify-content: center; gap: 10px; padding: 10px 12px; }
  .par-col { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .par-label { font-size: 9px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-muted); }
  .par-input-field { width: 52px; font-size: 34px; font-weight: 300; color: var(--text-primary); background: transparent; border: none; text-align: center; font-family: inherit; -moz-appearance: textfield; line-height: 1; letter-spacing: -0.02em; }
  .par-input-field::-webkit-outer-spin-button, .par-input-field::-webkit-inner-spin-button { -webkit-appearance: none; }
  .par-input-field:focus { outline: none; color: var(--gold); }
  .par-input-field::placeholder { color: rgba(242,242,242,0.25); }
  .par-save-btn { background: transparent; color: var(--gold); border: 0.5px solid var(--gold); border-radius: 8px; padding: 8px 14px; font-size: 14px; font-weight: 500; cursor: pointer; font-family: inherit; white-space: nowrap; }
  .par-save-btn:active { opacity: 0.75; }

  /* Score card */
  .score-card { background: var(--card); border: 0.5px solid var(--border); border-radius: var(--radius); backdrop-filter: blur(8px); padding: 12px 14px 14px; margin-bottom: 12px; display: flex; flex-direction: column; align-items: center; }
  .score-card-label { font-size: 10px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px; }
  .score-row { display: flex; align-items: center; width: 100%; }
  .score-btn { width: 45px; height: 45px; border-radius: var(--radius); background: rgba(200,169,106,0.1); border: 0.5px solid rgba(200,169,106,0.25); color: var(--gold); font-size: 24px; font-weight: 300; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-family: inherit; line-height: 1; }
  .score-btn:active { background: rgba(200,169,106,0.22); transform: scale(0.94); }
  .score-display { display: flex; align-items: center; justify-content: center; }
  .score-number { font-size: 56px; font-weight: 300; color: var(--text-primary); line-height: 1; letter-spacing: -0.04em; }
  .score-spacer { flex: 1; }
  .score-diff-zone { flex: 1; display: flex; align-items: center; justify-content: flex-start; padding-left: 8px; }
  .score-diff { font-size: 18px; font-weight: 500; }
  .score-diff.over  { color: #e74c3c; }
  .score-diff.under { color: var(--gold); }
  .score-diff.even  { color: var(--text-muted); }

  /* Buttons */
  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 16px; border-radius: var(--radius); border: none; font-size: 16px; font-weight: 500; cursor: pointer; transition: opacity 0.15s, transform 0.1s; margin-bottom: 10px; font-family: inherit; letter-spacing: 0.03em; }
  .btn:last-child { margin-bottom: 0; }
  .btn:active { opacity: 0.82; transform: scale(0.985); }
  .btn-primary { background: var(--gold); color: #0D0D0D; }
  .btn-outline { background: transparent; color: var(--gold); border: 0.5px solid var(--gold); }

  /* Summary */
  .summary-card { background: var(--card); border: 0.5px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 12px; }
  .sum-header { background: rgba(200,169,106,0.12); border-bottom: 0.5px solid rgba(200,169,106,0.2); padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; }
  .sum-header-title { font-size: 15px; font-weight: 500; color: var(--gold); }
  .sum-header-sub { font-size: 13px; color: var(--text-muted); }
  .sum-row { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 0.5px solid rgba(200,169,106,0.08); }
  .sum-row:last-child { border-bottom: none; }
  .sum-bubble { width: 24px; height: 24px; border-radius: 50%; background: rgba(200,169,106,0.12); font-size: 11px; font-weight: 700; color: var(--gold); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .sum-club { flex: 1; font-size: 14px; font-weight: 500; }
  .sum-dist { font-size: 14px; color: var(--text-secondary); }
  .sum-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0; border-top: 0.5px solid rgba(200,169,106,0.12); }
  .sum-stat { display: flex; align-items: center; justify-content: center; padding: 10px 6px; border-right: 0.5px solid rgba(200,169,106,0.12); font-size: 15px; font-weight: 500; color: var(--text-primary); }
  .sum-stat:last-child { border-right: none; }
  .sum-footer { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: rgba(200,169,106,0.06); border-top: 0.5px solid var(--border); }
  .sum-footer-label { font-size: 13px; font-weight: 600; color: var(--text-secondary); }
  .sum-footer-val { font-size: 15px; font-weight: 500; color: var(--gold); }
  .empty-state { text-align: center; padding: 32px 16px; color: var(--text-muted); font-size: 14px; line-height: 1.6; }
  .empty-icon { font-size: 36px; margin-bottom: 8px; display: block; }

  /* Scorecard */
  .score-table-wrap { background: var(--card); border: 0.5px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 14px; }
  .score-table { width: 100%; border-collapse: collapse; font-size: 16px; }
  .score-table th { background: rgba(200,169,106,0.12); color: var(--gold); padding: 11px 6px; text-align: center; font-weight: 500; letter-spacing: 0.06em; font-size: 14px; }
  .score-table th:first-child { text-align: left; padding-left: 14px; }
  .score-table td { padding: 12px 6px; text-align: center; border-bottom: 0.5px solid var(--border); }
  .score-table td:first-child { font-weight: 600; text-align: left; padding-left: 14px; }
  .score-table tr:last-child td { border-bottom: none; font-weight: 600; background: rgba(200,169,106,0.06); }
  .sc-input { width: 44px; background: rgba(13,13,13,0.7); border: 0.5px solid rgba(200,169,106,0.3); border-radius: 6px; padding: 4px 6px; font-size: 15px; font-weight: 500; color: var(--gold); text-align: center; font-family: inherit; -moz-appearance: textfield; }
  .sc-input::-webkit-outer-spin-button, .sc-input::-webkit-inner-spin-button { -webkit-appearance: none; }
  .sc-input:focus { outline: none; border-color: var(--gold); }
  .sc-save-btn { background: transparent; border: 0.5px solid var(--gold); color: var(--gold); border-radius: 6px; padding: 3px 10px; font-size: 11px; font-weight: 500; cursor: pointer; font-family: inherit; display: flex; align-items: center; justify-content: center; }

  /* Dialog */
  .dialog-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; display: flex; align-items: flex-end; justify-content: center; animation: fadeIn 0.15s ease; }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }
  .dialog-sheet { background: #1C1C1C; border-top: 0.5px solid rgba(200,169,106,0.2); border-radius: 22px 22px 0 0; padding: 8px 0 calc(var(--safe-bottom) + 8px); width: 100%; max-width: 430px; animation: slideUp 0.2s ease; }
  @keyframes slideUp { from{transform:translateY(40px);opacity:0} to{transform:translateY(0);opacity:1} }
  .dialog-handle { width: 36px; height: 4px; background: var(--border-mid); border-radius: 2px; margin: 8px auto 16px; }
  .dialog-icon { text-align: center; margin-bottom: 8px; min-height: 36px; display: flex; align-items: center; justify-content: center; font-size: 36px; }
  .dialog-title { font-size: 18px; font-weight: 700; text-align: center; color: var(--text-primary); padding: 0 20px; margin-bottom: 6px; }
  .dialog-sub { font-size: 14px; color: var(--text-secondary); text-align: center; padding: 0 24px; margin-bottom: 20px; line-height: 1.5; }
  .dialog-actions { padding: 0 16px; display: flex; flex-direction: column; gap: 8px; }
  .dialog-btn { display: flex; align-items: center; justify-content: center; width: 100%; padding: 15px; border-radius: var(--radius); border: none; font-size: 15px; font-weight: 600; cursor: pointer; transition: opacity 0.15s; font-family: inherit; }
  .dialog-btn:active { opacity: 0.82; }
  .dialog-btn-primary { background: var(--gold); color: #0D0D0D; }
  .dialog-btn-danger { background: #c0392b; color: #fff; }
  .dialog-btn-secondary { background: rgba(28,28,28,0.85); color: var(--text-muted); border: 0.5px solid var(--border); }

  /* Toast */
  #toast { position: fixed; bottom: calc(var(--safe-bottom) + 120px); left: 50%; transform: translateX(-50%) translateY(20px); background: rgba(28,28,28,0.95); color: var(--text-primary); border: 0.5px solid var(--border); padding: 10px 20px; border-radius: 100px; font-size: 13px; font-weight: 500; opacity: 0; transition: opacity 0.25s, transform 0.25s; pointer-events: none; white-space: nowrap; z-index: 999; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Bottom nav */
  .nav-shell-round { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 430px; z-index: 150; }
  .nav-row-round { display: flex; background: rgba(13,13,13,0.95); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  .nav-primary-r { border-top: 0.5px solid rgba(200,169,106,0.2); padding-bottom: calc(var(--safe-bottom) + 6px); transform: translateY(0); transition: transform 350ms cubic-bezier(0.4,0,0.2,1); will-change: transform; position: relative; z-index: 2; }
  .nav-primary-r.raised { transform: translateY(-100%); }
  .nav-secondary-r { border-top: 0.5px solid rgba(200,169,106,0.12); padding-bottom: calc(var(--safe-bottom) + 6px); position: absolute; bottom: 0; left: 0; right: 0; transform: translateY(100%); transition: transform 350ms cubic-bezier(0.4,0,0.2,1); will-change: transform; z-index: 1; }
  .nav-secondary-r.open { transform: translateY(0); }
  .nav-item-round { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px 4px 6px; cursor: pointer; text-decoration: none; background: none; border: none; -webkit-tap-highlight-color: transparent; transition: opacity 0.15s; }
  .nav-item-round:active { opacity: 0.7; }
  .nav-item-round img { width: 70px; height: 70px; object-fit: contain; display: block; }
  .nav-overlay-round { position: fixed; inset: 0; background: rgba(0,0,0,0.5); opacity: 0; pointer-events: none; transition: opacity 350ms ease; z-index: 140; }
  .nav-overlay-round.open { opacity: 1; pointer-events: auto; }
</style>
</head>
<body>
<div class="app">
<div class="hero">
  <img class="hero-img" src="Back_ground_New.jpg" alt="">
  <div class="hero-overlay"></div>
</div>
<div id="app">
  <div class="header-img-wrap">
    <img class="header-img" src="Header.webp" alt="Shot Tracker">
    <button class="topbar-action" onclick="newRound()">New Round</button>
  </div>
  <div class="tab-bar">
    <button class="tab active" onclick="showTab('round')" id="tab-round">Round</button>
    <button class="tab" onclick="showTab('summary')" id="tab-summary">Summary</button>
    <button class="tab" onclick="showTab('scorecard')" id="tab-scorecard">Scorecard</button>
  </div>
  <div class="content">

    <!-- ROUND TAB -->
    <div class="screen active" id="screen-round">

      <!-- Row 1: Hole nav | Par -->
      <div class="top-row">
        <div class="hole-nav-card">
          <button class="hole-nav-btn" id="hole-prev" onclick="changeHole(-1)" aria-label="Previous hole">&#8592;</button>
          <div class="hole-title-text" id="hole-title">Hole 1</div>
          <button class="hole-nav-btn" id="hole-next" onclick="changeHole(1)" aria-label="Next hole">&#8594;</button>
        </div>
        <div class="par-card" id="par-area">
          <!-- populated by renderParArea() -->
        </div>
      </div>

      <!-- Row 2: Score entry -->
      <div class="score-card">
        <span class="score-card-label">This Hole</span>
        <div class="score-row">
          <button class="score-btn" onclick="adjustScore(-1)" aria-label="Decrease">&#8722;</button>
          <div class="score-spacer"></div>
          <div class="score-display">
            <span class="score-number" id="score-number">0</span>
          </div>
          <div class="score-diff-zone">
            <span class="score-diff" id="score-diff"></span>
          </div>
          <button class="score-btn" onclick="adjustScore(1)" aria-label="Increase">+</button>
        </div>
      </div>

      <!-- Putts entry -->
      <div class="score-card" style="margin-bottom:12px;">
        <span class="score-card-label">Putts</span>
        <div class="score-row">
          <button class="score-btn" onclick="adjustPutts(-1)" aria-label="Decrease putts">&#8722;</button>
          <div class="score-spacer"></div>
          <div class="score-display">
            <span class="score-number" id="putts-number">0</span>
          </div>
          <div class="score-diff-zone"></div>
          <button class="score-btn" onclick="adjustPutts(1)" aria-label="Increase putts">+</button>
        </div>
      </div>

      <button class="btn btn-primary" onclick="saveHole()">Save Hole &amp; Next &#8594;</button>
      <button class="btn btn-outline" id="btn-finish-round" onclick="finishRound()" style="display:none;">Finish &amp; Save Round</button>

    </div>

    <!-- SUMMARY TAB -->
    <div class="screen" id="screen-summary">
      <div id="summary-content"></div>
      <button class="btn btn-outline" style="margin-top:4px" onclick="exportCSV()">&#8659; Download CSV</button>
      <button class="btn btn-outline" onclick="exportEmail()">&#9993; Email round</button>
    </div>

    <!-- SCORECARD TAB -->
    <div class="screen" id="screen-scorecard">
      <div class="score-table-wrap">
        <table class="score-table">
          <thead><tr><th>Hole</th><th>Par</th><th>Shots</th><th>+/-</th><th>Putts</th></tr></thead>
          <tbody id="scorecard-body"></tbody>
        </table>
      </div>
    </div>

  </div>
</div>

<!-- Dialog -->
<div id="dialog-overlay" class="dialog-overlay" style="display:none" onclick="closeDialogOutside(event)">
  <div class="dialog-sheet" onclick="event.stopPropagation()">
    <div class="dialog-handle"></div>
    <div id="dialog-icon" class="dialog-icon"></div>
    <div id="dialog-title" class="dialog-title"></div>
    <div id="dialog-sub" class="dialog-sub"></div>
    <div id="dialog-actions" class="dialog-actions"></div>
  </div>
</div>

<div id="toast"></div>

<script>
// ── State ─────────────────────────────────────────────────────────────────────
let currentHole  = 1;
let holeScores   = JSON.parse(localStorage.getItem('golf-scores-v1') || '{}');
let holePars     = JSON.parse(localStorage.getItem('golf-pars-v1')   || '{}');
let holePutts    = JSON.parse(localStorage.getItem('golf-putts-v1')   || '{}');
// Legacy shot data — kept so Summary tab can show old shot-by-shot rounds
let shots        = JSON.parse(localStorage.getItem('golf-shots-v3')  || '[]');
let currentCourse = JSON.parse(localStorage.getItem('golf-current-course') || 'null');

function persist() {
  localStorage.setItem('golf-scores-v1', JSON.stringify(holeScores));
  localStorage.setItem('golf-pars-v1',   JSON.stringify(holePars));
  localStorage.setItem('golf-putts-v1',  JSON.stringify(holePutts));
}

// ── Tabs ──────────────────────────────────────────────────────────────────────
function showTab(t) {
  ['round','summary','scorecard'].forEach(id => {
    document.getElementById('screen-'+id).classList.toggle('active', id===t);
    document.getElementById('tab-'+id).classList.toggle('active', id===t);
  });
  if (t==='summary') renderSummary();
  if (t==='scorecard') renderScorecard();
}

// ── New round ─────────────────────────────────────────────────────────────────
function newRound() {
  const hasData = Object.keys(holeScores).some(h => holeScores[h] > 0) || shots.length > 0;
  if (!hasData) { showToast('Nothing to clear'); return; }
  showDialog({
    icon: '&#9971;',
    title: 'Start a New Round?',
    sub: 'You have a round in progress. What would you like to do?',
    buttons: [
      { label: 'Save this round first', style: 'primary', action: () => { saveRoundToHistory(); resetState(); window.location.href = 'start.html'; }},
      { label: 'Discard & start fresh',  style: 'danger',   action: () => { resetState(); window.location.href = 'start.html'; }},
      { label: 'Cancel — keep playing',  style: 'secondary', action: () => {} }
    ]
  });
}

function resetState() {
  holeScores = {}; holePars = {}; holePutts = {}; shots = []; currentHole = 1; currentCourse = null;
  localStorage.removeItem('golf-scores-v1');
  localStorage.removeItem('golf-pars-v1');
  localStorage.removeItem('golf-putts-v1');
  localStorage.removeItem('golf-shots-v3');
  localStorage.removeItem('golf-current-course');
}

// ── Par ───────────────────────────────────────────────────────────────────────
function renderParArea() {
  const savedPar = holePars[currentHole];
  document.getElementById('par-area').innerHTML =
    '<div class="par-col">' +
      '<span class="par-label">Par</span>' +
      '<input class="par-input-field" type="number" id="par-input" min="3" max="5" inputmode="numeric"' +
        ' value="' + (savedPar || '') + '" placeholder="&#8211;"' +
        ' onblur="savePar()" onchange="savePar()">' +
    '</div>' +
    '<button class="par-save-btn" onclick="savePar()">Save</button>';
}

function savePar() {
  const inp = document.getElementById('par-input');
  if (!inp) return;
  const v = parseInt(inp.value);
  if (v !== 3 && v !== 4 && v !== 5) {
    showDialog({
      icon: '&#9971;',
      title: 'Invalid Par',
      sub: 'Par must be either 3, 4 or 5. Please enter a valid value.',
      buttons: [{ label: 'Got it', style: 'primary', action: () => {} }]
    });
    return;
  }
  holePars[currentHole] = v;
  persist();
  updateScoreDisplay();
  writeCoursePars();
}

function writeCoursePars() {
  if (!currentCourse || !currentCourse.name) return;
  try {
    const store = JSON.parse(localStorage.getItem('golf-course-pars') || '{}');
    if (!store[currentCourse.name]) store[currentCourse.name] = {};
    store[currentCourse.name][currentHole] = holePars[currentHole];
    localStorage.setItem('golf-course-pars', JSON.stringify(store));
  } catch(e) {}
}

// ── Score entry ───────────────────────────────────────────────────────────────
function currentDefault() {
  return holePars[currentHole] || 0;
}

function adjustScore(delta) {
  const base = holeScores[currentHole] !== undefined ? holeScores[currentHole] : currentDefault();
  const next = Math.max(0, base + delta);
  holeScores[currentHole] = next;
  persist();
  updateScoreDisplay();
}

function updateScoreDisplay() {
  const displayed = holeScores[currentHole] !== undefined ? holeScores[currentHole] : currentDefault();
  document.getElementById('score-number').textContent = displayed;
  updateScoreDiff();
  updateFinishBtn();
}

function updateScoreDiff() {
  const score = holeScores[currentHole] !== undefined ? holeScores[currentHole] : currentDefault();
  const par   = holePars[currentHole];
  const el    = document.getElementById('score-diff');
  if (!par || score === 0) { el.textContent = ''; el.className = 'score-diff'; return; }
  const diff = score - par;
  if (diff === 0) { el.textContent = 'E';         el.className = 'score-diff even'; }
  else if (diff > 0) { el.textContent = '+'+diff; el.className = 'score-diff over'; }
  else             { el.textContent = diff;        el.className = 'score-diff under'; }
}

// ── Putts ───────────────────────────────────────────────────────────────────
function adjustPutts(delta) {
  const next = Math.max(0, (holePutts[currentHole] || 0) + delta);
  holePutts[currentHole] = next;
  persist();
  updatePuttsDisplay();
}

function updatePuttsDisplay() {
  document.getElementById('putts-number').textContent = holePutts[currentHole] || 0;
}

// ── Save hole & next ──────────────────────────────────────────────────────────
function saveHole() {
  if ((holeScores[currentHole] || 0) === 0) { showToast('Enter a score first'); return; }
  persist();
  if (currentHole >= 18) { showToast('Last hole saved &#9971;'); updateFinishBtn(); return; }
  currentHole++;
  renderRound();
  showToast('Hole saved — Hole ' + currentHole);
}

// ── Change hole ───────────────────────────────────────────────────────────────
function changeHole(dir) {
  const next = currentHole + dir;
  if (next < 1 || next > 18) return;
  currentHole = next;
  renderRound();
  showToast('Hole ' + currentHole);
}

// ── Render round tab ──────────────────────────────────────────────────────────
function renderRound() {
  document.getElementById('hole-title').textContent = 'Hole ' + currentHole;
  document.getElementById('hole-prev').disabled = currentHole === 1;
  document.getElementById('hole-next').disabled = currentHole === 18;
  renderParArea();
  updateScoreDisplay();
  updatePuttsDisplay();
}

// ── Finish round ──────────────────────────────────────────────────────────────
function updateFinishBtn() {
  const has = Object.keys(holeScores).some(h => holeScores[h] > 0);
  const btn = document.getElementById('btn-finish-round');
  if (btn) btn.style.display = has ? 'flex' : 'none';
}

function finishRound() {
  const count = Object.keys(holeScores).filter(h => holeScores[h] > 0).length;
  if (!count) { showToast('No scores to save'); return; }
  showDialog({
    icon: '&#127942;',
    title: 'Finish & Save Round?',
    sub: 'Save ' + count + ' hole' + (count===1?'':'s') + ' to your round history?',
    buttons: [
      { label: 'Save round',            style: 'primary',   action: doFinishRound },
      { label: 'Cancel — keep playing', style: 'secondary', action: () => {} }
    ]
  });
}

function doFinishRound() {
  saveRoundToHistory();
  resetState();
  showToast('Round saved!');
  setTimeout(() => window.location.href = 'index.html', 1200);
}

function saveRoundToHistory() {
  const scoredHoles = Object.keys(holeScores).map(Number).filter(h => holeScores[h] > 0);
  if (!scoredHoles.length) return;
  const totalScore = scoredHoles.reduce((a,h) => a + holeScores[h], 0);
  const totalPar   = scoredHoles.reduce((a,h) => a + (holePars[h] || 0), 0);
  const date = new Date();
  const round = {
    id:         Date.now().toString(),
    date:       date.toLocaleDateString('en-AU'),
    dateISO:    date.toISOString(),
    course:     currentCourse ? currentCourse.name   : 'Unknown Course',
    suburb:     currentCourse ? currentCourse.suburb : '',
    holes:      scoredHoles.length,
    totalScore: totalScore,
    totalPar:   totalPar,
    scoreDiff:  totalPar ? totalScore - totalPar : null,
    pars:       { ...holePars },
    holeScores: { ...holeScores },
    holePutts:  { ...holePutts },
    shots:      totalScore,
    totalDist:  0,
    shotData:   scoredHoles.sort((a,b)=>a-b).map(h => ({ hole: h, score: holeScores[h], par: holePars[h]||null }))
  };
  const history = JSON.parse(localStorage.getItem('golf-round-history') || '[]');
  history.unshift(round);
  localStorage.setItem('golf-round-history', JSON.stringify(history));
}

// ── Summary ───────────────────────────────────────────────────────────────────
function renderSummary() {
  const el = document.getElementById('summary-content');
  const scoredHoles = Object.keys(holeScores).map(Number).filter(h => holeScores[h] > 0).sort((a,b)=>a-b);
  const legacyHoles = [...new Set(shots.map(s=>s.hole))].filter(h => !holeScores[h]).sort((a,b)=>a-b);
  const allHoles    = [...new Set([...scoredHoles, ...legacyHoles])].sort((a,b)=>a-b);

  if (!allHoles.length) {
    el.innerHTML = '<div class="empty-state"><span class="empty-icon">&#128202;</span>No scores logged yet.</div>';
    return;
  }

  // Avg putts footer
  const holesPuttedCount = scoredHoles.filter(h => holePutts[h] > 0).length;
  const totalPutts = scoredHoles.reduce((a,h) => a + (holePutts[h] || 0), 0);
  const avgPutts = holesPuttedCount > 0 ? (totalPutts / holesPuttedCount).toFixed(1) : null;
  const puttsFooter = avgPutts
    ? '<div class="summary-card"><div class="sum-footer" style="border-top:none;">' +
      '<span class="sum-footer-label">Avg putts per hole</span>' +
      '<span class="sum-footer-val">' + avgPutts + '</span>' +
      '</div></div>'
    : '';

  el.innerHTML = allHoles.map(h => {
    const score = holeScores[h];
    const par   = holePars[h];
    if (score) {
      const diff = par ? score - par : null;
      const diffStr = diff===null ? '&#8212;' : (diff===0 ? 'E' : (diff>0 ? '+'+diff : ''+diff));
      const diffCol = diff===null ? 'color:var(--text-muted)' : (diff>0 ? 'color:#e74c3c' : diff<0 ? 'color:var(--gold)' : 'color:var(--text-muted)');
      const putts = holePutts[h] || 0;
      return '<div class="summary-card">' +
        '<div class="sum-header"><span class="sum-header-title">Hole ' + h + (par?' &middot; Par '+par:'') + '</span></div>' +
        '<div class="sum-stats">' +
          '<div class="sum-stat">' + score + ' shots</div>' +
          '<div class="sum-stat" style="' + diffCol + '">' + diffStr + '</div>' +
          '<div class="sum-stat">' + (putts||'&#8212;') + ' putts</div>' +
        '</div>' +
        '</div>';
    } else {
      const hs = shots.filter(s => s.hole === h);
      const td = hs.reduce((a,s) => a+(s.dist||0), 0);
      return '<div class="summary-card"><div class="sum-header"><span class="sum-header-title">Hole '+h+'</span><span class="sum-header-sub">'+hs.length+' shot'+(hs.length===1?'':'s')+'</span></div>' +
        hs.map((s,i) => '<div class="sum-row"><div class="sum-bubble">'+(i+1)+'</div><div class="sum-club">'+(s.clubShort||s.club)+'</div><div class="sum-dist">'+(s.dist?s.dist+'m':'&#8212;')+'</div></div>').join('') +
        (td?'<div class="sum-footer"><span class="sum-footer-label">Total distance</span><span class="sum-footer-val">'+td+'m</span></div>':'') +
        '</div>';
    }
  }).join('') + puttsFooter;
}

// ── Scorecard ─────────────────────────────────────────────────────────────────
function renderScorecard() {
  const tbody = document.getElementById('scorecard-body');
  let ts=0, tp=0, tputts=0;
  const rows=[];
  for (let h=1; h<=18; h++) {
    const score = holeScores[h] || shots.filter(s=>s.hole===h).length;
    if (score > 0) {
      const par   = holePars[h];
      const putts = holePutts[h] || 0;
      const diff  = par ? score - par : null;
      const ds    = diff===null ? '&#8212;' : (diff===0?'E':(diff>0?'+'+diff:diff));
      ts += score; if(par) tp += par; tputts += putts;
      rows.push('<tr><td>'+h+'</td>' +
        '<td><input class="sc-input" type="number" min="3" max="5" inputmode="numeric" value="'+(par||'')+'" placeholder="&#8211;" onchange="scSavePar('+h+',this.value)"></td>' +
        '<td><input class="sc-input" type="number" min="1" max="30" inputmode="numeric" value="'+score+'" onchange="scSaveScore('+h+',this.value)"></td>' +
        '<td>'+ds+'</td>' +
        '<td>'+(putts||'&#8212;')+'</td></tr>');
    }
  }
  if (!rows.length) { tbody.innerHTML='<tr><td colspan="5" style="text-align:center;color:var(--text-muted);padding:24px">No scores yet</td></tr>'; return; }
  const tdiff=tp?ts-tp:null;
  const tds=tdiff===null?'&#8212;':(tdiff===0?'E':(tdiff>0?'+'+tdiff:tdiff));
  tbody.innerHTML = rows.join('') +
    '<tr><td style="padding-left:14px;">Total</td><td>'+(tp||'&#8212;')+'</td><td>'+ts+'</td><td>'+tds+'</td><td>'+(tputts||'&#8212;')+'</td></tr>' +
    '<tr><td colspan="5" style="padding:10px 14px;"><button class="sc-save-btn" style="width:100%;" onclick="scSaveAll()">Save</button></td></tr>';
}

function scSavePar(hole,val) {
  const v=parseInt(val); if(v===3||v===4||v===5){holePars[hole]=v;persist();writeCoursePars();}
}
function scSaveScore(hole,val) {
  const v=parseInt(val); if(!isNaN(v)&&v>=0){holeScores[hole]=v;persist();}
}
function scSaveAll() { persist(); renderScorecard(); showToast('Scorecard saved'); }

// ── Export ────────────────────────────────────────────────────────────────────
function exportCSV() {
  const scoredHoles=Object.keys(holeScores).map(Number).filter(h=>holeScores[h]>0).sort((a,b)=>a-b);
  if (!scoredHoles.length && !shots.length) { showToast('No data to export'); return; }
  const date=new Date().toLocaleDateString('en-AU').replace(/\//g,'-');
  const rows=['Date,Hole,Par,Score,+/-'];
  scoredHoles.forEach(h=>{
    const par=holePars[h]||''; const diff=par?holeScores[h]-par:'';
    rows.push(date+','+h+','+par+','+holeScores[h]+','+(diff!==''?(diff>0?'+'+diff:diff):''));
  });
  const blob=new Blob([rows.join('\r\n')],{type:'text/csv'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='golf-round-'+date+'.csv';a.click();
  URL.revokeObjectURL(url); showToast('CSV downloaded');
}
function exportEmail() {
  const scoredHoles=Object.keys(holeScores).map(Number).filter(h=>holeScores[h]>0).sort((a,b)=>a-b);
  if (!scoredHoles.length){showToast('No scores to email');return;}
  const date=new Date().toLocaleDateString('en-AU');
  const lines=['Golf Round - '+date,''];
  let total=0;
  scoredHoles.forEach(h=>{
    const par=holePars[h];const sc=holeScores[h];total+=sc;
    const diff=par?(sc-par===0?'E':(sc-par>0?'+'+(sc-par):(sc-par))):'';
    lines.push('Hole '+h+(par?' (Par '+par+')':'')+': '+sc+' shots'+(diff?' ('+diff+')':''));
  });
  lines.push('');lines.push('Total: '+total+' shots');
  window.location.href='mailto:?subject='+encodeURIComponent('Golf Round - '+date)+'&body='+lines.join('%0D%0A');
}

// ── Dialog ────────────────────────────────────────────────────────────────────
function showDialog(opts) {
  document.getElementById('dialog-icon').innerHTML    = opts.icon  || '';
  document.getElementById('dialog-title').textContent = opts.title || '';
  document.getElementById('dialog-sub').textContent   = opts.sub   || '';
  document.getElementById('dialog-actions').innerHTML = opts.buttons.map((b,i) =>
    '<button class="dialog-btn dialog-btn-'+(b.style||'secondary')+'" onclick="dialogAction('+i+')">'+b.label+'</button>'
  ).join('');
  window._dialogActions = opts.buttons.map(b=>b.action);
  document.getElementById('dialog-overlay').style.display = 'flex';
}
function dialogAction(i) { closeDialog(); window._dialogActions?.[i]?.(); }
function closeDialogOutside(e) { if(e.target===document.getElementById('dialog-overlay')) closeDialog(); }
function closeDialog() { document.getElementById('dialog-overlay').style.display='none'; }

// ── Toast ─────────────────────────────────────────────────────────────────────
function showToast(msg) {
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}

// ── Nav drawer ────────────────────────────────────────────────────────────────
function openNavDrawer() {
  document.getElementById('nav-primary').classList.add('raised');
  document.getElementById('nav-secondary').classList.add('open');
  document.getElementById('nav-overlay').classList.add('open');
  document.getElementById('icon-more').src='Courses_2.png';
  document.getElementById('btn-more').onclick=()=>window.location.href='find.html';
}
function closeDrawer() {
  document.getElementById('nav-primary').classList.remove('raised');
  document.getElementById('nav-secondary').classList.remove('open');
  document.getElementById('nav-overlay').classList.remove('open');
  document.getElementById('icon-more').src='More.png';
  document.getElementById('btn-more').onclick=openNavDrawer;
}

// ── Init ──────────────────────────────────────────────────────────────────────
renderRound();
updateFinishBtn();
if('serviceWorker' in navigator){navigator.serviceWorker.register('/sw.js').catch(()=>{});}
</script>
