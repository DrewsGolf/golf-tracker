<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="theme.js"></script>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="gps-indicator.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0D0D0D">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.svg">
<title>Shot Tracker — Round</title>
<script>
  // Prevent double-tap zoom on iOS Safari without blocking normal taps
  (function() {
    var lastTap = 0;
    document.addEventListener('touchend', function(e) {
      var now = Date.now();
      if (now - lastTap < 300) e.preventDefault();
      lastTap = now;
    }, { passive: false });
  })();
</script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  /* ── Page-specific aliases + layout vars. Core theme colors (--bg, --gold,
     etc.) now come from theme.css, loaded in <head>. ── */
  :root {
    --card:       var(--surface);
    --border:     color-mix(in srgb, var(--gold) 15%, transparent);
    --border-mid: color-mix(in srgb, var(--gold) 25%, transparent);
    --radius: 14px; --radius-sm: 9px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  html, body { height: 100%; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text-primary); overflow: hidden; }
  .app { position: relative; width: 100%; height: 100%; max-width: 430px; margin: 0 auto; overflow: hidden; }
  #app { display: flex; flex-direction: column; height: 100%; position: relative; z-index: 5; }

  /* Header */
  .header-img-wrap { position: relative; z-index: 10; width: 100%; flex-shrink: 0; }

  /* ── Header icons — bottom left. Unlike other pages, round.html already
     has the auth badge (top-right) and New Round button (bottom-right)
     occupying the right side of the header, so these sit on the left. ── */
  .header-icons {
    position: absolute;
    bottom: 5px;
    left: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 60;
  }

  .header-icons a {
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    text-decoration: none;
  }

  .header-icons img {
    width: 38px;
    height: 38px;
    object-fit: contain;
    display: block;
  }

  .header-icons a:active { opacity: 0.7; }
  .header-img { width: 100%; height: auto; display: block; }
  .topbar-action { background: transparent; border: 0.5px solid color-mix(in srgb, var(--gold) 40%, transparent); border-radius: 8px; padding: 6px 12px; color: var(--gold); font-size: 13px; font-weight: 500; cursor: pointer; white-space: nowrap; font-family: inherit; position: absolute; right: 14px; bottom: 10px; }

  /* Tab bar */
  .tab-bar { background: transparent; border-bottom: 0.5px solid color-mix(in srgb, var(--gold) 15%, transparent); padding: 0 16px 12px; display: flex; gap: 6px; flex-shrink: 0; }
  .tab { flex: 1; padding: 8px; font-size: 13px; font-weight: 500; text-align: center; border-radius: 8px; border: 0.5px solid color-mix(in srgb, var(--gold) 15%, transparent); cursor: pointer; background: color-mix(in srgb, var(--gold) 6%, transparent); color: var(--text-muted); font-family: inherit; }
  .tab.active { background: var(--btn-primary); color: var(--on-btn-primary); border-color: var(--btn-primary); }

  /* Content */
  .content { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 14px 14px calc(var(--safe-bottom) + 110px); background: var(--bg); position: relative; z-index: 15; }
  .screen { display: none; } .screen.active { display: block; }

  /* Course strip */

  /* Top row: Hole nav | Par */
  .top-row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .green-status { text-align: center; font-size: 12px; color: var(--text-muted); margin-top: 4px; }
  .green-status b { color: var(--gold); font-weight: 500; }

  .hole-nav-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-soft); display: flex; align-items: center; justify-content: space-between; padding: 14px 10px; }
  .hole-nav-btn { width: 38px; height: 38px; background: color-mix(in srgb, var(--gold) 12%, transparent); border: 0.5px solid color-mix(in srgb, var(--gold) 25%, transparent); border-radius: 8px; font-size: 18px; color: var(--gold); display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
  .hole-nav-btn:disabled { opacity: 0.3; cursor: default; }
  .hole-title-text { font-size: 26px; font-weight: 500; color: var(--text-primary); flex: 1; text-align: center; letter-spacing: 0.02em; }

  .par-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-soft); display: flex; align-items: center; justify-content: center; gap: 10px; padding: 10px 12px; }
  .par-col { display: flex; flex-direction: column; align-items: center; gap: 2px; }
  .par-label { font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); }
  .par-input-field { width: 52px; font-size: 38px; font-weight: 400; color: var(--text-primary); background: transparent; border: none; text-align: center; font-family: inherit; -moz-appearance: textfield; line-height: 1; letter-spacing: -0.02em; }
  .par-input-field::-webkit-outer-spin-button, .par-input-field::-webkit-inner-spin-button { -webkit-appearance: none; }
  .par-input-field:focus { outline: none; color: var(--gold); }
  .par-input-field::placeholder { color: rgba(242,242,242,0.25); }
  .par-save-btn { background: transparent; color: var(--gold); border: 0.5px solid var(--gold); border-radius: 8px; padding: 8px 14px; font-size: 14px; font-weight: 500; cursor: pointer; font-family: inherit; white-space: nowrap; }
  .par-save-btn:active { opacity: 0.75; }

  /* Generic card — used by Green Location. Was previously undefined (bug: rendered unstyled). */
  .card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-soft); padding: 16px 14px; margin-bottom: 12px; }
  .card-label { font-size: 12px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: var(--gold); margin-bottom: 10px; }

  /* Score card */
  .score-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-soft); padding: 12px 14px 14px; margin-bottom: 12px; display: flex; flex-direction: column; align-items: center; }
  .score-card-label { font-size: 12px; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px; }
  .score-row { display: flex; align-items: center; width: 100%; }
  .score-btn { width: 50px; height: 50px; border-radius: 16px; background: color-mix(in srgb, var(--gold) 10%, transparent); border: 0.5px solid color-mix(in srgb, var(--gold) 25%, transparent); color: var(--gold); font-size: 26px; font-weight: 300; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-family: inherit; line-height: 1; }
  .score-btn:active { background: color-mix(in srgb, var(--gold) 22%, transparent); transform: scale(0.94); }
  .score-display { display: flex; align-items: center; justify-content: center; }
  .score-number { font-size: 60px; font-weight: 400; color: var(--text-primary); line-height: 1; letter-spacing: -0.03em; }
  .score-spacer { flex: 1; }
  .score-diff-zone { flex: 1; display: flex; align-items: center; justify-content: flex-start; padding-left: 8px; }
  .score-diff { font-size: 18px; font-weight: 500; }
  .score-diff.over  { color: var(--warning); }
  .score-diff.under { color: var(--gold); }
  .score-diff.even  { color: var(--text-muted); }

  /* Buttons */
  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 16px; border-radius: var(--radius); border: none; font-size: 16px; font-weight: 500; cursor: pointer; transition: opacity 0.15s, transform 0.1s; margin-bottom: 10px; font-family: inherit; letter-spacing: 0.03em; }
  .btn:last-child { margin-bottom: 0; }
  .btn:active { opacity: 0.82; transform: scale(0.985); }
  .btn-primary { background: var(--btn-primary); color: var(--on-btn-primary); font-size: 17px; font-weight: 700; }
  .btn-outline { background: transparent; color: var(--gold); border: 0.5px solid var(--gold); }

  /* Summary */
  .summary-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-soft); overflow: hidden; margin-bottom: 12px; }
  .sum-header { background: color-mix(in srgb, var(--gold) 12%, transparent); border-bottom: 0.5px solid color-mix(in srgb, var(--gold) 20%, transparent); padding: 10px 14px; display: flex; align-items: center; justify-content: space-between; }
  .sum-header-title { font-size: 15px; font-weight: 500; color: var(--gold); }
  .sum-header-sub { font-size: 13px; color: var(--text-muted); }
  .sum-row { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-bottom: 0.5px solid color-mix(in srgb, var(--gold) 8%, transparent); }
  .sum-row:last-child { border-bottom: none; }
  .sum-bubble { width: 24px; height: 24px; border-radius: 50%; background: color-mix(in srgb, var(--gold) 12%, transparent); font-size: 11px; font-weight: 700; color: var(--gold); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .sum-club { flex: 1; font-size: 14px; font-weight: 500; }
  .sum-dist { font-size: 14px; color: var(--text-secondary); }
  .sum-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 0; border-top: 0.5px solid color-mix(in srgb, var(--gold) 12%, transparent); }
  .sum-stat { display: flex; align-items: center; justify-content: center; padding: 10px 6px; border-right: 0.5px solid color-mix(in srgb, var(--gold) 12%, transparent); font-size: 15px; font-weight: 500; color: var(--text-primary); }
  .sum-stat:last-child { border-right: none; }
  .sum-footer { display: flex; align-items: center; justify-content: space-between; padding: 10px 14px; background: color-mix(in srgb, var(--gold) 6%, transparent); border-top: 0.5px solid var(--border); }
  .sum-footer-label { font-size: 13px; font-weight: 600; color: var(--text-secondary); }
  .sum-footer-val { font-size: 15px; font-weight: 500; color: var(--gold); }
  .empty-state { text-align: center; padding: 32px 16px; color: var(--text-muted); font-size: 14px; line-height: 1.6; }
  .empty-icon { font-size: 36px; margin-bottom: 8px; display: block; }

  /* Scorecard */
  .score-table-wrap { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius-lg); box-shadow: var(--shadow-soft); overflow: hidden; margin-bottom: 14px; }
  .score-table { width: 100%; border-collapse: collapse; font-size: 16px; }
  .score-table th { background: color-mix(in srgb, var(--gold) 12%, transparent); color: var(--gold); padding: 11px 6px; text-align: center; font-weight: 500; letter-spacing: 0.06em; font-size: 14px; }
  .score-table th:first-child { text-align: left; padding-left: 14px; }
  .score-table td { padding: 12px 6px; text-align: center; border-bottom: 0.5px solid var(--border); }
  .score-table td:first-child { font-weight: 600; text-align: left; padding-left: 14px; }
  .score-table tr:last-child td { border-bottom: none; font-weight: 600; background: color-mix(in srgb, var(--gold) 6%, transparent); }
  .sc-input { width: 44px; background: color-mix(in srgb, var(--bg) 70%, transparent); border: 0.5px solid color-mix(in srgb, var(--gold) 30%, transparent); border-radius: 6px; padding: 4px 6px; font-size: 15px; font-weight: 500; color: var(--gold); text-align: center; font-family: inherit; -moz-appearance: textfield; }
  .sc-input::-webkit-outer-spin-button, .sc-input::-webkit-inner-spin-button { -webkit-appearance: none; }
  .sc-input:focus { outline: none; border-color: var(--gold); }
  .sc-save-btn { background: transparent; border: 0.5px solid var(--gold); color: var(--gold); border-radius: 6px; padding: 3px 10px; font-size: 11px; font-weight: 500; cursor: pointer; font-family: inherit; display: flex; align-items: center; justify-content: center; }

  /* Dialog */
  .dialog-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; display: flex; align-items: flex-end; justify-content: center; animation: fadeIn 0.15s ease; }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }
  .dialog-sheet { background: var(--surface); border-top: 0.5px solid color-mix(in srgb, var(--gold) 20%, transparent); border-radius: 22px 22px 0 0; padding: 8px 0 calc(var(--safe-bottom) + 8px); width: 100%; max-width: 430px; animation: slideUp 0.2s ease; }
  @keyframes slideUp { from{transform:translateY(40px);opacity:0} to{transform:translateY(0);opacity:1} }
  .dialog-handle { width: 36px; height: 4px; background: var(--border-mid); border-radius: 2px; margin: 8px auto 16px; }
  .dialog-icon { text-align: center; margin-bottom: 8px; min-height: 36px; display: flex; align-items: center; justify-content: center; font-size: 36px; }
  .dialog-title { font-size: 18px; font-weight: 700; text-align: center; color: var(--text-primary); padding: 0 20px; margin-bottom: 6px; }
  .dialog-sub { font-size: 14px; color: var(--text-secondary); text-align: center; padding: 0 24px; margin-bottom: 20px; line-height: 1.5; }
  .dialog-actions { padding: 0 16px; display: flex; flex-direction: column; gap: 8px; }
  .dialog-btn { display: flex; align-items: center; justify-content: center; width: 100%; padding: 15px; border-radius: var(--radius); border: none; font-size: 15px; font-weight: 600; cursor: pointer; transition: opacity 0.15s; font-family: inherit; }
  .dialog-btn:active { opacity: 0.82; }
  .dialog-btn-primary { background: var(--btn-primary); color: var(--on-btn-primary); }
  .dialog-btn-danger { background: var(--warning); color: #fff; }
  .dialog-btn-secondary { background: color-mix(in srgb, var(--surface) 85%, transparent); color: var(--text-muted); border: 0.5px solid var(--border); }

  /* Toast */
  #toast { position: fixed; bottom: calc(var(--safe-bottom) + 120px); left: 50%; transform: translateX(-50%) translateY(20px); background: color-mix(in srgb, var(--surface) 97%, transparent); color: var(--gold); border: 0.5px solid color-mix(in srgb, var(--gold) 40%, transparent); padding: 12px 24px; border-radius: 14px; font-size: 14px; font-weight: 500; letter-spacing: 0.03em; opacity: 0; transition: opacity 0.3s, transform 0.3s; pointer-events: none; white-space: nowrap; z-index: 999; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); box-shadow: 0 4px 24px rgba(0,0,0,0.4); }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .nav-shell {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 100;
  }

  .nav-row {
    display: flex;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    border-top: 0.5px solid color-mix(in srgb, var(--gold) 20%, transparent);
    padding-bottom: calc(var(--safe-bottom) + 6px);
  }

  .nav-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 10px 4px 6px;
    text-decoration: none;
    background: none;
    border: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: opacity 0.15s;
  }

  .nav-item:active { opacity: 0.7; }

  .nav-item img {
    width: 70px;
    height: 70px;
    object-fit: contain;
    object-position: bottom;
    display: block;
  }
  /* Auth badge */
  .header-auth-badge { position: absolute; top: 10px; right: 14px; display: none; align-items: center; gap: 6px; background: rgba(13,13,13,0.6); backdrop-filter: blur(6px); border: 0.5px solid color-mix(in srgb, var(--gold) 20%, transparent); border-radius: 20px; padding: 5px 10px 5px 8px; z-index: 20; }
  .header-auth-badge.visible { display: flex; }
  .header-auth-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); flex-shrink: 0; }
  .header-auth-email { font-size: 11px; font-weight: 500; color: var(--gold); white-space: nowrap; }
</style>
</head>
<body>
<div class="app">
<div id="app">
  <div class="header-img-wrap" style="position:relative;">
    <img class="header-img" src="images/header.png" alt="Shot Tracker">
    <div class="header-auth-badge" id="header-badge"><div class="header-auth-dot"></div><span class="header-auth-email" id="header-email"></span></div>
    <div class="header-icons">
      <a href="index.html">
        <img src="icons/Home.png" alt="Home">
      </a>
      <a href="login.html">
        <img src="icons/login.png" alt="Login">
      </a>
    </div>
    <button class="topbar-action" onclick="newRound()">New Round</button>
  </div>
  <div class="tab-bar">
    <button class="tab active" onclick="showTab('round')" id="tab-round">Round</button>
    <button class="tab" onclick="showTab('summary')" id="tab-summary">Summary</button>
    <button class="tab" onclick="showTab('scorecard')" id="tab-scorecard">Scorecard</button>
  </div>
  <div class="content">

    <!-- ROUND TAB -->
    <div class="screen active" id="screen-round">

      <!-- Row 1: Hole nav | Par -->
      <div class="top-row">
        <div class="hole-nav-card">
          <button class="hole-nav-btn" id="hole-prev" onclick="changeHole(-1)" aria-label="Previous hole">&#8592;</button>
          <div class="hole-title-text" id="hole-title">Hole 1</div>
          <button class="hole-nav-btn" id="hole-next" onclick="changeHole(1)" aria-label="Next hole">&#8594;</button>
        </div>
        <div class="par-card" id="par-area">
          <!-- populated by renderParArea() -->
        </div>
      </div>

      <!-- Row 2: Score entry -->
      <div class="score-card">
        <span class="score-card-label">This Hole</span>
        <div class="score-row">
          <button class="score-btn" onclick="adjustScore(-1)" aria-label="Decrease">&#8722;</button>
          <div class="score-spacer"></div>
          <div class="score-display">
            <span class="score-number" id="score-number">0</span>
          </div>
          <div class="score-diff-zone">
            <span class="score-diff" id="score-diff"></span>
          </div>
          <button class="score-btn" onclick="adjustScore(1)" aria-label="Increase">+</button>
        </div>
      </div>

      <!-- Putts entry -->
      <div class="score-card" style="margin-bottom:12px;">
        <span class="score-card-label">Putts</span>
        <div class="score-row">
          <button class="score-btn" onclick="adjustPutts(-1)" aria-label="Decrease putts">&#8722;</button>
          <div class="score-spacer"></div>
          <div class="score-display">
            <span class="score-number" id="putts-number">0</span>
          </div>
          <div class="score-diff-zone"></div>
          <button class="score-btn" onclick="adjustPutts(1)" aria-label="Increase putts">+</button>
        </div>
      </div>

      <button class="btn btn-primary" onclick="saveHole()">Save Hole &amp; Next &#8594;</button>
      <button class="btn btn-outline" id="btn-finish-round" onclick="finishRound()" style="display:none;">Finish &amp; Save Round</button>

      <!-- Green location capture — secondary to scoring, so it sits below the main actions -->
      <div class="card" style="margin-top:12px;">
        <div class="card-label">Green Location</div>
        <div class="gps-status">
          <div class="gps-status-row">
            <span class="gps-indicator searching" id="gps-indicator"></span>
            <span class="gps-status-text" id="gps-status-text">Acquiring GPS&hellip;</span>
          </div>
          <div class="gps-accuracy" id="gps-accuracy">—</div>
          <div class="gps-debug" id="gps-debug">no fix yet</div>
        </div>
        <button class="btn btn-outline" onclick="captureGreenLocation()">&#128205; Capture Green Location</button>
        <div class="green-status" id="green-status"></div>
      </div>

    </div>

    <!-- SUMMARY TAB -->
    <div class="screen" id="screen-summary">
      <div id="summary-content"></div>
      <button class="btn btn-outline" style="margin-top:4px" onclick="exportCSV()">&#8659; Download CSV</button>
      <button class="btn btn-outline" onclick="exportEmail()">&#9993; Email round</button>
    </div>

    <!-- SCORECARD TAB -->
    <div class="screen" id="screen-scorecard">
      <div style="display:flex;gap:0;background:color-mix(in srgb, var(--bg) 50%, transparent);border-radius:10px;border:0.5px solid color-mix(in srgb, var(--gold) 20%, transparent);overflow:hidden;margin-bottom:10px;">
        <button id="sc-toggle-gross" onclick="setScorecardView('gross')" style="flex:1;background:var(--btn-primary);color:var(--on-btn-primary);border:none;padding:10px 6px;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;">Gross</button>
        <button id="sc-toggle-net"   onclick="setScorecardView('net')"   style="flex:1;background:none;color:var(--text-muted);border:none;padding:10px 6px;font-size:14px;font-weight:500;cursor:pointer;font-family:inherit;">Net</button>
      </div>
      <div class="score-table-wrap">
        <table class="score-table">
          <thead><tr><th>Hole</th><th></th><th>Par</th><th>Shots</th><th>+/-</th><th>Putts</th><th>Pts</th></tr></thead>
          <tbody id="scorecard-body"></tbody>
        </table>
      </div>
    </div>

  </div>
</div>

<!-- Dialog -->
<div id="dialog-overlay" class="dialog-overlay" style="display:none" onclick="closeDialogOutside(event)">
  <div class="dialog-sheet" onclick="event.stopPropagation()">
    <div class="dialog-handle"></div>
    <div id="dialog-icon" class="dialog-icon"></div>
    <div id="dialog-title" class="dialog-title"></div>
    <div id="dialog-sub" class="dialog-sub"></div>
    <div id="dialog-actions" class="dialog-actions"></div>
  </div>
</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="gps-indicator.js"></script>
<script>

// ── Scoring mode & handicap ──────────────────────────────────────────────────
const scoringMode   = localStorage.getItem('golf-scoring-mode') || 'gross';
const hcpStored     = localStorage.getItem('golf-handicap');
const handicapIndex = hcpStored ? parseFloat(JSON.parse(hcpStored).value) : null;
let   scorecardView = localStorage.getItem('golf-scorecard-view') || 'gross';

function calcPlayingHandicap() {
  if (handicapIndex === null || isNaN(handicapIndex)) return null;
  const slope = (currentCourse && currentCourse.slope) ? currentCourse.slope : 113;
  return Math.round(handicapIndex * (slope / 113));
}

function strokesOnHole(hole) {
  const ph = calcPlayingHandicap();
  if (!ph) return 0;
  const base  = Math.floor(ph / 18);
  const extra = ph % 18;
  // If SI not loaded, just use base strokes (applies equally to all holes)
  if (!holeStrokeIndex[hole]) return base;
  const si = holeStrokeIndex[hole];
  return base + (si <= extra ? 1 : 0);
}

function netScore(hole) {
  const gross = holeScores[hole];
  if (!gross) return null;
  return gross - strokesOnHole(hole);
}

function stablefordPoints(hole) {
  const net = netScore(hole);
  const par = holePars[hole];
  if (net === null || !par) return null;
  const diff = net - par;
  if (diff >=  2) return 0;
  if (diff ===  1) return 1;
  if (diff ===  0) return 2;
  if (diff === -1) return 3;
  if (diff === -2) return 4;
  return 5;
}

// ── Load course par & stroke index from Supabase ─────────────────────────────
async function loadCourseData() {
  if (!currentCourse || !currentCourse.name) return;
  // Skip if we already have stroke index data loaded
  if (Object.keys(holeStrokeIndex).length > 0) return;
  try {
    // Find the course in Supabase by name
    const { data: courses } = await sb
      .from('courses')
      .select('id, course_rating, slope')
      .ilike('name', currentCourse.name)
      .limit(1);
    if (!courses || courses.length === 0) return;
    const courseId = courses[0].id;
    currentCourseId = courseId;
    // Store course rating and slope
    currentCourse.courseRating = courses[0].course_rating;
    currentCourse.slope        = courses[0].slope;
    // Fetch all hole data
    const { data: holes } = await sb
      .from('course_holes')
      .select('hole, par, stroke_index, green_captured_at')
      .eq('course_id', courseId)
      .order('hole');
    if (!holes || holes.length === 0) return;
    const parsAlreadySet = Object.keys(holePars).length > 0;
    // Always load stroke index; only pre-fill pars if not already set
    holes.forEach(h => {
      if (h.par && !parsAlreadySet) holePars[h.hole] = h.par;
      if (h.stroke_index) holeStrokeIndex[h.hole] = h.stroke_index;
      if (h.green_captured_at) holeGreenCaptured[h.hole] = h.green_captured_at;
    });
    persist();
    renderRound();
    showToast(parsAlreadySet ? 'Stroke index loaded' : 'Course data loaded \u2014 pars pre-filled');
  } catch(e) { console.error('Course data load error:', e); }
}

// ── Score entry ───────────────────────────────────────────────────────────────
function currentDefault() {
  return holePars[currentHole] || 0;
}

function adjustScore(delta) {
  const base = holeScores[currentHole] !== undefined ? holeScores[currentHole] : currentDefault();
  const next = Math.max(0, base + delta);
  holeScores[currentHole] = next;
  persist();
  updateScoreDisplay();
}

function updateScoreDisplay() {
  const displayed = holeScores[currentHole] !== undefined ? holeScores[currentHole] : currentDefault();
  document.getElementById('score-number').textContent = displayed;
  updateScoreDiff();
  updateFinishBtn();
}

function updateScoreDiff() {
  const score = holeScores[currentHole] !== undefined ? holeScores[currentHole] : currentDefault();
  const par   = holePars[currentHole];
  const el    = document.getElementById('score-diff');
  if (!par || score === 0) { el.textContent = ''; el.className = 'score-diff'; return; }
  const diff = score - par;
  if (diff === 0) { el.textContent = 'E';         el.className = 'score-diff even'; }
  else if (diff > 0) { el.textContent = '+'+diff; el.className = 'score-diff over'; }
  else             { el.textContent = diff;        el.className = 'score-diff under'; }
}

// ── Putts ───────────────────────────────────────────────────────────────────
function adjustPutts(delta) {
  const score = holeScores[currentHole] || 0;
  const max   = score > 0 ? score - 1 : 0;
  const next  = Math.max(0, (holePutts[currentHole] || 0) + delta);
  if (next > max && max > 0) {
    holePutts[currentHole] = max;
    persist();
    updatePuttsDisplay();
    showDialog({
      icon: '&#9971;',
      title: 'Too Many Putts',
      sub: '',
      buttons: [{ label: 'OK', style: 'primary', action: () => {} }]
    });
    return;
  }
  holePutts[currentHole] = next;
  persist();
  updatePuttsDisplay();
}

function updatePuttsDisplay() {
  document.getElementById('putts-number').textContent = holePutts[currentHole] || 0;
}

// ── Save hole & next ──────────────────────────────────────────────────────────
function saveHole() {
  // Resolve the score — use explicitly set score, or fall back to displayed default (par)
  let score = holeScores[currentHole];
  if (score === undefined || score === null) {
    score = currentDefault(); // returns par if set, else 0
  }
  if (!score || score === 0) {
    showDialog({ icon: '&#9971;', title: 'No Score Entered', sub: 'Please enter a score before saving this hole.', buttons: [{ label: 'OK', style: 'primary', action: () => {} }] });
    return;
  }
  // Commit the score to state
  holeScores[currentHole] = score;
  persist();
  if (localStorage.getItem('golf-sound-enabled') !== 'false') {
    putSound.currentTime = 0;
    putSound.play().catch(() => {});
  }
  if (currentHole >= 18) { showToast('Last hole saved &#9971;'); updateFinishBtn(); return; }
  currentHole++;
  renderRound();
  showToast('Hole saved — Hole ' + currentHole);
}

// ── Green location capture (GPS hole capture, Method 1) ────────────────────────
async function resolveCourseId() {
  if (currentCourseId) return currentCourseId;
  if (!currentCourse || !currentCourse.name) return null;
  const { data: found } = await sb.from('courses').select('id').ilike('name', currentCourse.name).limit(1);
  if (found && found.length > 0) {
    currentCourseId = found[0].id;
    return currentCourseId;
  }
  // Course doesn't exist in Supabase yet — create it on the fly
  const { data: created, error } = await sb.from('courses')
    .insert({ name: currentCourse.name, suburb: currentCourse.suburb || null })
    .select('id').single();
  if (error || !created) { console.error('Course create error:', error); return null; }
  currentCourseId = created.id;
  return currentCourseId;
}

async function saveGreenLocation() {
  const courseId = await resolveCourseId();
  if (!courseId) { showToast('Could not resolve course \u2014 try again'); return; }
  try {
    await sb.from('course_holes').upsert({
      course_id: courseId,
      hole: currentHole,
      green_lat: currentFix.latitude,
      green_lng: currentFix.longitude,

      green_captured_at: new Date().toISOString()
    }, { onConflict: 'course_id,hole' });

    renderGreenStatus();

  } catch(e) {
    console.error('Green location save error:', e);

}

function captureGreenLocation() {
  if (!currentFix) { showToast('Waiting for a GPS fix\u2026'); return; }
  const tier = accuracyTier(currentFix.accuracy);
  const alreadyCaptured = !!holeGreenCaptured[currentHole];
  if (tier === 'poor' || tier === 'unknown') {
    showDialog({
      icon: '&#128205;',
      title: 'Low GPS Accuracy',
      sub: 'Current accuracy is \u00b1' + Math.round(currentFix.accuracy) + 'm.' +
        (alreadyCaptured ? ' This will overwrite the existing saved location.' : '') +

        { label: 'Cancel', style: 'secondary', action: () => {} }
      ]

  }
  saveGreenLocation();
}

async function saveRoundToHistory() {
  const scoredHoles = Object.keys(holeScores).map(Number).filter(h => holeScores[h] > 0);
  if (!scoredHoles.length) return;
  const totalScore = scoredHoles.reduce((a,h) => a + holeScores[h], 0);
  const parHoles   = scoredHoles.filter(h => holePars[h]);
  const totalPar   = parHoles.reduce((a,h) => a + holePars[h], 0);
  const date       = new Date();

  // Always save to localStorage as backup
  const localRound = {
    id:         Date.now().toString(),
    date:       date.toLocaleDateString('en-AU'),
    dateISO:    date.toISOString(),
    course:     currentCourse ? currentCourse.name   : 'Unknown Course',
    suburb:     currentCourse ? currentCourse.suburb : '',
    holes:      scoredHoles.length,
    totalScore: totalScore,
    totalPar:   totalPar || null,
    scoreDiff:  totalPar ? totalScore - totalPar : null,
    pars:       { ...holePars },
    holeScores: { ...holeScores },
    holePutts:  { ...holePutts },
    shots:      totalScore,
    totalDist:  0,
    shotData:   scoredHoles.sort((a,b)=>a-b).map(h => ({ hole: h, score: holeScores[h], par: holePars[h]||null }))
  };
  const history = JSON.parse(localStorage.getItem('golf-round-history') || '[]');
  history.unshift(localRound);
  localStorage.setItem('golf-round-history', JSON.stringify(history));

  // Save to Supabase if logged in
  if (!currentUser) return;
  try {
    // Insert round row
    const { data: roundRow, error: roundErr } = await sb.from('rounds').insert({
      user_id:      currentUser.id,
      date:         date.toISOString().split('T')[0],
      date_iso:     date.toISOString(),
      course:       currentCourse ? currentCourse.name   : 'Unknown Course',
      suburb:       currentCourse ? currentCourse.suburb : null,
      holes_played: scoredHoles.length,
      total_score:  totalScore,
      total_par:    totalPar || null,
      score_diff:   totalPar ? totalScore - totalPar : null
    }).select().single();

    if (roundErr) { console.error('Round save error:', roundErr); return; }

    // Insert one row per hole
    const holeRows = scoredHoles.sort((a,b)=>a-b).map(h => ({
      round_id: roundRow.id,
      user_id:  currentUser.id,
      hole:     h,
      score:    holeScores[h],
      par:      holePars[h]  || null,
      putts:    holePutts[h] || 0
    }));
    const { error: holesErr } = await sb.from('hole_scores').insert(holeRows);
    if (holesErr) console.error('Hole scores save error:', holesErr);
  } catch(e) {
    console.error('Supabase save failed (offline?):', e);
    // localStorage backup already saved above — data is safe
  }
}

// ── Summary ───────────────────────────────────────────────────────────────────
function renderSummary() {
  const el = document.getElementById('summary-content');
  const scoredHoles = Object.keys(holeScores).map(Number).filter(h => holeScores[h] > 0).sort((a,b)=>a-b);

  if (!scoredHoles.length) {
    el.innerHTML = '<div class="empty-state"><span class="empty-icon">&#128202;</span>No scores logged yet.</div>';
    return;
  }

  function calcBlock(holes) {
    const played    = holes.filter(h => holeScores[h] > 0);
    if (!played.length) return null;
    const shots     = played.reduce((a,h) => a + holeScores[h], 0);
    const parHoles  = played.filter(h => holePars[h]);
    const totalPar  = parHoles.reduce((a,h) => a + holePars[h], 0);
    const overPar   = parHoles.length ? shots - totalPar : null;
    const avgOverPar = parHoles.length ? (overPar / parHoles.length).toFixed(2) : null;
    const puttHoles  = played.filter(h => holePutts[h] > 0);
    const totalPutts = played.reduce((a,h) => a + (holePutts[h]||0), 0);
    const avgPutts   = puttHoles.length ? (totalPutts / puttHoles.length).toFixed(1) : null;
    const stablefordPts = handicapIndex !== null
      ? played.reduce((a,h) => { const p = stablefordPoints(h); return p !== null ? a + p : a; }, 0)
      : null;
    return { played: played.length, shots, totalPar: parHoles.length ? totalPar : null, overPar, avgOverPar, totalPutts, avgPutts, stablefordPts };
  }

  function overParStr(v) {
    if (v === null) return '&#8212;';
    if (v === 0)    return 'E';
    return (v > 0 ? '+' : '') + v;
  }
  function overParCol(v) {
    if (v === null || v === 0) return 'color:var(--text-muted)';
    return v > 0 ? 'color:var(--warning)' : 'color:var(--gold)';
  }
  function avgOverStr(v) {
    if (v === null) return '&#8212;';
    const n = parseFloat(v);
    if (n === 0) return 'E';
    return (n > 0 ? '+' : '') + v;
  }

  function blockHTML(label, holes) {
    const d = calcBlock(holes);
    if (!d) return '<div class="summary-card"><div class="sum-header"><span class="sum-header-title">' + label + '</span><span class="sum-header-sub">No scores</span></div></div>';
    const parStr   = d.totalPar !== null ? 'Par ' + d.totalPar : '';
    const holesStr = d.played + ' hole' + (d.played===1?'':'s') + ' played';
    return '<div class="summary-card">' +
      '<div class="sum-header" style="display:grid;grid-template-columns:1fr auto 1fr;align-items:center;">' +
        '<span class="sum-header-title">' + label + '</span>' +
        '<span style="font-size:13px;font-weight:400;color:var(--text-muted);text-align:center;">' + parStr + '</span>' +
        '<span class="sum-header-sub" style="text-align:right;">' + holesStr + '</span>' +
      '</div>' +
      '<div class="sum-stats">' +
        '<div class="sum-stat" style="flex-direction:column;gap:2px;">' +
          '<span style="font-size:9px;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-muted);">Shots</span>' +
          '<span>' + d.shots + '</span>' +
        '</div>' +
        '<div class="sum-stat" style="flex-direction:column;gap:2px;">' +
          '<span style="font-size:9px;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-muted);">Over/Under</span>' +
          '<span style="' + overParCol(d.overPar) + '">' + overParStr(d.overPar) + '</span>' +
        '</div>' +
        '<div class="sum-stat" style="flex-direction:column;gap:2px;">' +
          '<span style="font-size:9px;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-muted);">Putts</span>' +
          '<span>' + (d.totalPutts || '&#8212;') + '</span>' +
        '</div>' +
      '</div>' +
      '<div class="sum-footer"><span class="sum-footer-label">Avg shots over par / hole</span><span class="sum-footer-val" style="' + overParCol(d.overPar) + '">' + avgOverStr(d.avgOverPar) + '</span></div>' +
      (d.avgPutts ? '<div class="sum-footer" style="border-top:0.5px solid color-mix(in srgb, var(--gold) 8%, transparent);"><span class="sum-footer-label">Avg putts per hole</span><span class="sum-footer-val">' + d.avgPutts + '</span></div>' : '') +
      (d.stablefordPts !== null ? '<div class="sum-footer" style="border-top:0.5px solid color-mix(in srgb, var(--gold) 8%, transparent);"><span class="sum-footer-label">Stableford points</span><span class="sum-footer-val" style="color:var(--gold);">' + d.stablefordPts + '</span></div>' : '') +
      '</div>';
  }

  const front9 = Array.from({length:9}, (_,i) => i+1);
  const back9  = Array.from({length:9}, (_,i) => i+10);
  const all18  = Array.from({length:18},(_,i) => i+1);

  el.innerHTML = blockHTML('Front 9', front9) +
                 blockHTML('Back 9',  back9) +
                 blockHTML('Overall', all18);
}

// ── Scorecard ─────────────────────────────────────────────────────────────────
function scoreIcon(score, par) {
  if (!par || !score) return '';
  const diff = score - par;
  let src = '';
  if (score === 1)       src = 'icons/hole_in_one.png';
  else if (diff <= -2)   src = 'icons/egale.png';
  else if (diff === -1)  src = 'icons/Birdie.png';
  else if (diff === 0)   src = 'icons/par.png';
  else if (diff === 1)   src = 'icons/1over.png';
  else if (diff === 2)   src = 'icons/2over.png';
  else if (diff === 3)   src = 'icons/3over.png';
  return src ? '<img src="' + src + '" style="width:31px;height:31px;object-fit:contain;display:block;margin:0 auto;" alt="">' : '';
}

function setScorecardView(view) {
  scorecardView = view;
  localStorage.setItem('golf-scorecard-view', view);
  const gBtn = document.getElementById('sc-toggle-gross');
  const nBtn = document.getElementById('sc-toggle-net');
  if (gBtn && nBtn) {
    gBtn.style.background = view === 'gross' ? 'var(--btn-primary)' : 'none';
    gBtn.style.color      = view === 'gross' ? 'var(--on-btn-primary)' : 'var(--text-muted)';
    nBtn.style.background = view === 'net'   ? 'var(--btn-primary)' : 'none';
    nBtn.style.color      = view === 'net'   ? 'var(--on-btn-primary)' : 'var(--text-muted)';
  }
  renderScorecard();
}

function renderScorecard() {
  const tbody = document.getElementById('scorecard-body');
  let ts=0, tp=0, tputts=0;
  const rows=[];
  for (let h=1; h<=18; h++) {
    const score = holeScores[h] || shots.filter(s=>s.hole===h).length;
    if (score > 0) {
      const par    = holePars[h];
      const putts  = holePutts[h] || 0;
      const extras = strokesOnHole(h);
      const displayScore = scorecardView === 'net' ? (score - extras) : score;
      const diff   = par ? displayScore - par : null;
      const ds     = diff===null ? '&#8212;' : (diff===0?'E':(diff>0?'+'+diff:diff));
      const diffCol = diff===null?'':(diff>0?'color:var(--warning)':diff<0?'color:var(--gold)':'color:var(--text-muted)');
      const siDot  = extras > 0 ? '<span style="color:var(--gold);font-size:10px;"> +'+extras+'</span>' : '';
      const pts    = stablefordPoints(h);
      const ptsStr = pts !== null ? pts : '&#8212;';
      ts += displayScore; if(par) tp += par; tputts += putts;
      rows.push('<tr><td>'+h+siDot+'</td>' +
        '<td style="text-align:center;padding:4px 6px;">'+scoreIcon(displayScore,par)+'</td>' +
        '<td><input class="sc-input" type="number" min="3" max="5" inputmode="numeric" value="'+(par||'')+'" placeholder="&#8211;" onchange="scSavePar('+h+',this.value)"></td>' +
        '<td><input class="sc-input" type="number" min="1" max="30" inputmode="numeric" value="'+score+'" onchange="scSaveScore('+h+',this.value)"></td>' +
        '<td style="'+diffCol+'">'+ds+'</td>' +
        '<td style="color:var(--gold);">'+(putts||'&#8212;')+'</td>' +
        '<td style="font-weight:500;color:var(--gold);">'+ptsStr+'</td></tr>');
    }
  }
  if (!rows.length) {
    tbody.innerHTML='<tr><td colspan="7" style="text-align:center;color:var(--text-muted);padding:24px">No scores yet</td></tr>';
    return;
  }
  const tdiff=tp?ts-tp:null;
  const tds=tdiff===null?'&#8212;':(tdiff===0?'E':(tdiff>0?'+'+tdiff:tdiff));
  const tdsCol=tdiff===null?'':(tdiff>0?'color:var(--warning)':tdiff<0?'color:var(--gold)':'color:var(--text-muted)');
  const totalPts = Object.keys(holeScores).filter(h=>holeScores[h]>0).reduce((a,h)=>{ const p=stablefordPoints(parseInt(h)); return p!==null?a+p:a; }, 0);
  tbody.innerHTML = rows.join('') +
    '<tr><td style="padding-left:14px;">Total</td><td></td><td>'+(tp||'&#8212;')+'</td><td>'+ts+'</td><td style="'+tdsCol+'">'+tds+'</td><td style="color:var(--gold);">'+(tputts||'&#8212;')+'</td><td style="font-weight:500;color:var(--gold);">'+(handicapIndex!==null?totalPts:'&#8212;')+'</td></tr>' +
    '<tr><td colspan="7" style="padding:10px 14px;"><button class="sc-save-btn" style="width:100%;" onclick="scSaveAll()">Save</button></td></tr>';
  // Score icons above are freshly inserted <img> tags — theme.js's icon-swap only
  // runs at page load and on toggle, so re-sweep now to pick up the current theme.
  if (typeof applyIconTheme === 'function' && typeof getTheme === 'function') {
    applyIconTheme(getTheme());
  }
}

function scSavePar(hole,val) {
  const v=parseInt(val); if(v===3||v===4||v===5){holePars[hole]=v;persist();writeCoursePars();}
}
function scSaveScore(hole,val) {
  const v=parseInt(val); if(!isNaN(v)&&v>=0){holeScores[hole]=v;persist();}
}
function scSaveAll() { persist(); renderScorecard(); showToast('Scorecard saved'); }

// ── Export ────────────────────────────────────────────────────────────────────
function exportCSV() {
  const scoredHoles=Object.keys(holeScores).map(Number).filter(h=>holeScores[h]>0).sort((a,b)=>a-b);
  if (!scoredHoles.length && !shots.length) { showToast('No data to export'); return; }
  const date=new Date().toLocaleDateString('en-AU').replace(/\//g,'-');
  const rows=['Date,Hole,Par,Score,+/-'];
  scoredHoles.forEach(h=>{
    const par=holePars[h]||''; const diff=par?holeScores[h]-par:'';
    rows.push(date+','+h+','+par+','+holeScores[h]+','+(diff!==''?(diff>0?'+'+diff:diff):''));
  });
  const blob=new Blob([rows.join('\r\n')],{type:'text/csv'});
  const url=URL.createObjectURL(blob);
  const a=document.createElement('a');a.href=url;a.download='golf-round-'+date+'.csv';a.click();
  URL.revokeObjectURL(url); showToast('CSV downloaded');
}
function exportEmail() {
  const scoredHoles=Object.keys(holeScores).map(Number).filter(h=>holeScores[h]>0).sort((a,b)=>a-b);
  if (!scoredHoles.length){showToast('No scores to email');return;}
  const date=new Date().toLocaleDateString('en-AU');
  const lines=['Golf Round - '+date,''];
  let total=0;
  scoredHoles.forEach(h=>{
    const par=holePars[h];const sc=holeScores[h];total+=sc;
    const diff=par?(sc-par===0?'E':(sc-par>0?'+'+(sc-par):(sc-par))):'';
    lines.push('Hole '+h+(par?' (Par '+par+')':'')+': '+sc+' shots'+(diff?' ('+diff+')':''));
  });
  lines.push('');lines.push('Total: '+total+' shots');
  window.location.href='mailto:?subject='+encodeURIComponent('Golf Round - '+date)+'&body='+lines.join('%0D%0A');
}

// ── Dialog ────────────────────────────────────────────────────────────────────
function showDialog(opts) {
  document.getElementById('dialog-icon').innerHTML    = opts.icon  || '';
  document.getElementById('dialog-title').textContent = opts.title || '';
  document.getElementById('dialog-sub').textContent   = opts.sub   || '';
  document.getElementById('dialog-actions').innerHTML = opts.buttons.map((b,i) =>
    '<button class="dialog-btn dialog-btn-'+(b.style||'secondary')+'" onclick="dialogAction('+i+')">'+b.label+'</button>'
  ).join('');
  window._dialogActions = opts.buttons.map(b=>b.action);
  document.getElementById('dialog-overlay').style.display = 'flex';
}
function dialogAction(i) { closeDialog(); window._dialogActions?.[i]?.(); }
function closeDialogOutside(e) { if(e.target===document.getElementById('dialog-overlay')) closeDialog(); }
function closeDialog() { document.getElementById('dialog-overlay').style.display='none'; }

// ── Toast ─────────────────────────────────────────────────────────────────────
function showToast(msg) {
  const t=document.getElementById('toast'); t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2200);
}
