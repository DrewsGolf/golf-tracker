<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="theme.js"></script>
<link rel="stylesheet" href="theme.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0D0D0D">
<link rel="manifest" href="manifest.json">
<title>Login — Shot Tracker</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  /* ── Page-specific aliases + layout vars. Core theme colors (--bg, --gold,
     etc.) come from theme.css, loaded in <head>. ── */
  :root {
    --bg-primary:  var(--bg);
    --bg-card:     var(--surface);
    --text-muted:  var(--text-secondary);
    --safe-top:      env(safe-area-inset-top, 0px);
    --safe-bottom:   env(safe-area-inset-bottom, 0px);
  }

  html, body {
    height: 100%;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg-primary);
    overflow: hidden;
  }

  /* ── App container — identical to settings.html ── */
  .app {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 430px;
    margin: 0 auto;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ── Background image ── */
  .hero {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  .hero-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    display: block;
  }

  /* ── Dark overlay on background ── */
  .hero-overlay {
    position: absolute;
    inset: 0;
    background: rgba(13,13,13,0.65);
  }

  /* ── Header ── */
  .header-img-wrap { position: relative; z-index: 10; width: 100%; flex-shrink: 0; }
  .header-img { width: 100%; height: auto; display: block; }

  /* ── Scrollable page content wrapper ── */
  .page-scroll {
    position: relative;
    z-index: 5;
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding-bottom: calc(110px + var(--safe-bottom));
    background: var(--bg);
  }

  .settings-content {
    position: relative;
    z-index: 10;
    padding: 0;
    flex-shrink: 0;
  }

  /* ── Nav — identical to settings.html ── */
  .nav-shell {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 100;
  }

  .nav-row {
    display: flex;
    background: color-mix(in srgb, var(--bg) 92%, transparent);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }

  .nav-primary {
    border-top: 0.5px solid color-mix(in srgb, var(--gold) 20%, transparent);
    padding-bottom: calc(var(--safe-bottom) + 6px);
    transform: translateY(0);
    transition: transform 350ms cubic-bezier(0.4, 0, 0.2, 1);
    will-change: transform;
    position: relative;
    z-index: 2;
  }

  .nav-primary.raised { transform: translateY(-100%); }

  .nav-secondary {
    border-top: 0.5px solid color-mix(in srgb, var(--gold) 12%, transparent);
    padding-bottom: calc(var(--safe-bottom) + 6px);
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    transform: translateY(100%);
    transition: transform 350ms cubic-bezier(0.4, 0, 0.2, 1);
    will-change: transform;
    z-index: 1;
  }

  .nav-secondary.open { transform: translateY(0); }

  .nav-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 10px 4px 6px;
    cursor: pointer;
    text-decoration: none;
    background: none;
    border: none;
    -webkit-tap-highlight-color: transparent;
    transition: opacity 0.15s;
  }

  .nav-item:active { opacity: 0.7; }
  .nav-item img { width: 70px; height: 70px; object-fit: contain; object-position: bottom; display: block; }

  .nav-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.5);
    opacity: 0;
    pointer-events: none;
    transition: opacity 350ms ease;
    z-index: 90;
  }

  .nav-overlay.open { opacity: 1; pointer-events: auto; }

  /* Header auth badge */
  .header-auth-badge { position: absolute; top: 10px; right: 14px; display: none; align-items: center; gap: 6px; background: rgba(13,13,13,0.6); backdrop-filter: blur(6px); border: 0.5px solid color-mix(in srgb, var(--gold) 20%, transparent); border-radius: 20px; padding: 5px 10px 5px 8px; }
  .header-auth-badge.visible { display: flex; }
  .header-auth-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); flex-shrink: 0; }
  .header-auth-email { font-size: 11px; font-weight: 500; color: var(--gold); white-space: nowrap; }

  /* Daylight mode: white badge, black text, per the design brief */
  [data-theme="light"] .header-auth-badge {
    background: var(--surface);
    border: 0.5px solid color-mix(in srgb, var(--gold) 30%, transparent);
  }
  [data-theme="light"] .header-auth-email {
    color: var(--text-primary);
  }

  /* Auth section */
  .auth-card { background: var(--surface); border: 1px solid var(--gold); border-radius: var(--radius-lg); box-shadow: var(--shadow-soft); overflow: hidden; margin-top: 12px; flex-shrink: 0; }
  .auth-status { padding: 16px 20px; display: flex; align-items: center; gap: 12px; border-bottom: 0.5px solid color-mix(in srgb, var(--gold) 10%, transparent); }
  .auth-dot { width: 10px; height: 10px; border-radius: 50%; background: #666; flex-shrink: 0; }
  .auth-dot.connected { background: var(--success); }
  .auth-label { font-size: 13px; color: var(--text-muted); flex: 1; }
  .auth-email { font-size: 13px; font-weight: 500; color: var(--gold); }
  .auth-field-wrap { padding: 14px 20px; border-bottom: 0.5px solid color-mix(in srgb, var(--gold) 10%, transparent); }
  .auth-field { width: 100%; background: color-mix(in srgb, var(--bg) 70%, transparent); border: 0.5px solid color-mix(in srgb, var(--gold) 30%, transparent); border-radius: 9px; padding: 11px 14px; font-size: 15px; color: var(--text-primary); font-family: inherit; -webkit-appearance: none; }
  .auth-field:-webkit-autofill,
  .auth-field:-webkit-autofill:hover,
  .auth-field:-webkit-autofill:focus {
    -webkit-text-fill-color: var(--text-primary);
    -webkit-box-shadow: 0 0 0px 1000px color-mix(in srgb, var(--bg) 70%, var(--surface)) inset;
    box-shadow: 0 0 0px 1000px color-mix(in srgb, var(--bg) 70%, var(--surface)) inset;
    transition: background-color 5000s ease-in-out 0s;
  }
  .auth-field:focus { outline: none; border-color: var(--gold); }
  .auth-btn { width: calc(100% - 40px); margin: 14px 20px; display: block; background: var(--btn-primary); color: var(--on-btn-primary); border: none; border-radius: 10px; padding: 13px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; text-align: center; }
  .auth-btn.sign-out { background: transparent; color: var(--warning); border: 0.5px solid color-mix(in srgb, var(--warning) 40%, transparent); }
  .auth-btn:active { opacity: 0.8; }
  .auth-error { font-size: 12px; color: var(--warning); text-align: center; padding: 0 20px 12px; min-height: 18px; }
  .auth-section-label { font-size: 10px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-muted); padding: 14px 20px 4px; }

  /* ── Header icons — top right, overlaid on the header image. Matches
     index2.html's layout: Home takes the slot Login occupied there,
     Settings stays in the same position. ── */
  .header-icons {
    position: absolute;
    bottom: 5px;
    right: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 60;
  }

  .header-icons a {
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    text-decoration: none;
  }

  .header-icons img {
    width: 38px;
    height: 38px;
    object-fit: contain;
    display: block;
  }

  .header-icons a:active { opacity: 0.7; }
</style>
</head>
<body>
<div class="app">

  <!-- Background image -->
  <div class="hero">
    <img class="hero-img" src="Back_ground_New.jpg" alt="">
    <div class="hero-overlay"></div>
  </div>

  <!-- Scrollable content: header + account -->
  <div class="page-scroll">

  <!-- Header -->
  <div class="header-img-wrap" style="position:relative;">
    <img class="header-img" src="images/header.png" alt="Shot Tracker">
    <div class="header-auth-badge" id="header-badge">
      <div class="header-auth-dot"></div>
      <span class="header-auth-email" id="header-email"></span>
    </div>
    <div class="header-icons">
      <a href="index.html">
        <img src="icons/Home.png" alt="Home">
      </a>
      <a href="settings.html">
        <img src="icons/Settings.png" alt="Settings">
      </a>
    </div>
  </div>

  <!-- Account / Sign In -->
  <div class="auth-card" id="auth-card">
    <!-- Sign in form (shown when logged out) — visible by default so it never disappears if the auth check is slow/fails -->
    <div id="signin-form" style="display:block;">
      <div class="auth-section-label">Sign In to Sync Your Data</div>
      <div class="auth-field-wrap">
        <input class="auth-field" type="email" id="auth-email-input" placeholder="Email" autocomplete="email" inputmode="email">
      </div>
      <div class="auth-field-wrap" style="border-bottom:none;">
        <input class="auth-field" type="password" id="auth-pass-input" placeholder="Password" autocomplete="current-password">
      </div>
      <div class="auth-error" id="auth-error"></div>
      <button class="auth-btn" onclick="doSignIn()">Sign In</button>
    </div>
    <!-- Sign out button (shown when logged in) -->
    <div id="signout-form" style="display:none;">
      <button class="auth-btn sign-out" onclick="doSignOut()">Sign Out</button>
    </div>
  </div>

  </div>
  <!-- /page-scroll -->

    <!-- Nav shell -->
  <div class="nav-shell">
    <div class="nav-row">
      <a class="nav-item" href="find.html"><img src="icons/Courses.png" alt="Courses"></a>
      <a class="nav-item" id="nav-play" href="start.html"><img src="icons/Play.png" alt="Play"></a>
      <a class="nav-item" href="distance.html"><img src="icons/Distance.png" alt="Distance"></a>
      <a class="nav-item" href="suggest.html"><img src="icons/Suggest.png" alt="Suggest"></a>
      <a class="nav-item" href="history.html"><img src="icons/History.png" alt="History"></a>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://ryqehsqqriavmuqfnzpx.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ5cWVoc3Fxcmlhdm11cWZuenB4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM3NTQ4MzcsImV4cCI6MjA5OTMzMDgzN30.Po2m7uhlMTc43Pdg8pohwvDsQ_UDFRS-n9UnTQ44nXA';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let currentUser = null;

function setAuthUI(session) {
  const badge    = document.getElementById('header-badge');
  const hEmail   = document.getElementById('header-email');
  const signIn   = document.getElementById('signin-form');
  const signOut  = document.getElementById('signout-form');
  if (session) {
    currentUser = session.user;
    badge.classList.add('visible');
    hEmail.textContent    = session.user.email;
    signIn.style.display  = 'none';
    signOut.style.display = 'block';
  } else {
    currentUser = null;
    badge.classList.remove('visible');
    hEmail.textContent    = '';
    signIn.style.display  = 'block';
    signOut.style.display = 'none';
  }
}

sb.auth.getSession().then(({ data }) => setAuthUI(data.session)).catch(() => setAuthUI(null));

async function doSignIn() {
  const email    = document.getElementById('auth-email-input').value.trim();
  const password = document.getElementById('auth-pass-input').value;
  const errEl    = document.getElementById('auth-error');
  errEl.textContent = '';
  if (!email || !password) { errEl.textContent = 'Enter your email and password.'; return; }
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) { errEl.textContent = error.message; return; }
  setAuthUI(data.session);
}

async function doSignOut() {
  await sb.auth.signOut();
  setAuthUI(null);
}
</script>

<script>
// ── Continue round ────────────────────────────────────────────────────────────
(function() {
  var scores = JSON.parse(localStorage.getItem('golf-scores-v1') || '{}');
  var hole   = localStorage.getItem('golf-current-hole');
  if (Object.keys(scores).length > 0 || (hole && parseInt(hole) > 1)) {
    var el = document.getElementById('nav-play');
    if (el) el.setAttribute('href', 'round.html');
  }
})();
</script>
</body>
</html>
