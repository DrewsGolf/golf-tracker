<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="theme.js"></script>
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="gps-indicator.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0D0D0D">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.svg">
<title>Shot Tracker — Clubs</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  /* ── Page-specific aliases + layout vars. Core theme colors (--bg, --gold,
     etc.) now come from theme.css, loaded in <head>. ── */
  :root {
    --card:            color-mix(in srgb, var(--surface) 85%, transparent);
    --border:          color-mix(in srgb, var(--gold) 15%, transparent);
    --border-mid:      color-mix(in srgb, var(--gold) 25%, transparent);
  }
  :root {
    --radius: 14px; --radius-sm: 9px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  html, body { height: 100%; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text-primary); overflow: hidden; }
  .app { position: relative; width: 100%; height: 100%; max-width: 430px; margin: 0 auto; overflow: hidden; }
  #app { display: flex; flex-direction: column; height: 100%; position: relative; z-index: 5; }

  /* Background */
  .header-img-wrap { position: relative; z-index: 10; width: 100%; flex-shrink: 0; }
  .header-img { width: 100%; height: auto; display: block; }

  /* Content */
  .content { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 14px 14px calc(var(--safe-bottom) + 110px); position: relative; z-index: 5; background: var(--bg); }

  /* Cards */
  .card { background: var(--card); border: 0.5px solid var(--border); border-radius: var(--radius); backdrop-filter: blur(8px); padding: 16px 14px; margin-bottom: 12px; }
  .card-label { font-size: 10px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 10px; }

  /* Club selector — compact button grid */
  /* Tab bar — matches history.html's Scorecard/Summary/Compare tab style */
  .detail-tab-bar { background: transparent; padding: 0 0 14px; display: flex; gap: 6px; flex-shrink: 0; }
  .detail-tab { flex: 1; padding: 10px 8px; font-size: 13px; font-weight: 500; text-align: center; border-radius: 8px; border: 0.5px solid color-mix(in srgb, var(--gold) 15%, transparent); cursor: pointer; background: color-mix(in srgb, var(--gold) 6%, transparent); color: var(--text-muted); font-family: inherit; }
  .detail-tab.active { background: var(--btn-primary); color: var(--on-btn-primary); border-color: var(--btn-primary); }
  .dist-tab-panel { display: none; }
  .dist-tab-panel.active { display: block; }

  /* Range tab — manual distance entry */
  .range-dist-input { width: 100%; background: color-mix(in srgb, var(--bg) 70%, transparent); border: 0.5px solid color-mix(in srgb, var(--gold) 35%, transparent); border-radius: var(--radius-sm); padding: 14px 16px; font-size: 20px; font-weight: 600; color: var(--text-primary); font-family: inherit; text-align: center; -webkit-appearance: none; }
  .range-dist-input::placeholder { color: var(--text-muted); font-weight: 400; font-size: 15px; }
  .range-dist-unit { text-align: center; font-size: 12px; color: var(--text-muted); margin-top: 6px; letter-spacing: 0.05em; text-transform: uppercase; }

  .club-grid { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
  .club-grid-btn { padding: 12px 2px; border-radius: 10px; border: 0.5px solid color-mix(in srgb, var(--gold) 35%, transparent); background: color-mix(in srgb, var(--bg) 70%, transparent); color: var(--text-primary); font-size: 13px; font-weight: 600; text-align: center; cursor: pointer; font-family: inherit; letter-spacing: 0.02em; }
  .club-grid-btn:active { opacity: 0.75; }
  .club-grid-btn.selected { background: var(--btn-primary); color: var(--on-btn-primary); border-color: var(--btn-primary); }


  /* Live walking distance */
  .walking-dist-card { text-align: center; padding: 4px 0 16px; }
  .walking-dist-value { font-size: 46px; font-weight: 300; color: var(--gold); line-height: 1; letter-spacing: -0.03em; }
  .walking-dist-unit { font-size: 20px; font-weight: 400; color: var(--gold-muted); margin-left: 3px; }
  .walking-dist-label { font-size: 11px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); margin-top: 4px; }

  /* Result */
  .result-card { background: color-mix(in srgb, var(--gold) 8%, transparent); border: 0.5px solid color-mix(in srgb, var(--gold) 30%, transparent); border-radius: var(--radius); padding: 18px 14px; margin-bottom: 12px; text-align: center; }
  .result-dist { font-size: 56px; font-weight: 300; color: var(--gold); line-height: 1; letter-spacing: -0.04em; }
  .result-unit { font-size: 18px; font-weight: 400; color: var(--gold-muted); margin-left: 4px; }
  .result-club { font-size: 15px; font-weight: 500; color: var(--text-secondary); margin-top: 6px; }

  /* Stage instruction */
  .stage-instruction { text-align: center; font-size: 14px; color: var(--text-secondary); font-style: italic; padding: 6px 0 10px; }

  /* Buttons */
  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 15px; border-radius: var(--radius); border: none; font-size: 15px; font-weight: 500; cursor: pointer; transition: opacity 0.15s, transform 0.1s; margin-bottom: 10px; font-family: inherit; letter-spacing: 0.03em; }
  .btn:last-child { margin-bottom: 0; }
  .btn:active { opacity: 0.82; transform: scale(0.985); }
  .btn-primary { background: var(--btn-primary); color: var(--on-btn-primary); }
  .btn-outline { background: transparent; color: var(--gold); border: 0.5px solid var(--gold); }
  .btn-danger { background: color-mix(in srgb, var(--warning) 30%, transparent); color: var(--text-primary); border: 0.5px solid color-mix(in srgb, var(--warning) 50%, transparent); }
  .btn:disabled { opacity: 0.35; cursor: default; }

  /* History */
  .history-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .history-title { font-size: 13px; font-weight: 600; color: var(--gold); letter-spacing: 0.06em; text-transform: uppercase; }
  .history-clear { background: transparent; border: none; color: var(--text-muted); font-size: 12px; cursor: pointer; font-family: inherit; }
  /* Source filter — On Course / At Range / Both */
  .source-filter-bar { display: flex; gap: 6px; margin-bottom: 12px; }
  .source-filter-btn { flex: 1; padding: 9px 6px; font-size: 12px; font-weight: 500; text-align: center; border-radius: 8px; border: 0.5px solid color-mix(in srgb, var(--gold) 15%, transparent); cursor: pointer; background: color-mix(in srgb, var(--gold) 6%, transparent); color: var(--text-muted); font-family: inherit; }
  .source-filter-btn.active { background: var(--btn-primary); color: var(--on-btn-primary); border-color: var(--btn-primary); }

  .shot-list { display: flex; flex-direction: column; gap: 7px; }
  .shot-item { background: color-mix(in srgb, var(--surface) 70%, transparent); border: 0.5px solid var(--border); border-radius: var(--radius-sm); display: flex; align-items: center; padding: 12px 13px; gap: 11px; cursor: pointer; }
  .shot-item:active { background: color-mix(in srgb, var(--gold) 8%, transparent); }
  .shot-item.expanded { border-color: color-mix(in srgb, var(--gold) 40%, transparent); border-radius: var(--radius-sm) var(--radius-sm) 0 0; }
  .shot-club { font-size: 14px; font-weight: 600; flex: 1; color: var(--text-primary); }
  .shot-stats-inline { display: flex; gap: 12px; font-size: 12px; color: var(--text-muted); }
  .shot-stats-inline b { color: var(--gold); font-weight: 600; }
  .shot-expand-arrow { font-size: 11px; color: var(--text-muted); flex-shrink: 0; }
  .shot-dist { font-size: 15px; font-weight: 500; color: var(--gold); }
  .shot-avg { font-size: 12px; color: var(--text-muted); }
  .empty-state { text-align: center; padding: 24px 16px; color: var(--text-muted); font-size: 14px; }

  /* Expanded accordion content */
  .shot-expand { background: color-mix(in srgb, var(--surface) 45%, transparent); border: 0.5px solid color-mix(in srgb, var(--gold) 40%, transparent); border-top: none; border-radius: 0 0 var(--radius-sm) var(--radius-sm); padding: 4px 13px 12px; margin-bottom: 7px; }
  .shot-expand-section { padding-top: 10px; }
  .shot-expand-heading { font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold-muted); margin-bottom: 6px; }
  .shot-expand-stats { display: flex; gap: 16px; font-size: 13px; color: var(--text-primary); margin-bottom: 8px; }
  .shot-expand-stats b { color: var(--gold); font-weight: 600; }
  .shot-expand-shots { display: flex; flex-direction: column; gap: 4px; }
  .shot-expand-row { display: flex; align-items: center; justify-content: space-between; padding: 6px 8px; background: color-mix(in srgb, var(--bg) 40%, transparent); border-radius: 6px; font-size: 13px; }
  .shot-expand-dist { color: var(--gold); font-weight: 500; }
  .shot-expand-meta { display: flex; align-items: center; gap: 8px; }
  .shot-expand-src { font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); }
  .shot-expand-del { background: transparent; border: none; color: var(--text-muted); font-size: 13px; cursor: pointer; padding: 2px 4px; }
  .shot-expand-del:active { color: var(--warning); }
  .shot-expand-empty { font-size: 12px; color: var(--text-muted); font-style: italic; }
  .shot-expand-heading-row { display: flex; align-items: center; gap: 8px; cursor: pointer; margin-bottom: 6px; }
  .shot-expand-heading-row:active { opacity: 0.75; }
  .shot-expand-heading-stats { flex: 1; font-size: 12px; color: var(--text-secondary); }
  .shot-expand-heading-stats b { color: var(--gold); font-weight: 600; }
  .shot-rounds-list { display: flex; flex-direction: column; gap: 4px; margin-top: 4px; }
  .shot-round-wrap { background: color-mix(in srgb, var(--bg) 40%, transparent); border-radius: 8px; overflow: hidden; }
  .shot-round-row { display: flex; align-items: center; gap: 8px; padding: 9px 10px; cursor: pointer; }
  .shot-round-row:active { background: color-mix(in srgb, var(--gold) 8%, transparent); }
  .shot-round-row.expanded { background: color-mix(in srgb, var(--gold) 10%, transparent); }
  .shot-round-date { font-size: 12px; color: var(--text-primary); font-weight: 500; }
  .shot-round-stats { flex: 1; font-size: 12px; color: var(--text-secondary); text-align: right; }
  .shot-round-stats b { color: var(--gold); font-weight: 600; }
  .shot-round-wrap .shot-expand-shots { padding: 0 8px 8px; }
  .empty-icon { font-size: 32px; margin-bottom: 8px; display: block; }

  @keyframes fadeIn { from{opacity:0} to{opacity:1} }
  @keyframes slideUp { from{transform:translateY(40px);opacity:0} to{transform:translateY(0);opacity:1} }

  /* Dialog */
  .dialog-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; display: flex; align-items: flex-end; justify-content: center; animation: fadeIn 0.15s ease; }
  .dialog-sheet { background: var(--surface); border-top: 0.5px solid color-mix(in srgb, var(--gold) 20%, transparent); border-radius: 22px 22px 0 0; padding: 8px 0 calc(var(--safe-bottom) + 8px); width: 100%; max-width: 430px; animation: slideUp 0.2s ease; }
  .dialog-handle { width: 36px; height: 4px; background: var(--border-mid); border-radius: 2px; margin: 8px auto 16px; }
  .dialog-icon { text-align: center; margin-bottom: 8px; min-height: 36px; display: flex; align-items: center; justify-content: center; font-size: 36px; }
  .dialog-title { font-size: 18px; font-weight: 700; text-align: center; color: var(--text-primary); padding: 0 20px; margin-bottom: 6px; }
  .dialog-sub { font-size: 14px; color: var(--text-secondary); text-align: center; padding: 0 24px; margin-bottom: 20px; line-height: 1.5; }
  .dialog-actions { padding: 0 16px; display: flex; flex-direction: column; gap: 8px; }
  .dialog-btn { display: flex; align-items: center; justify-content: center; width: 100%; padding: 15px; border-radius: var(--radius); border: none; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .dialog-btn-primary { background: var(--btn-primary); color: var(--on-btn-primary); }
  .dialog-btn-danger { background: var(--warning); color: #fff; }
  .dialog-btn-secondary { background: color-mix(in srgb, var(--surface) 85%, transparent); color: var(--text-muted); border: 0.5px solid var(--border); }

  /* Toast */
  #toast { position: fixed; bottom: calc(var(--safe-bottom) + 120px); left: 50%; transform: translateX(-50%) translateY(20px); background: color-mix(in srgb, var(--surface) 95%, transparent); color: var(--text-primary); border: 0.5px solid var(--border); padding: 10px 20px; border-radius: 100px; font-size: 13px; font-weight: 500; opacity: 0; transition: opacity 0.25s, transform 0.25s; pointer-events: none; white-space: nowrap; z-index: 999; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Bottom nav */
  .nav-shell { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 430px; z-index: 150; }
  .nav-row { display: flex; background: color-mix(in srgb, var(--bg) 95%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  .nav-primary { border-top: 0.5px solid color-mix(in srgb, var(--gold) 20%, transparent); padding-bottom: calc(var(--safe-bottom) + 6px); transform: translateY(0); transition: transform 350ms cubic-bezier(0.4,0,0.2,1); will-change: transform; position: relative; z-index: 2; }
  .nav-primary.raised { transform: translateY(-100%); }
  .nav-secondary { border-top: 0.5px solid color-mix(in srgb, var(--gold) 12%, transparent); padding-bottom: calc(var(--safe-bottom) + 6px); position: absolute; bottom: 0; left: 0; right: 0; transform: translateY(100%); transition: transform 350ms cubic-bezier(0.4,0,0.2,1); will-change: transform; z-index: 1; }
  .nav-secondary.open { transform: translateY(0); }
  .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px 4px 6px; cursor: pointer; text-decoration: none; background: none; border: none; -webkit-tap-highlight-color: transparent; transition: opacity 0.15s; }
  .nav-item:active { opacity: 0.7; }
  .nav-item img { width: 56px; height: 56px; object-fit: contain; display: block; }
  .nav-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); opacity: 0; pointer-events: none; transition: opacity 350ms ease; z-index: 140; }
  .nav-overlay.open { opacity: 1; pointer-events: auto; }

  /* Auth badge */
  .header-auth-badge { position: absolute; top: 10px; right: 14px; display: none; align-items: center; gap: 6px; background: rgba(13,13,13,0.6); backdrop-filter: blur(6px); border: 0.5px solid color-mix(in srgb, var(--gold) 20%, transparent); border-radius: 20px; padding: 5px 10px 5px 8px; z-index: 20; }
  .header-auth-badge.visible { display: flex; }
  .header-auth-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); flex-shrink: 0; }
  .header-auth-email { font-size: 11px; font-weight: 500; color: var(--gold); white-space: nowrap; }

  /* Home button — bottom-left of header, under logo */
    .home-btn { position: absolute; top: 0; left: 0; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; z-index: 60; text-decoration: none; cursor: pointer; }
  .home-btn img { width: 44px; height: 44px; object-fit: contain; display: block; }
  .home-btn:active { opacity: 0.7; }
</style>
</head>
<body>
<div class="app">
<a class="home-btn" href="index.html"><img src="icons/Home.png" alt="Home"></a>
<div id="app">
  <div class="header-img-wrap" style="position:relative;">
    <img class="header-img" src="images/Header.jpg" alt="Shot Tracker">
    <div class="header-auth-badge" id="header-badge">
      <div class="header-auth-dot"></div>
      <span class="header-auth-email" id="header-email"></span>
    </div>
  </div>
  <div class="content">

    <!-- TABS -->
    <div class="detail-tab-bar">
      <button class="detail-tab active" onclick="showDistTab('measure')" id="dtab-measure">Measure</button>
      <button class="detail-tab" onclick="showDistTab('range')" id="dtab-range">Range</button>
      <button class="detail-tab" onclick="showDistTab('data')" id="dtab-data">Data</button>
    </div>

    <!-- MEASURE TAB -->
    <div class="dist-tab-panel active" id="dist-panel-measure">

      <!-- CLUB SELECTOR -->
      <div class="card">
        <div class="card-label">Select Club</div>
        <div class="club-grid" id="club-grid"></div>
      </div>

      <!-- SHOT TRACKER -->
      <div class="card" id="tracker-card">
        <div class="card-label" id="tracker-label">Ready</div>

        <!-- GPS stability indicator -->
        <div class="gps-status">
          <div class="gps-status-row">
            <span class="gps-indicator searching" id="gps-indicator"></span>
            <span class="gps-status-text" id="gps-status-text">Acquiring GPS&hellip;</span>
          </div>
          <div class="gps-accuracy" id="gps-accuracy">—</div>
          <div class="gps-debug" id="gps-debug">no fix yet</div>
        </div>

        <!-- Stage: idle -->
        <div id="stage-idle">
          <p class="stage-instruction">Select a club, stand at the ball, then tap Start Shot</p>
          <button class="btn btn-primary" id="btn-start" onclick="startShot()" disabled>&#9679; Start Shot</button>
        </div>

        <!-- Stage: walking -->
        <div id="stage-walking" style="display:none">
          <div class="walking-dist-card">
            <span class="walking-dist-value" id="walking-dist">0</span><span class="walking-dist-unit">m</span>
            <div class="walking-dist-label">Distance so far</div>
          </div>
          <p class="stage-instruction">Walk to your ball, then tap Save Shot</p>
          <button class="btn btn-primary" onclick="markLanding()">&#10003; Save Shot</button>
          <button class="btn btn-danger" onclick="cancelShot()">&#10007; Cancel</button>
        </div>

        <!-- Stage: result -->
        <div id="stage-result" style="display:none">
          <div class="result-card">
            <span class="result-dist" id="result-dist">—</span><span class="result-unit">m</span>
            <div class="result-club" id="result-club"></div>
          </div>
          <button class="btn btn-primary" onclick="saveShot()">&#10003; Save This Shot</button>
          <button class="btn btn-outline" onclick="retakeShot()">&#8635; Retake</button>
        </div>
      </div>
    </div>

    <!-- RANGE TAB -->
    <div class="dist-tab-panel" id="dist-panel-range">
      <div class="card">
        <div class="card-label">Select Club</div>
        <div class="club-grid" id="club-grid-range"></div>
      </div>
      <div class="card">
        <div class="card-label">Distance</div>
        <input type="number" inputmode="numeric" class="range-dist-input" id="range-dist-input" placeholder="0" oninput="updateRangeSaveButton()">
        <div class="range-dist-unit">meters</div>
        <button class="btn btn-primary" style="margin-top:16px;" id="btn-range-save" onclick="saveRangeShot()" disabled>&#10003; Save Shot</button>
      </div>
    </div>

    <!-- DATA TAB -->
    <div class="dist-tab-panel" id="dist-panel-data">
      <div class="source-filter-bar">
        <button class="source-filter-btn" onclick="setSourceFilter('course')" id="sfilter-course">On Course</button>
        <button class="source-filter-btn" onclick="setSourceFilter('range')" id="sfilter-range">At Range</button>
        <button class="source-filter-btn active" onclick="setSourceFilter('both')" id="sfilter-both">Both</button>
      </div>
      <div class="card">
        <div class="history-header">
          <span class="history-title">Recorded Shots</span>
          <button class="history-clear" onclick="confirmClearAll()">Clear all</button>
        </div>
        <div id="shot-history"></div>
      </div>
    </div>

  </div>
</div>


<!-- Dialog -->
<div id="dialog-overlay" class="dialog-overlay" style="display:none" onclick="closeDialogOutside(event)">
  <div class="dialog-sheet" onclick="event.stopPropagation()">
    <div class="dialog-handle"></div>
    <div id="dialog-icon" class="dialog-icon"></div>
    <div id="dialog-title" class="dialog-title"></div>
    <div id="dialog-sub" class="dialog-sub"></div>
    <div id="dialog-actions" class="dialog-actions"></div>
  </div>
</div>

<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="gps-indicator.js"></script>
<script>
// ── Supabase ──────────────────────────────────────────────────────────────────
const SUPABASE_URL = 'https://ryqehsqqriavmuqfnzpx.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ5cWVoc3Fxcmlhdm11cWZuenB4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM3NTQ4MzcsImV4cCI6MjA5OTMzMDgzN30.Po2m7uhlMTc43Pdg8pohwvDsQ_UDFRS-n9UnTQ44nXA';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let currentUser = null;
sb.auth.getSession().then(({ data }) => {
  if (data.session) {
    currentUser = data.session.user;
    // getSession() can resolve before the DOM finishes parsing — defer the
    // badge DOM update if so, but load data immediately either way.
    function showBadge() {
      var badge = document.getElementById('header-badge');
      var email = document.getElementById('header-email');
      if (badge) badge.classList.add('visible');
      if (email) email.textContent = data.session.user.email;
    }
    if (document.readyState === 'loading') {
      document.addEventListener('DOMContentLoaded', showBadge);
    } else {
      showBadge();
    }
    loadDistancesFromSupabase();
  }
});

// ── Club definitions ──────────────────────────────────────────────────────────
const ALL_CLUBS_FULL = {
  'driver':'Driver','3wood':'3-Wood','4wood':'4-Wood','5wood':'5-Wood','7wood':'7-Wood','9wood':'9-Wood',
  '2hybrid':'2-Hybrid','3hybrid':'3-Hybrid','4hybrid':'4-Hybrid','5hybrid':'5-Hybrid','6hybrid':'6-Hybrid',
  '2iron':'2-Iron','3iron':'3-Iron','4iron':'4-Iron','5iron':'5-Iron','6iron':'6-Iron',
  '7iron':'7-Iron','8iron':'8-Iron','9iron':'9-Iron',
  'pw':'Pitching Wedge','gw':'Gap Wedge','sw':'Sand Wedge','lw':'Lob Wedge','putter':'Putter'
};
// Short labels for the compact grid buttons (full names shown elsewhere, e.g. Recorded Shots)
const ALL_CLUBS_SHORT = {
  'driver':'DR','3wood':'3W','4wood':'4W','5wood':'5W','7wood':'7W','9wood':'9W',
  '2hybrid':'2H','3hybrid':'3H','4hybrid':'4H','5hybrid':'5H','6hybrid':'6H',
  '2iron':'2i','3iron':'3i','4iron':'4i','5iron':'5i','6iron':'6i',
  '7iron':'7i','8iron':'8i','9iron':'9i',
  'pw':'PW','gw':'GW','sw':'SW','lw':'LW','putter':'PT'
};
const savedBag = JSON.parse(localStorage.getItem('golf-bag-v1') || 'null');
const BAG = savedBag || ['driver','3wood','5wood','4hybrid','5iron','6iron','7iron','8iron','9iron','pw','gw','sw','lw','putter'];

// ── State ─────────────────────────────────────────────────────────────────────
let selectedClub  = null;
let startPosition = null;
let pendingDist   = null;
let pendingClub   = null;
let clubDistances = JSON.parse(localStorage.getItem('golf-club-distances') || '{}');

function persist() {
  localStorage.setItem('golf-club-distances', JSON.stringify(clubDistances));
}

// ── Supabase save/load ────────────────────────────────────────────────────────
async function saveDistanceToSupabase(club, dist, source) {
  if (!currentUser) return;
  try {
    await sb.from('club_distances').insert({
      user_id: currentUser.id, club: club, distance: dist,
      date: new Date().toISOString().split('T')[0],
      source: source || 'course'
    });
  } catch(e) { console.error('Supabase club save error:', e); }
}

async function loadDistancesFromSupabase() {
  if (!currentUser) return;
  try {
    const { data } = await sb.from('club_distances')
      .select('club, distance, date, source').eq('user_id', currentUser.id)
      .order('created_at', { ascending: true });
    if (!data || data.length === 0) return;
    data.forEach(row => {
      if (!clubDistances[row.club]) clubDistances[row.club] = [];
      const exists = clubDistances[row.club].some(s => s.dist === row.distance && s.date === new Date(row.date).toLocaleDateString('en-AU'));
      if (!exists) clubDistances[row.club].push({ dist: row.distance, date: new Date(row.date).toLocaleDateString('en-AU'), source: row.source || 'course' });
    });
    persist();
    renderHistory();
  } catch(e) { console.error('Supabase club load error:', e); }
}

// ── Club selector grid — reusable for both Measure and Range tabs ─────────────
function renderClubGridInto(gridId, selected, onSelectFn) {
  const grid = document.getElementById(gridId);
  if (!grid) return;
  grid.innerHTML = BAG.map(id =>
    '<button class="club-grid-btn' + (selected===id?' selected':'') + '" onclick="'+onSelectFn+'(\''+id+'\')" title="' + (ALL_CLUBS_FULL[id]||id) + '">' +
    (ALL_CLUBS_SHORT[id] || (ALL_CLUBS_FULL[id]||id)) +
    '</button>'
  ).join('');
}

function renderClubGrid() {
  renderClubGridInto('club-grid', selectedClub, 'selectClub');
}

function selectClub(id) {
  selectedClub = id;
  renderClubGrid();
  document.getElementById('btn-start').disabled = false;
}

// ── Range tab ───────────────────────────────────────────────────────────────
let selectedClubRange = null;

function renderClubGridRange() {
  renderClubGridInto('club-grid-range', selectedClubRange, 'selectClubRange');
}

function selectClubRange(id) {
  selectedClubRange = id;
  renderClubGridRange();
  updateRangeSaveButton();
}

function updateRangeSaveButton() {
  const distVal = parseFloat(document.getElementById('range-dist-input').value);
  document.getElementById('btn-range-save').disabled = !selectedClubRange || isNaN(distVal) || distVal <= 0;
}

function saveRangeShot() {
  const distVal = Math.round(parseFloat(document.getElementById('range-dist-input').value));
  if (!selectedClubRange || isNaN(distVal) || distVal <= 0) return;
  if (!clubDistances[selectedClubRange]) clubDistances[selectedClubRange] = [];
  clubDistances[selectedClubRange].push({ dist: distVal, date: new Date().toLocaleDateString('en-AU'), source: 'range' });
  persist();
  saveDistanceToSupabase(selectedClubRange, distVal, 'range');
  showToast((ALL_CLUBS_FULL[selectedClubRange]||selectedClubRange) + ' \u2014 ' + distVal + 'm saved (Range)');
  document.getElementById('range-dist-input').value = '';
  updateRangeSaveButton();
  renderHistory();
}

// ── Tabs ────────────────────────────────────────────────────────────────────
function showDistTab(t) {
  ['measure','range','data'].forEach(id => {
    document.getElementById('dist-panel-'+id).classList.toggle('active', id===t);
    document.getElementById('dtab-'+id).classList.toggle('active', id===t);
  });
  if (t === 'range') renderClubGridRange();
}

// ── GPS ───────────────────────────────────────────────────────────────────────
// currentFix, watchId, accuracyTier(), and the indicator UI itself are all
// provided by gps-indicator.js (shared component — see that file).
function startWatch() {
  startGpsWatch(function(fix) {
    if (currentStage === 'walking' && startPosition) updateWalkingDistance();
  });
}

function updateWalkingDistance() {
  if (!currentFix || !startPosition) return;
  document.getElementById('walking-dist').textContent = haversine(startPosition, currentFix);
}

function haversine(a, b) {
  const R = 6371000, f1 = a.latitude*Math.PI/180, f2 = b.latitude*Math.PI/180;
  const df = (b.latitude-a.latitude)*Math.PI/180;
  const dl = (b.longitude-a.longitude)*Math.PI/180;
  const x  = Math.sin(df/2)**2 + Math.cos(f1)*Math.cos(f2)*Math.sin(dl/2)**2;
  return Math.round(2*R*Math.asin(Math.sqrt(x)));
}

// ── Shot flow ─────────────────────────────────────────────────────────────────
let currentStage = 'idle';

function setStage(name) {
  currentStage = name;
  ['idle','walking','result'].forEach(s => {
    document.getElementById('stage-'+s).style.display = s===name ? 'block' : 'none';
  });
}

function startShot() {
  if (!selectedClub) { showToast('Select a club first'); return; }
  if (!currentFix) { showToast('Waiting for a GPS fix\u2026'); return; }
  const tier = accuracyTier(currentFix.accuracy);
  if (tier === 'poor') {
    showDialog({
      icon: '&#9888;',
      title: 'Poor GPS Accuracy',
      sub: 'Current accuracy is \u00b1' + Math.round(currentFix.accuracy) + 'm. Starting now may give an inaccurate distance. Record the start position anyway?',
      buttons: [
        { label: 'Record anyway', style: 'primary', action: lockStart },
        { label: 'Wait for better signal', style: 'secondary', action: () => {} }
      ]
    });
  } else { lockStart(); }
}

function lockStart() {
  startPosition = { latitude: currentFix.latitude, longitude: currentFix.longitude };
  document.getElementById('walking-dist').textContent = '0';
  document.getElementById('tracker-label').textContent = 'Walk to your ball';
  setStage('walking');
  showToast('Start marked (\u00b1' + Math.round(currentFix.accuracy) + 'm) \u2014 walk to your ball');
}

function markLanding() {
  if (!currentFix) { showToast('Waiting for a GPS fix\u2026'); return; }
  const tier = accuracyTier(currentFix.accuracy);
  if (tier === 'poor') {
    showDialog({
      icon: '&#9888;',
      title: 'Poor GPS Accuracy',
      sub: 'Current accuracy is \u00b1' + Math.round(currentFix.accuracy) + 'm. Recording now may give an inaccurate distance. Record the finish position anyway?',
      buttons: [
        { label: 'Record anyway', style: 'primary', action: lockFinish },
        { label: 'Wait for better signal', style: 'secondary', action: () => {} }
      ]
    });
  } else { lockFinish(); }
}

function lockFinish() {
  const dist = haversine(startPosition, currentFix);
  pendingDist = dist;
  pendingClub = selectedClub;
  // Save immediately — no result stage
  saveShot();
}

function saveShot() {
  if (!pendingClub || pendingDist === null) return;
  if (!clubDistances[pendingClub]) clubDistances[pendingClub] = [];
  clubDistances[pendingClub].push({ dist: pendingDist, date: new Date().toLocaleDateString('en-AU'), source: 'course' });
  persist();
  saveDistanceToSupabase(pendingClub, pendingDist, 'course');
  showToast((ALL_CLUBS_FULL[pendingClub]||pendingClub) + ' \u2014 ' + pendingDist + 'm saved');
  resetTracker();
  renderHistory();
}

function retakeShot() {
  document.getElementById('tracker-label').textContent = 'Walk to your ball';
  setStage('walking');
}

function cancelShot() { resetTracker(); }

function resetTracker() {
  startPosition = null; pendingDist = null; pendingClub = null;
  document.getElementById('tracker-label').textContent = 'Ready';
  document.getElementById('stage-idle').querySelector('p').textContent = 'Select a club, stand at the ball, then tap Start Shot';
  document.getElementById('btn-start').disabled = !selectedClub;
  setStage('idle');
}

// ── Data tab: source filter + expandable club rows ─────────────────────────────
let dataSourceFilter = 'both'; // 'course' | 'range' | 'both'
let expandedClubId   = null;
let last5RoundsOpen  = false;  // whether "Last 5 Rounds" is expanded into per-round rows
let expandedRoundDate = null;  // which specific past date's shots are shown, if any

function setSourceFilter(f) {
  dataSourceFilter = f;
  ['course','range','both'].forEach(id => {
    document.getElementById('sfilter-'+id).classList.toggle('active', id===f);
  });
  renderHistory();
}

function shotsMatchingFilter(shots) {
  if (dataSourceFilter === 'both') return shots;
  return shots.filter(s => (s.source || 'course') === dataSourceFilter);
}

function todayStr() { return new Date().toLocaleDateString('en-AU'); }

// Dates are stored via toLocaleDateString('en-AU') => d/m/yyyy — parse for sorting
function parseAuDate(str) {
  const p = str.split('/');
  return new Date(parseInt(p[2]), parseInt(p[1])-1, parseInt(p[0])).getTime();
}

function statsFor(shots) {
  if (!shots.length) return null;
  const dists = shots.map(s => s.dist);
  return { best: Math.max(...dists), avg: Math.round(dists.reduce((a,v)=>a+v,0)/dists.length) };
}

function toggleClubExpand(id) {
  expandedClubId = (expandedClubId === id) ? null : id;
  last5RoundsOpen = false;
  expandedRoundDate = null;
  renderHistory();
}

function toggleLast5Rounds() {
  last5RoundsOpen = !last5RoundsOpen;
  expandedRoundDate = null;
  renderHistory();
}

function toggleRoundDate(date) {
  expandedRoundDate = (expandedRoundDate === date) ? null : date;
  renderHistory();
}

function deleteShot(clubId, index) {
  showDialog({
    icon: '&#128465;',
    title: 'Delete This Shot?',
    sub: 'Remove the ' + (clubDistances[clubId][index].dist) + 'm shot recorded on ' + clubDistances[clubId][index].date + '?',
    buttons: [
      { label: 'Delete', style: 'danger', action: () => {
        clubDistances[clubId].splice(index, 1);
        if (clubDistances[clubId].length === 0) delete clubDistances[clubId];
        persist();
        renderHistory();
        showToast('Shot deleted');
      }},
      { label: 'Cancel', style: 'secondary', action: () => {} }
    ]
  });
}

// ── History ───────────────────────────────────────────────────────────────────
function renderHistory() {
  const el = document.getElementById('shot-history');
  const entries = BAG.filter(id => clubDistances[id] && shotsMatchingFilter(clubDistances[id]).length > 0);
  if (!entries.length) {
    el.innerHTML = '<div class="empty-state"><span class="empty-icon">&#127953;</span>No shots recorded yet.<br>Select a club and start tracking.</div>';
    return;
  }
  const today = todayStr();

  el.innerHTML = '<div class="shot-list">' + entries.map(id => {
    const allShots = shotsMatchingFilter(clubDistances[id]);
    const overall  = statsFor(allShots);
    const isOpen   = expandedClubId === id;

    let expandedHtml = '';
    if (isOpen) {
      // This round = today's shots (matching the source filter)
      const todayShots = allShots.filter(s => s.date === today);
      const todayStats = statsFor(todayShots);
      const last5Today = [...todayShots].reverse().slice(0, 5);

      // Only show "This Round" at all if there's actually something today
      let thisRoundHtml = '';
      if (todayStats) {
        thisRoundHtml = '<div class="shot-expand-section">' +
          '<div class="shot-expand-heading">This Round</div>' +
          '<div class="shot-expand-stats"><span>Best <b>' + todayStats.best + 'm</b></span><span>Avg <b>' + todayStats.avg + 'm</b></span></div>' +
          '<div class="shot-expand-shots">' + last5Today.map(s => {
            const realIndex = clubDistances[id].indexOf(s);
            return '<div class="shot-expand-row"><span class="shot-expand-dist">' + s.dist + 'm</span>' +
              '<div class="shot-expand-meta"><span class="shot-expand-src">' + (s.source==='range'?'Range':'Course') + '</span>' +
              '<button class="shot-expand-del" onclick="event.stopPropagation();deleteShot(\''+id+'\','+realIndex+')" aria-label="Delete">&#128465;</button></div></div>';
          }).join('') + '</div>' +
        '</div>';
      }

      // Last 5 rounds = the 5 most recent distinct dates before today with shots.
      // Tapping it expands into one row per round; tapping a round reveals every
      // individual shot from that date (uncapped) so a bad outlier can be found and deleted.
      const pastDates = [...new Set(allShots.filter(s => s.date !== today).map(s => s.date))];
      pastDates.sort((a,b) => parseAuDate(b) - parseAuDate(a));
      const last5Dates = pastDates.slice(0, 5);
      const last5RoundsShots = allShots.filter(s => last5Dates.includes(s.date));
      const last5RoundsStats = statsFor(last5RoundsShots);

      let last5Html;
      if (last5RoundsStats) {
        let datesListHtml = '';
        if (last5RoundsOpen) {
          datesListHtml = '<div class="shot-rounds-list">' + last5Dates.map(date => {
            const dateShots = allShots.filter(s => s.date === date);
            const dateStats = statsFor(dateShots);
            const dateOpen = expandedRoundDate === date;
            let shotsListHtml = '';
            if (dateOpen) {
              shotsListHtml = '<div class="shot-expand-shots">' + dateShots.map(s => {
                const realIndex = clubDistances[id].indexOf(s);
                return '<div class="shot-expand-row"><span class="shot-expand-dist">' + s.dist + 'm</span>' +
                  '<div class="shot-expand-meta"><span class="shot-expand-src">' + (s.source==='range'?'Range':'Course') + '</span>' +
                  '<button class="shot-expand-del" onclick="event.stopPropagation();deleteShot(\''+id+'\','+realIndex+')" aria-label="Delete">&#128465;</button></div></div>';
              }).join('') + '</div>';
            }
            return '<div class="shot-round-wrap">' +
              '<div class="shot-round-row' + (dateOpen?' expanded':'') + '" onclick="event.stopPropagation();toggleRoundDate(\''+date+'\')">' +
                '<span class="shot-round-date">' + date + '</span>' +
                '<span class="shot-round-stats">Best <b>' + dateStats.best + 'm</b> &middot; Avg <b>' + dateStats.avg + 'm</b></span>' +
                '<span class="shot-expand-arrow">' + (dateOpen?'&#9652;':'&#9662;') + '</span>' +
              '</div>' +
              shotsListHtml +
            '</div>';
          }).join('') + '</div>';
        }
        last5Html = '<div class="shot-expand-section">' +
          '<div class="shot-expand-heading-row' + (last5RoundsOpen?' expanded':'') + '" onclick="event.stopPropagation();toggleLast5Rounds()">' +
            '<span class="shot-expand-heading" style="margin:0;">Last 5 Rounds</span>' +
            '<span class="shot-expand-heading-stats">Best <b>' + last5RoundsStats.best + 'm</b> &middot; Avg <b>' + last5RoundsStats.avg + 'm</b></span>' +
            '<span class="shot-expand-arrow">' + (last5RoundsOpen?'&#9652;':'&#9662;') + '</span>' +
          '</div>' +
          datesListHtml +
        '</div>';
      } else {
        last5Html = '<div class="shot-expand-section">' +
          '<div class="shot-expand-heading">Last 5 Rounds</div>' +
          '<div class="shot-expand-empty">No prior rounds recorded</div>' +
        '</div>';
      }

      expandedHtml = '<div class="shot-expand">' + thisRoundHtml + last5Html + '</div>';
    }

    return '<div class="shot-item-wrap">' +
      '<div class="shot-item' + (isOpen?' expanded':'') + '" onclick="toggleClubExpand(\'' + id + '\')">' +
        '<div class="shot-club">' + (ALL_CLUBS_FULL[id]||id) + '</div>' +
        '<div class="shot-stats-inline"><span>Best <b>' + overall.best + 'm</b></span><span>Avg <b>' + overall.avg + 'm</b></span></div>' +
        '<span class="shot-expand-arrow">' + (isOpen?'&#9652;':'&#9662;') + '</span>' +
      '</div>' +
      expandedHtml +
    '</div>';
  }).join('') + '</div>';
}

function confirmClearAll() {
  showDialog({
    icon: '&#128465;',
    title: 'Clear All Shots?',
    sub: 'This will permanently delete all recorded club distances.',
    buttons: [
      { label: 'Clear everything', style: 'danger', action: () => { clubDistances = {}; expandedClubId = null; persist(); renderHistory(); showToast('All shots cleared'); }},
      { label: 'Cancel', style: 'secondary', action: () => {} }
    ]
  });
}

// ── Dialog ────────────────────────────────────────────────────────────────────
function showDialog(opts) {
  document.getElementById('dialog-icon').innerHTML    = opts.icon  || '';
  document.getElementById('dialog-title').textContent = opts.title || '';
  document.getElementById('dialog-sub').textContent   = opts.sub   || '';
  document.getElementById('dialog-actions').innerHTML = opts.buttons.map((b,i) =>
    '<button class="dialog-btn dialog-btn-'+(b.style||'secondary')+'" onclick="dialogAction('+i+')">'+b.label+'</button>'
  ).join('');
  window._dialogActions = opts.buttons.map(b => b.action);
  document.getElementById('dialog-overlay').style.display = 'flex';
}
function dialogAction(i) { closeDialog(); window._dialogActions?.[i]?.(); }
function closeDialogOutside(e) { if (e.target===document.getElementById('dialog-overlay')) closeDialog(); }
function closeDialog() { document.getElementById('dialog-overlay').style.display = 'none'; }

// ── Toast ─────────────────────────────────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}
