<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="theme.js"></script>
<script>
  // index2.html is specifically the light-mode variant of the home screen —
  // it should always render light regardless of the app's stored theme
  // preference. This only affects this page's own rendering; it does NOT
  // write to localStorage, so navigating elsewhere still respects whatever
  // theme is actually selected for the rest of the app.
  document.documentElement.setAttribute('data-theme', 'light');
</script>
<link rel="stylesheet" href="theme.css">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Shot Tracker">
<meta name="theme-color" content="#0D0D0D">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.svg">
<title>Shot Tracker</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  /* ── Page-specific aliases + layout vars. Core theme colors (--bg, --gold,
     etc.) come from theme.css, loaded in <head>. ── */
  :root {
    --bg-primary:      var(--bg);
  }
  :root {
    --safe-top:     env(safe-area-inset-top, 0px);
    --safe-bottom:  env(safe-area-inset-bottom, 0px);
  }

  html, body {
    height: 100%;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg-primary);
    overflow: hidden;
  }

  .app {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 430px;
    margin: 0 auto;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ── Top hero image — sits at natural aspect ratio, not full-bleed ── */
  .top-hero-wrap {
    position: relative;
    width: 100%;
    flex-shrink: 0;
  }

  .top-hero-img {
    width: 100%;
    height: auto;
    display: block;
  }

  /* ── Remaining screen area below the hero, plain page background ── */
  .body-fill {
    flex: 1;
    background: var(--bg);
  }

  /* ── Header icons — top right, overlaid on the hero image ────────── */
  .header-icons {
    position: absolute;
    top: 14px;
    right: 14px;
    display: flex;
    align-items: center;
    gap: 10px;
    z-index: 60;
  }

  .header-icons a {
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    text-decoration: none;
  }

  .header-icons img {
    width: 38px;
    height: 38px;
    object-fit: contain;
    display: block;
  }

  .header-icons a:active { opacity: 0.7; }

  /* ── Bottom nav shell — standard 5-icon nav, same as every other page.
     Icons stay the normal green-in-light-mode treatment (NOT the white
     override used on index.html) since there's no grass photo behind the
     nav here — white icons would be nearly invisible on the plain
     light background. ── */
  .nav-shell {
    flex-shrink: 0;
  }

  .nav-row {
    display: flex;
    background: none;
    border-top: 0.5px solid color-mix(in srgb, var(--gold) 20%, transparent);
    padding-bottom: calc(var(--safe-bottom) + 6px);
  }

  .nav-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 10px 4px 6px;
    text-decoration: none;
    background: none;
    border: none;
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
    transition: opacity 0.15s;
  }

  .nav-item:active { opacity: 0.7; }

  .nav-item img {
    width: 70px;
    height: 70px;
    object-fit: contain;
    object-position: bottom;
    display: block;
  }
</style>
</head>
<body>
<div class="app">

  <!-- Top hero image — natural aspect ratio, full width -->
  <div class="top-hero-wrap">
    <img class="top-hero-img" src="images/Main_header-light.png" alt="Shot Tracker">
    <div class="header-icons">
      <a href="settings.html">
        <img src="icons/login-light.png" alt="Login">
      </a>
      <a href="settings.html">
        <img src="icons/Settings-light.png" alt="Settings">
      </a>
    </div>
  </div>

  <!-- Remaining screen space below the hero -->
  <div class="body-fill"></div>

  <!-- Nav shell — flat row, 5 icons, linked -->
  <div class="nav-shell">
    <div class="nav-row">
      <a class="nav-item" href="find.html">
        <img src="icons/Courses.png" alt="Courses">
      </a>
      <a class="nav-item" id="nav-play" href="start.html">
        <img src="icons/Play.png" alt="Play">
      </a>
      <a class="nav-item" href="distance.html">
        <img src="icons/Distance.png" alt="Distance">
      </a>
      <a class="nav-item" href="suggest.html">
        <img src="icons/Suggest.png" alt="Suggest">
      </a>
      <a class="nav-item" href="history.html">
        <img src="icons/History.png" alt="History">
      </a>
    </div>
  </div>

</div>

<script>
// ── Continue round — swap Play to round.html if in progress ──────────────────
const inProgressScores = JSON.parse(localStorage.getItem('golf-scores-v1') || '{}');
const inProgressHole   = localStorage.getItem('golf-current-hole');
if (Object.keys(inProgressScores).length > 0 || (inProgressHole && parseInt(inProgressHole) > 1)) {
  document.getElementById('nav-play').setAttribute('href', 'round.html');
}

if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/sw.js').catch(()=>{}); }
</script>
</body>
</html>
