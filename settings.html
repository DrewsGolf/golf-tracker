<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0D0D0D">
<link rel="manifest" href="manifest.json">
<title>Settings — Shot Tracker</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg-primary:    #0D0D0D;
    --bg-card:       #1C1C1C;
    --gold:          #C8A96A;
    --gold-muted:    #9A7C47;
    --text-primary:  #F2F2F2;
    --text-muted:    #9A9A9A;
    --safe-top:      env(safe-area-inset-top, 0px);
    --safe-bottom:   env(safe-area-inset-bottom, 0px);
  }

  html, body {
    height: 100%;
    font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--bg-primary);
    overflow: hidden;
  }

  /* ── App container — identical to index.html ── */
  .app {
    position: relative;
    width: 100%;
    height: 100%;
    max-width: 430px;
    margin: 0 auto;
    overflow: hidden;
    display: flex;
    flex-direction: column;
  }

  /* ── Background image ── */
  .hero {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
  }

  .hero-img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    object-position: center;
    display: block;
  }

  /* ── Dark overlay on background ── */
  .hero-overlay {
    position: absolute;
    inset: 0;
    background: rgba(13,13,13,0.65);
  }

  /* ── Header ── */
  .header-img-wrap { position: relative; z-index: 10; width: 100%; flex-shrink: 0; }
  .header-img { width: 100%; height: auto; display: block; }
  .header {
    position: absolute;
    top: 0;
    left: 0;
    right: 0;
    padding: calc(var(--safe-top) + 20px) 24px 20px;
    display: flex;
    align-items: center;
    gap: 16px;
    border-bottom: 0.5px solid rgba(200,169,106,0.2);
    z-index: 10;
  }

  .header-logo { height: 80px; object-fit: contain; }
  .header-title { font-size: 13px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-muted); }

  /* ── Scrollable page content wrapper ── */
  .page-scroll {
    position: relative;
    z-index: 5;
    flex: 1 1 auto;
    min-height: 0;
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
    padding-bottom: calc(110px + var(--safe-bottom));
  }

  /* ── Settings content ── */
  .settings-content {
    position: relative;
    z-index: 10;
    padding: 0;
    flex-shrink: 0;
  }

  .settings-card {
    background: rgba(28,28,28,0.85);
    border: 0.5px solid var(--gold);
    border-radius: 16px;
    overflow: hidden;
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
  }

  .settings-item {
    display: flex;
    align-items: center;
    gap: 16px;
    padding: 18px 20px;
    text-decoration: none;
    color: inherit;
    border-bottom: 0.5px solid rgba(200,169,106,0.1);
    transition: background 0.15s;
  }

  .settings-item:last-child { border-bottom: none; }
  .settings-item:active { background: rgba(200,169,106,0.08); }

  .settings-item-icon { width: 36px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .settings-item-body { flex: 1; }
  .settings-item-title { font-size: 15px; font-weight: 500; color: var(--gold); margin-bottom: 2px; }
  .settings-item-desc { font-size: 12px; color: var(--text-muted); letter-spacing: 0.01em; }
  .settings-item-arrow { font-size: 18px; color: var(--gold-muted); }

  /* ── Toggle switch ── */
  .toggle-switch { position: relative; width: 48px; height: 28px; flex-shrink: 0; }
  .toggle-switch input { opacity: 0; width: 0; height: 0; position: absolute; }
  .toggle-track {
    position: absolute; inset: 0; border-radius: 14px;
    background: rgba(154,124,71,0.35);
    border: 0.5px solid rgba(200,169,106,0.3);
    transition: background 0.2s ease;
    cursor: pointer;
  }
  .toggle-track::before {
    content: '';
    position: absolute;
    top: 2px; left: 2px;
    width: 22px; height: 22px;
    border-radius: 50%;
    background: var(--text-primary);
    transition: transform 0.2s ease;
  }
  .toggle-switch input:checked + .toggle-track { background: var(--gold); }
  .toggle-switch input:checked + .toggle-track::before { transform: translateX(20px); background: #0D0D0D; }

  /* ── Nav — identical to index.html ── */
  .nav-shell {
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    z-index: 100;
  }

  .nav-row {
    display: flex;
    background: rgba(13,13,13,0.92);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
  }

  .nav-primary {
    border-top: 0.5px solid rgba(200,169,106,0.2);
    padding-bottom: calc(var(--safe-bottom) + 6px);
    transform: translateY(0);
    transition: transform 350ms cubic-bezier(0.4, 0, 0.2, 1);
    will-change: transform;
    position: relative;
    z-index: 2;
  }

  .nav-primary.raised { transform: translateY(-100%); }

  .nav-secondary {
    border-top: 0.5px solid rgba(200,169,106,0.12);
    padding-bottom: calc(var(--safe-bottom) + 6px);
    position: absolute;
    bottom: 0;
    left: 0;
    right: 0;
    transform: translateY(100%);
    transition: transform 350ms cubic-bezier(0.4, 0, 0.2, 1);
    will-change: transform;
    z-index: 1;
  }

  .nav-secondary.open { transform: translateY(0); }

  .nav-item {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 10px 4px 6px;
    cursor: pointer;
    text-decoration: none;
    background: none;
    border: none;
    -webkit-tap-highlight-color: transparent;
    transition: opacity 0.15s;
  }

  .nav-item:active { opacity: 0.7; }
  .nav-item img { width: 56px; height: 56px; object-fit: contain; display: block; }

  .nav-overlay {
    position: absolute;
    inset: 0;
    background: rgba(0,0,0,0.5);
    opacity: 0;
    pointer-events: none;
    transition: opacity 350ms ease;
    z-index: 90;
  }

  .nav-overlay.open { opacity: 1; pointer-events: auto; }

  /* Header auth badge */
  .header-auth-badge { position: absolute; top: 10px; right: 14px; display: none; align-items: center; gap: 6px; background: rgba(13,13,13,0.6); backdrop-filter: blur(6px); border: 0.5px solid rgba(200,169,106,0.2); border-radius: 20px; padding: 5px 10px 5px 8px; }
  .header-auth-badge.visible { display: flex; }
  .header-auth-dot { width: 8px; height: 8px; border-radius: 50%; background: #2ecc71; flex-shrink: 0; }
  .header-auth-email { font-size: 11px; font-weight: 500; color: var(--gold); white-space: nowrap; }

  /* Handicap card */
  .handicap-input { width: 64px; background: rgba(13,13,13,0.7); border: 0.5px solid rgba(200,169,106,0.3); border-radius: 8px; padding: 7px 8px; font-size: 18px; font-weight: 300; color: var(--gold); font-family: inherit; text-align: center; -webkit-appearance: none; -moz-appearance: textfield; }
  .handicap-input::-webkit-outer-spin-button, .handicap-input::-webkit-inner-spin-button { -webkit-appearance: none; }
  .handicap-input:focus { outline: none; border-color: var(--gold); }
  .handicap-save-btn { background: transparent; color: var(--gold); border: 0.5px solid var(--gold); border-radius: 8px; padding: 7px 12px; font-size: 13px; font-weight: 500; cursor: pointer; font-family: inherit; white-space: nowrap; }
  .handicap-save-btn:active { opacity: 0.75; }
  .handicap-updated { font-size: 12px; color: var(--text-muted); }

  /* Auth section */
  .auth-card { background: rgba(28,28,28,0.85); border: 0.5px solid var(--gold); border-radius: 16px; overflow: hidden; backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); margin-top: 12px; flex-shrink: 0; }
  .auth-status { padding: 16px 20px; display: flex; align-items: center; gap: 12px; border-bottom: 0.5px solid rgba(200,169,106,0.1); }
  .auth-dot { width: 10px; height: 10px; border-radius: 50%; background: #666; flex-shrink: 0; }
  .auth-dot.connected { background: #2ecc71; }
  .auth-label { font-size: 13px; color: var(--text-muted); flex: 1; }
  .auth-email { font-size: 13px; font-weight: 500; color: var(--gold); }
  .auth-field-wrap { padding: 14px 20px; border-bottom: 0.5px solid rgba(200,169,106,0.1); }
  .auth-field { width: 100%; background: rgba(13,13,13,0.7); border: 0.5px solid rgba(200,169,106,0.3); border-radius: 9px; padding: 11px 14px; font-size: 15px; color: #F2F2F2; font-family: inherit; -webkit-appearance: none; }
  .auth-field:focus { outline: none; border-color: var(--gold); }
  .auth-btn { width: calc(100% - 40px); margin: 14px 20px; display: block; background: var(--gold); color: #0D0D0D; border: none; border-radius: 10px; padding: 13px; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; text-align: center; }
  .auth-btn.sign-out { background: transparent; color: #e74c3c; border: 0.5px solid rgba(231,76,60,0.4); }
  .auth-btn:active { opacity: 0.8; }
  .auth-error { font-size: 12px; color: #e74c3c; text-align: center; padding: 0 20px 12px; min-height: 18px; }
  .auth-section-label { font-size: 10px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-muted); padding: 14px 20px 4px; }

  /* Home button — bottom-left of header, under logo */
    .home-btn { position: absolute; top: 0; left: 0; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; z-index: 60; text-decoration: none; cursor: pointer; }
  .home-btn img { width: 44px; height: 44px; object-fit: contain; display: block; }
  .home-btn:active { opacity: 0.7; }
</style>
</head>
<body>
<div class="app">
<a class="home-btn" href="index.html"><img src="icons/Home.png" alt="Home"></a>

  <!-- Background image -->
  <div class="hero">
    <img class="hero-img" src="Back_ground_New.jpg" alt="">
    <div class="hero-overlay"></div>
  </div>

  <!-- Scrollable content: header + settings + account -->
  <div class="page-scroll">

  <!-- Header -->
  <div class="header-img-wrap" style="position:relative;">
    <img class="header-img" src="Header.webp" alt="Shot Tracker">
    <div class="header-auth-badge" id="header-badge">
      <div class="header-auth-dot"></div>
      <span class="header-auth-email" id="header-email"></span>
    </div>
  </div>

  <!-- Settings content -->
  <div class="settings-content">

    <div class="settings-card">
      <!-- Handicap -->
      <div class="settings-item">
        <div class="settings-item-icon">
          <img src="mini_inons/Handicap.png" style="width:32px;height:32px;object-fit:contain;display:block;">
        </div>
        <div class="settings-item-body">
          <div class="settings-item-title">Handicap</div>
          <div class="settings-item-desc handicap-updated" id="handicap-updated">Not set</div>
        </div>
        <div style="display:flex;align-items:center;gap:8px;">
          <input class="handicap-input" type="number" id="handicap-input" min="0" max="54" step="0.1" inputmode="decimal" placeholder="–">
          <button class="handicap-save-btn" onclick="saveHandicap()">Save</button>
        </div>
      </div>
      <a class="settings-item" href="setup.html">
        <div class="settings-item-icon">
          <img src="Set_Clubs_1.png" style="width:32px;height:32px;object-fit:contain;display:block;">
        </div>
        <div class="settings-item-body">
          <div class="settings-item-title">Set Up Your Clubs</div>
          <div class="settings-item-desc">Choose which clubs are in your bag</div>
        </div>
        <div class="settings-item-arrow">›</div>
      </a>
      <div class="settings-item">
        <div class="settings-item-icon">
          <img src="mini_inons/Sound.png" style="width:32px;height:32px;object-fit:contain;display:block;">
        </div>
        <div class="settings-item-body">
          <div class="settings-item-title">Sound Effects</div>
          <div class="settings-item-desc">Play sounds during rounds</div>
        </div>
        <label class="toggle-switch">
          <input type="checkbox" id="sound-toggle" onchange="toggleSound(this.checked)">
          <span class="toggle-track"></span>
        </label>
      </div>
    </div>
  </div>

  <!-- Account / Sign In -->
  <div class="auth-card" id="auth-card">
    <!-- Sign in form (shown when logged out) — visible by default so it never disappears if the auth check is slow/fails -->
    <div id="signin-form" style="display:block;">
      <div class="auth-section-label">Sign In to Sync Your Data</div>
      <div class="auth-field-wrap">
        <input class="auth-field" type="email" id="auth-email-input" placeholder="Email" autocomplete="email" inputmode="email">
      </div>
      <div class="auth-field-wrap" style="border-bottom:none;">
        <input class="auth-field" type="password" id="auth-pass-input" placeholder="Password" autocomplete="current-password">
      </div>
      <div class="auth-error" id="auth-error"></div>
      <button class="auth-btn" onclick="doSignIn()">Sign In</button>
    </div>
    <!-- Sign out button (shown when logged in) -->
    <div id="signout-form" style="display:none;">
      <button class="auth-btn sign-out" onclick="doSignOut()">Sign Out</button>
    </div>
  </div>

  </div>
  <!-- /page-scroll -->

  <!-- Overlay -->
    <!-- Nav shell -->
  <div class="nav-shell">
    <div class="nav-row">
      <a class="nav-item" href="find.html"><img src="icons/Courses.png" alt="Courses"></a>
      <a class="nav-item" id="nav-play" href="start.html"><img src="icons/Play.png" alt="Play"></a>
      <a class="nav-item" href="distance.html"><img src="icons/Distance.png" alt="Distance"></a>
      <a class="nav-item" href="suggest.html"><img src="icons/Suggest.png" alt="Suggest"></a>
      <a class="nav-item" href="history.html"><img src="icons/History.png" alt="History"></a>
    </div>
  </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://ryqehsqqriavmuqfnzpx.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ5cWVoc3Fxcmlhdm11cWZuenB4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM3NTQ4MzcsImV4cCI6MjA5OTMzMDgzN30.Po2m7uhlMTc43Pdg8pohwvDsQ_UDFRS-n9UnTQ44nXA';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let currentUser = null;

function setAuthUI(session) {
  const badge    = document.getElementById('header-badge');
  const hEmail   = document.getElementById('header-email');
  const signIn   = document.getElementById('signin-form');
  const signOut  = document.getElementById('signout-form');
  if (session) {
    currentUser = session.user;
    badge.classList.add('visible');
    hEmail.textContent    = session.user.email;
    signIn.style.display  = 'none';
    signOut.style.display = 'block';
    loadHandicap();
  } else {
    currentUser = null;
    badge.classList.remove('visible');
    hEmail.textContent    = '';
    signIn.style.display  = 'block';
    signOut.style.display = 'none';
  }
}

sb.auth.getSession().then(({ data }) => setAuthUI(data.session)).catch(() => setAuthUI(null));

// ── Sound toggle ─────────────────────────────────────────────────────────────
// ── Handicap ──────────────────────────────────────────────────────────────────
async function loadHandicap() {
  // Try localStorage first
  const local = localStorage.getItem('golf-handicap');
  if (local) {
    const h = JSON.parse(local);
    document.getElementById('handicap-input').value = h.value;
    document.getElementById('handicap-updated').textContent = 'Last updated: ' + h.date;
  }
  // Then try Supabase
  if (!currentUser) return;
  try {
    const { data } = await sb.from('handicap').select('handicap, updated_at').eq('user_id', currentUser.id).single();
    if (data) {
      const date = new Date(data.updated_at).toLocaleDateString('en-AU');
      document.getElementById('handicap-input').value = data.handicap;
      document.getElementById('handicap-updated').textContent = 'Last updated: ' + date;
      localStorage.setItem('golf-handicap', JSON.stringify({ value: data.handicap, date: date }));
    }
  } catch(e) {}
}

async function saveHandicap() {
  const val = parseFloat(document.getElementById('handicap-input').value);
  if (isNaN(val) || val < 0 || val > 54) {
    showToast('Enter a handicap between 0 and 54');
    return;
  }
  const date = new Date().toLocaleDateString('en-AU');
  localStorage.setItem('golf-handicap', JSON.stringify({ value: val, date: date }));
  document.getElementById('handicap-updated').textContent = 'Last updated: ' + date;
  showToast('Handicap saved');
  if (!currentUser) return;
  try {
    await sb.from('handicap').upsert({ user_id: currentUser.id, handicap: val, updated_at: new Date().toISOString() }, { onConflict: 'user_id' });
  } catch(e) { console.error('Handicap save error:', e); }
}

function showToast(msg) {
  // Simple toast using existing auth-error or alert fallback
  const existing = document.getElementById('hcp-toast');
  if (existing) existing.remove();
  const t = document.createElement('div');
  t.id = 'hcp-toast';
  t.style.cssText = 'position:fixed;bottom:130px;left:50%;transform:translateX(-50%);background:rgba(28,28,28,0.95);color:#F2F2F2;border:0.5px solid rgba(200,169,106,0.2);padding:10px 20px;border-radius:100px;font-size:13px;font-weight:500;z-index:999;white-space:nowrap;';
  t.textContent = msg;
  document.body.appendChild(t);
  setTimeout(() => t.remove(), 2200);
}

const soundToggle = document.getElementById('sound-toggle');
soundToggle.checked = localStorage.getItem('golf-sound-enabled') !== 'false';
loadHandicap(); // default: on
function toggleSound(enabled) {
  localStorage.setItem('golf-sound-enabled', enabled ? 'true' : 'false');
}

async function doSignIn() {
  const email    = document.getElementById('auth-email-input').value.trim();
  const password = document.getElementById('auth-pass-input').value;
  const errEl    = document.getElementById('auth-error');
  errEl.textContent = '';
  if (!email || !password) { errEl.textContent = 'Enter your email and password.'; return; }
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  if (error) { errEl.textContent = error.message; return; }
  setAuthUI(data.session);
}

async function doSignOut() {
  await sb.auth.signOut();
  setAuthUI(null);
}


</script>

<script>
// ── Continue round ────────────────────────────────────────────────────────────
(function() {
  var scores = JSON.parse(localStorage.getItem('golf-scores-v1') || '{}');
  var hole   = localStorage.getItem('golf-current-hole');
  if (Object.keys(scores).length > 0 || (hole && parseInt(hole) > 1)) {
    var el = document.getElementById('nav-play');
    if (el) el.setAttribute('href', 'round.html');
  }
})();
</script>
</body>
</html>
