<!DOCTYPE html>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  /* ── Page-specific aliases + layout vars. Core theme colors (--bg, --gold,
     etc.) now come from theme.css, loaded in <head>. ── */
  :root {
    --bg-primary:      var(--bg);
    --bg-card:         var(--surface);
    --border:          color-mix(in srgb, var(--gold) 15%, transparent);
  }
  :root {
    --radius:       14px; --radius-sm: 9px;
    --safe-top:     env(safe-area-inset-top, 0px);
    --safe-bottom:  env(safe-area-inset-bottom, 0px);
  }

  html, body { height: 100%; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg-primary); overflow: hidden; }

  .app { position: relative; width: 100%; height: 100%; max-width: 430px; margin: 0 auto; overflow: hidden; display: flex; flex-direction: column; }


  /* ── Header ── */
  .header { position: absolute; top: 0; left: 0; right: 0; padding: calc(var(--safe-top) + 20px) 24px 16px; display: flex; align-items: center; gap: 16px; border-bottom: 0.5px solid color-mix(in srgb, var(--gold) 20%, transparent); z-index: 20; }
  .header-img-wrap { position: relative; z-index: 10; width: 100%; flex-shrink: 0; }
  .header-img { width: 100%; height: auto; display: block; }
  .header-title { font-size: 13px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-muted); flex: 1; }

  /* ── Scrollable content ── */
  .content { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px 16px calc(var(--safe-bottom) + 110px); z-index: 10; position: relative; background: var(--bg); }

  /* ── Search card ── */
  .search-card { background: color-mix(in srgb, var(--surface) 90%, transparent); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; backdrop-filter: blur(8px); }
  .search-card-title { font-size: 10px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold-muted); margin-bottom: 12px; }

  /* ── Mode toggle ── */
  .mode-toggle { display: flex; gap: 6px; margin-bottom: 14px; }
  .mode-btn { flex: 1; padding: 10px 6px; font-size: 13px; font-weight: 500; border-radius: var(--radius-sm); border: 0.5px solid color-mix(in srgb, var(--gold) 20%, transparent); background: color-mix(in srgb, var(--bg) 60%, transparent); color: var(--text-muted); cursor: pointer; text-align: center; transition: background 0.12s; font-family: inherit; }
  .mode-btn.active { background: color-mix(in srgb, var(--gold) 12%, transparent); color: var(--gold); border-color: var(--gold); }

  /* ── Location input ── */
  .location-row { display: flex; gap: 8px; margin-bottom: 14px; }
  .location-input { flex: 1; border: 0.5px solid color-mix(in srgb, var(--gold) 20%, transparent); border-radius: var(--radius-sm); padding: 12px 14px; font-size: 15px; color: var(--text-primary); background: color-mix(in srgb, var(--bg) 70%, transparent); outline: none; font-family: inherit; }
  .location-input:focus { border-color: var(--gold); }
  .location-input::placeholder { color: var(--text-muted); }
  .location-go-btn { background: var(--btn-primary); color: var(--on-btn-primary); border: none; border-radius: var(--radius-sm); padding: 12px 16px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; font-family: inherit; }

  /* ── GPS status ── */
  .gps-status-row { display: flex; align-items: center; gap: 8px; padding: 13px 14px; background: color-mix(in srgb, var(--gold) 8%, transparent); border: 0.5px solid color-mix(in srgb, var(--gold) 20%, transparent); border-radius: var(--radius-sm); margin-bottom: 10px; }
  .gps-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); flex-shrink: 0; }
  .gps-dot.pulse { animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.5;transform:scale(1.4)} }
  .gps-retry-btn { width: 100%; padding: 11px; background: color-mix(in srgb, var(--bg) 60%, transparent); border: 0.5px solid var(--border); border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; color: var(--text-muted); cursor: pointer; margin-bottom: 14px; font-family: inherit; }

  /* ── Radius selector ── */
  .radius-label { font-size: 11px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; }
  .radius-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 14px; }
  .radius-btn { padding: 10px 4px; font-size: 13px; font-weight: 500; border-radius: var(--radius-sm); border: 0.5px solid color-mix(in srgb, var(--gold) 20%, transparent); background: color-mix(in srgb, var(--bg) 60%, transparent); color: var(--text-muted); cursor: pointer; text-align: center; font-family: inherit; }
  .radius-btn.active { background: color-mix(in srgb, var(--gold) 12%, transparent); color: var(--gold); border-color: var(--gold); }

  /* ── Filter row ── */
  .filter-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
  .filter-btn { padding: 7px 11px; font-size: 12px; font-weight: 500; border-radius: 20px; border: 0.5px solid color-mix(in srgb, var(--gold) 20%, transparent); background: color-mix(in srgb, var(--bg) 60%, transparent); color: var(--text-muted); cursor: pointer; font-family: inherit; }
  .filter-btn.active { background: color-mix(in srgb, var(--gold) 12%, transparent); color: var(--gold); border-color: var(--gold); }

  /* ── Search button ── */
  .btn-search { width: 100%; padding: 15px; background: var(--btn-primary); color: var(--on-btn-primary); border: none; border-radius: var(--radius); font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 14px; font-family: inherit; letter-spacing: 0.04em; }
  .btn-search:active { opacity: 0.85; }
  .btn-search:disabled { opacity: 0.35; cursor: default; }

  /* ── Status bar ── */
  .status-bar { font-size: 13px; color: var(--text-muted); text-align: center; padding: 8px 0; min-height: 36px; }

  /* ── Results ── */
  .results-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .results-count { font-size: 11px; font-weight: 500; color: var(--gold-muted); text-transform: uppercase; letter-spacing: 0.1em; }

  .course-card { background: color-mix(in srgb, var(--surface) 90%, transparent); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px; cursor: pointer; backdrop-filter: blur(8px); }
  .course-card:active { background: color-mix(in srgb, var(--gold) 6%, transparent); }
  .course-top { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
  .course-dist-badge { background: color-mix(in srgb, var(--gold) 15%, transparent); color: var(--gold); border: 0.5px solid color-mix(in srgb, var(--gold) 30%, transparent); font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 20px; white-space: nowrap; flex-shrink: 0; }
  .course-name { font-size: 15px; font-weight: 500; color: var(--text-primary); flex: 1; line-height: 1.3; }
  .course-suburb-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .course-suburb { font-size: 13px; color: var(--text-muted); flex: 1; min-width: 0; }
  .course-meta { display: flex; flex-wrap: wrap; gap: 6px; }
  .course-tag { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 20px; border: 0.5px solid color-mix(in srgb, var(--gold) 20%, transparent); white-space: nowrap; }
  .tag-public    { background: rgba(117,139,105,0.15); color: #9ab88a; border-color: rgba(117,139,105,0.3); }
  .tag-semi      { background: rgba(100,120,200,0.12); color: #8a9fd4; border-color: rgba(100,120,200,0.25); }
  .tag-members   { background: color-mix(in srgb, var(--gold) 10%, transparent); color: var(--gold); border-color: color-mix(in srgb, var(--gold) 25%, transparent); }
  .tag-resort    { background: rgba(180,100,160,0.1); color: #c88ab0; border-color: rgba(180,100,160,0.25); }
  .tag-private   { background: rgba(142,75,75,0.12); color: #c08080; border-color: rgba(142,75,75,0.25); }
  .tag-neutral   { background: color-mix(in srgb, var(--gold) 12%, transparent); color: var(--gold); border-color: color-mix(in srgb, var(--gold) 25%, transparent); font-weight: 700; }
  .course-notes  { font-size: 12px; color: var(--text-muted); margin-top: 8px; line-height: 1.4; }

  /* ── Empty state ── */
  .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 14px; line-height: 1.6; }
  .empty-icon { font-size: 40px; margin-bottom: 10px; display: block; }

  /* ── Section divider ── */
  .section-divider { font-size: 10px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold-muted); padding: 6px 0 8px; border-bottom: 0.5px solid color-mix(in srgb, var(--gold) 12%, transparent); margin-bottom: 10px; }

  /* ── Nav — identical to index.html ── */
  .nav-shell { position: absolute; bottom: 0; left: 0; right: 0; z-index: 100; }
  .nav-row { display: flex; background: color-mix(in srgb, var(--bg) 92%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  .nav-primary { border-top: 0.5px solid color-mix(in srgb, var(--gold) 20%, transparent); padding-bottom: calc(var(--safe-bottom) + 6px); transform: translateY(0); transition: transform 350ms cubic-bezier(0.4,0,0.2,1); will-change: transform; position: relative; z-index: 2; }
  .nav-primary.raised { transform: translateY(-100%); }
  .nav-secondary { border-top: 0.5px solid color-mix(in srgb, var(--gold) 12%, transparent); padding-bottom: calc(var(--safe-bottom) + 6px); position: absolute; bottom: 0; left: 0; right: 0; transform: translateY(100%); transition: transform 350ms cubic-bezier(0.4,0,0.2,1); will-change: transform; z-index: 1; }
  .nav-secondary.open { transform: translateY(0); }
  .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px 4px 6px; cursor: pointer; text-decoration: none; background: none; border: none; -webkit-tap-highlight-color: transparent; transition: opacity 0.15s; }
  .nav-item:active { opacity: 0.7; }
  .nav-item img { width: 56px; height: 56px; object-fit: contain; display: block; }
  .nav-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.5); opacity: 0; pointer-events: none; transition: opacity 350ms ease; z-index: 90; }
  .nav-overlay.open { opacity: 1; pointer-events: auto; }
  /* Auth badge */
  .header-auth-badge { position: absolute; top: 10px; right: 14px; display: none; align-items: center; gap: 6px; background: rgba(13,13,13,0.6); backdrop-filter: blur(6px); border: 0.5px solid color-mix(in srgb, var(--gold) 20%, transparent); border-radius: 20px; padding: 5px 10px 5px 8px; z-index: 20; }
  .header-auth-badge.visible { display: flex; }
  .header-auth-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--success); flex-shrink: 0; }
  .header-auth-email { font-size: 11px; font-weight: 500; color: var(--gold); white-space: nowrap; }

  /* Home button — top right, below auth badge */
    .home-btn { position: absolute; top: 0; left: 0; width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; z-index: 60; text-decoration: none; cursor: pointer; }
  .home-btn img { width: 44px; height: 44px; object-fit: contain; display: block; }
  .home-btn:active { opacity: 0.7; }

  /* ── Course detail view ── */
  .course-detail-view { position: absolute; inset: 0; background: var(--bg-primary); z-index: 200; display: none; flex-direction: column; }
  .course-detail-view.open { display: flex; }
  .course-detail-header { display: flex; align-items: center; gap: 12px; padding: calc(var(--safe-top) + 16px) 16px 14px; border-bottom: 0.5px solid color-mix(in srgb, var(--gold) 15%, transparent); flex-shrink: 0; }
  .course-detail-back { width: 36px; height: 36px; border-radius: 10px; border: 0.5px solid color-mix(in srgb, var(--gold) 30%, transparent); background: color-mix(in srgb, var(--bg) 60%, transparent); color: var(--gold); font-size: 18px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; }
  .course-detail-back:active { opacity: 0.7; }
  .course-detail-title { font-size: 16px; font-weight: 600; color: var(--text-primary); flex: 1; line-height: 1.3; }
  .course-detail-content { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px 16px calc(var(--safe-bottom) + 40px); }

  /* Same card/table language as round.html's Scorecard tab */
  .score-table-wrap { background: color-mix(in srgb, var(--surface) 85%, transparent); border: 0.5px solid var(--border); border-radius: var(--radius); overflow: hidden; margin-bottom: 14px; }
  .score-table { width: 100%; border-collapse: collapse; font-size: 16px; }
  .score-table th { background: color-mix(in srgb, var(--gold) 12%, transparent); color: var(--gold); padding: 11px 6px; text-align: center; font-weight: 500; letter-spacing: 0.06em; font-size: 14px; }
  .score-table td { padding: 12px 6px; text-align: center; border-bottom: 0.5px solid var(--border); }
  .score-table tr:last-child td { border-bottom: none; }
  .sc-input { width: 48px; background: color-mix(in srgb, var(--bg) 70%, transparent); border: 0.5px solid color-mix(in srgb, var(--gold) 30%, transparent); border-radius: 6px; padding: 4px 6px; font-size: 15px; font-weight: 500; color: var(--gold); text-align: center; font-family: inherit; -moz-appearance: textfield; }
  .sc-input::-webkit-outer-spin-button, .sc-input::-webkit-inner-spin-button { -webkit-appearance: none; }
  .sc-input:focus { outline: none; border-color: var(--gold); }

  .cd-info-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 16px; font-size: 14px; border-bottom: 0.5px solid var(--border); }
  .cd-info-row:last-child { border-bottom: none; }
  .cd-info-label { color: var(--text-muted); }
  .cd-info-value { color: var(--text-primary); font-weight: 500; text-align: right; }

  .cd-save-btn { width: 100%; padding: 15px; background: var(--btn-primary); color: var(--on-btn-primary); border: none; border-radius: var(--radius); font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 10px; font-family: inherit; letter-spacing: 0.04em; }
  .cd-save-btn:active { opacity: 0.85; }
  .cd-save-btn:disabled { opacity: 0.4; cursor: default; }
  .cd-status { text-align: center; font-size: 13px; color: var(--text-muted); padding: 10px 0 0; min-height: 20px; }
</style>

<div class="app">
<a class="home-btn" href="index.html"><img src="icons/Home.png" alt="Home"></a>

<script>
let searchLat = null, searchLng = null, searchLabel = '';
let selectedRadius = 25;
let selectedAccess = 'all';
let mode = 'gps';
let currentResults = [];
let currentDetailCourseId = null;
let currentDetailCourseName = null;
let currentDetailCourseFallback = null;

// ── Set content top dynamically after header renders ──────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  const h = document.getElementById('main-header').offsetHeight;
  document.getElementById('main-content').style.top = h + 'px';
});

// ── Mode ──────────────────────────────────────────────────────────────────────
function setMode(m) {
  mode = m;
  document.getElementById('mode-gps').classList.toggle('active', m==='gps');
  document.getElementById('mode-town').classList.toggle('active', m==='town');
  document.getElementById('gps-section').style.display = m==='gps' ? 'block' : 'none';
  document.getElementById('town-section').style.display = m==='town' ? 'block' : 'none';
  if (m === 'gps') {
    if (searchLat !== null && searchLabel === 'your location') {
      document.getElementById('search-btn').disabled = false;
    } else {
      document.getElementById('search-btn').disabled = true;
      getMyLocation();
    }
  } else {
    searchLat = null; searchLng = null;
    document.getElementById('search-btn').disabled = true;
  }
}

// ── Radius ────────────────────────────────────────────────────────────────────
function setRadius(r, btn) {
  selectedRadius = r;
  document.querySelectorAll('.radius-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

// ── Filter ────────────────────────────────────────────────────────────────────
function toggleFilter(btn, val) {
  selectedAccess = val;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

// ── GPS location ─────────────────────────────────────────────────────────────
function getMyLocation() {
  const dot = document.getElementById('gps-dot');
  const retryBtn = document.getElementById('gps-retry-btn');
  retryBtn.style.display = 'none';
  if (!navigator.geolocation) {
    dot.style.display = 'none';
    setGPSStatus('GPS not available on this device');
    return;
  }
  dot.style.display = 'block';
  dot.classList.add('pulse');
  setGPSStatus('Locating you…');
  navigator.geolocation.getCurrentPosition(pos => {
    searchLat = pos.coords.latitude;
    searchLng = pos.coords.longitude;
    searchLabel = 'your location';
    dot.classList.remove('pulse');
    setGPSStatus('✓ Location found'); document.getElementById('gps-status').style.color = 'var(--gold)';
    if (mode === 'gps') document.getElementById('search-btn').disabled = false;
  }, err => {
    dot.style.display = 'none';
    setGPSStatusHTML('⚠ Could not get location<br>&nbsp;&nbsp;&nbsp;check location permissions in Settings'); document.getElementById('gps-status').style.color = 'var(--gold)';
    retryBtn.style.display = 'block';
  }, {enableHighAccuracy: true, timeout: 12000});
}

function setGPSStatus(msg) { document.getElementById('gps-status').textContent = msg; }
function setGPSStatusHTML(msg) { document.getElementById('gps-status').innerHTML = msg; }

// Kick off GPS lookup immediately on page load
getMyLocation();

// ── Town search ───────────────────────────────────────────────────────────────
function searchByTown() {
  const val = document.getElementById('town-input').value.trim();
  if (!val) { document.getElementById('town-status').textContent = 'Please enter a town or suburb'; return; }
  document.getElementById('town-status').textContent = 'Looking up ' + val + '…';
  const match = findSuburbCoords(val);
  if (match) {
    searchLat = match.lat; searchLng = match.lng; searchLabel = val;
    document.getElementById('town-status').textContent = '✓ Found ' + val;
    document.getElementById('search-btn').disabled = false;
    doSearch();
    return;
  }
  const url = 'https://nominatim.openstreetmap.org/search?q=' + encodeURIComponent(val + ', Victoria, Australia') + '&format=json&limit=1';
  fetch(url, {headers: {'Accept-Language': 'en', 'User-Agent': 'GolfTrackerApp/1.0'}})
    .then(r => r.json())
    .then(data => {
      if (data && data.length > 0) {
        searchLat = parseFloat(data[0].lat);
        searchLng = parseFloat(data[0].lon);
        searchLabel = val;
        document.getElementById('town-status').textContent = '✓ Found: ' + data[0].display_name.split(',')[0];
        document.getElementById('search-btn').disabled = false;
        doSearch();
      } else {
        document.getElementById('town-status').textContent = 'Could not find "' + val + '" — try a nearby larger town';
      }
    })
    .catch(() => {
      document.getElementById('town-status').textContent = 'Search unavailable offline — try a suburb from the course list';
    });
}

function findSuburbCoords(query) {
  const q = query.toLowerCase().trim();
  const found = COURSES.find(c => c.suburb.toLowerCase() === q);
  if (found) return {lat: found.lat, lng: found.lng};
  const partial = COURSES.find(c => c.suburb.toLowerCase().includes(q) || q.includes(c.suburb.toLowerCase()));
  if (partial) return {lat: partial.lat, lng: partial.lng};
  return null;
}

document.getElementById('town-input').addEventListener('keydown', e => { if (e.key==='Enter') searchByTown(); });

// ── Haversine distance ────────────────────────────────────────────────────────
function distKm(lat1, lng1, lat2, lng2) {
  const R = 6371;
  const dLat = (lat2-lat1)*Math.PI/180, dLng = (lng2-lng1)*Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R * 2 * Math.asin(Math.sqrt(a));
}

// ── Search ────────────────────────────────────────────────────────────────────
function doSearch() {
  if (searchLat===null) { return; }
  const area = document.getElementById('results-area');
  let results = COURSES.map(c => ({...c, distKm: distKm(searchLat, searchLng, c.lat, c.lng)})).filter(c => c.distKm <= selectedRadius);
  if (selectedAccess !== 'all') results = results.filter(c => c.access === selectedAccess);
  results.sort((a,b) => a.distKm - b.distKm);
  currentResults = results;
  if (results.length === 0) {
    area.innerHTML = '<div class="empty-state"><span class="empty-icon">🔍</span>No courses found within ' + selectedRadius + 'km of ' + searchLabel + '.<br><br>Try increasing the distance radius.</div>';
    return;
  }
  const accessOrder = ['Public', 'Resort / Public', 'Semi-Private', 'Members – Visitors Welcome', 'Private'];
  const grouped = selectedAccess === 'all';
  let html = '<div class="results-header"><div class="results-count">' + results.length + ' course' + (results.length===1?'':'s') + ' found</div><div style="font-size:12px;color:var(--text-muted)">within ' + selectedRadius + 'km</div></div>';
  if (grouped) {
    accessOrder.forEach(type => {
      const group = results.filter(c => c.access === type);
      if (group.length === 0) return;
      html += '<div class="section-divider">' + type + ' (' + group.length + ')</div>';
      html += group.map(c => courseCard(c)).join('');
    });
    const other = results.filter(c => !accessOrder.includes(c.access));
    if (other.length) { html += '<div class="section-divider">Other (' + other.length + ')</div>'; html += other.map(c => courseCard(c)).join(''); }
  } else {
    html += results.map(c => courseCard(c)).join('');
  }
  area.innerHTML = html;
}

// ── Course card ───────────────────────────────────────────────────────────────
function courseCard(c) {
  const dist = c.distKm < 1 ? Math.round(c.distKm*1000)+'m' : Math.round(c.distKm)+'km';
  const tagClass = {'Public':'tag-public','Semi-Private':'tag-semi','Members – Visitors Welcome':'tag-members','Resort / Public':'tag-resort','Private':'tag-private'}[c.access] || 'tag-neutral';
  const fee = c.holes === 9 ? (c.fee9 && c.fee9 !== 'N/A' ? c.fee9 : null) : (c.fee18 && c.fee18 !== 'N/A' && !c.fee18.includes('Private') ? c.fee18 : null);
  const idx = currentResults.indexOf(c);
  return '<div class="course-card" onclick="openCourseDetail(' + idx + ')">' +
    '<div class="course-top"><div class="course-dist-badge">' + dist + '</div><div class="course-name">' + c.name + '</div></div>' +
    '<div class="course-suburb-row"><div class="course-suburb">' + c.suburb + '</div><span class="course-tag ' + tagClass + '">' + c.access + '</span></div>' +
    '<div class="course-meta"><span class="course-tag tag-neutral">' + c.holes + ' holes</span><span class="course-tag tag-neutral">Par ' + c.par + '</span>' + (fee ? '<span class="course-tag tag-neutral">' + fee + '</span>' : '') + '</div>' +
    (c.notes ? '<div class="course-notes">' + c.notes + '</div>' : '') +
    '</div>';
}

function toggleCard(card) { card.classList.toggle('expanded'); }

// ── Course Detail View ──────────────────────────────────────────────────────
async function openCourseDetail(idx) {
  const c = currentResults[idx];
  if (!c) return;
  document.getElementById('cd-title').textContent = c.name;
  document.getElementById('cd-content').innerHTML = '<div class="cd-status">Loading course data\u2026</div>';
  document.getElementById('course-detail-view').classList.add('open');

  let sbCourse = null, sbHoles = [];
  try {
    const { data: courses } = await sb.from('courses').select('*').ilike('name', c.name).limit(1);
    if (courses && courses.length) {
      sbCourse = courses[0];
      const { data: holes } = await sb.from('course_holes').select('hole, par, stroke_index').eq('course_id', sbCourse.id).order('hole');
      sbHoles = holes || [];
    }
  } catch(e) { console.error('Course detail load error:', e); }

  currentDetailCourseId = sbCourse ? sbCourse.id : null;
  currentDetailCourseName = c.name;
  currentDetailCourseFallback = c;

  renderCourseDetail(c, sbCourse, sbHoles);
}

function renderCourseDetail(c, sbCourse, sbHoles) {
  const access = (sbCourse && sbCourse.access_type) || c.access || '\u2014';
  const phone  = (sbCourse && sbCourse.phone) || null;
  const slope  = (sbCourse && sbCourse.slope) || '';
  const holeMap = {};
  sbHoles.forEach(h => { holeMap[h.hole] = h; });

  let html = '<div class="score-table-wrap">';
  html += '<div class="cd-info-row"><span class="cd-info-label">Access</span><span class="cd-info-value">' + access + '</span></div>';
  html += '<div class="cd-info-row"><span class="cd-info-label">Phone</span><span class="cd-info-value">' + (phone || 'Not available') + '</span></div>';
  html += '<div class="cd-info-row"><span class="cd-info-label">Slope Rating</span><span class="cd-info-value"><input class="sc-input" id="cd-slope" type="number" min="55" max="155" inputmode="numeric" value="' + slope + '" placeholder="113"></span></div>';
  html += '</div>';

  html += '<div class="score-table-wrap"><table class="score-table">';
  html += '<thead><tr><th>Hole</th><th>Par</th><th>Stroke Index</th></tr></thead><tbody>';
  for (let h = 1; h <= 18; h++) {
    const par = holeMap[h] && holeMap[h].par ? holeMap[h].par : '';
    const si  = holeMap[h] && holeMap[h].stroke_index ? holeMap[h].stroke_index : '';
    html += '<tr><td>' + h + '</td>' +
      '<td><input class="sc-input" id="cd-par-' + h + '" type="number" min="3" max="5" inputmode="numeric" value="' + par + '"></td>' +
      '<td><input class="sc-input" id="cd-si-' + h + '" type="number" min="1" max="18" inputmode="numeric" value="' + si + '"></td></tr>';
  }
  html += '</tbody></table></div>';

  html += '<button class="cd-save-btn" id="cd-save-btn" onclick="saveCourseDetail()">Save Course Data</button>';
  html += '<div class="cd-status" id="cd-status"></div>';

  document.getElementById('cd-content').innerHTML = html;
}

function closeCourseDetail() {
  document.getElementById('course-detail-view').classList.remove('open');
}

async function saveCourseDetail() {
  const btn = document.getElementById('cd-save-btn');
  const status = document.getElementById('cd-status');

  if (!currentUser) { status.textContent = 'Sign in to save course data'; status.style.color = 'var(--warning)'; return; }

  btn.disabled = true;
  status.style.color = 'var(--text-muted)';
  status.textContent = 'Saving\u2026';

  const slopeRaw = parseInt(document.getElementById('cd-slope').value);
  const slopeVal = isNaN(slopeRaw) ? null : slopeRaw;

  const holesData = [];
  for (let h = 1; h <= 18; h++) {
    const parVal = parseInt(document.getElementById('cd-par-'+h).value);
    const siVal  = parseInt(document.getElementById('cd-si-'+h).value);
    holesData.push({ hole: h, par: isNaN(parVal) ? null : parVal, stroke_index: isNaN(siVal) ? null : siVal });
  }

  try {
    let courseId = currentDetailCourseId;
    if (courseId) {
      const { error: updErr } = await sb.from('courses').update({ slope: slopeVal }).eq('id', courseId);
      if (updErr) throw updErr;
    } else {
      const fb = currentDetailCourseFallback || {};
      const { data: inserted, error: insErr } = await sb.from('courses').insert({
        name:      currentDetailCourseName,
        suburb:    fb.suburb || null,
        access_type: fb.access || null,
        latitude:  fb.lat != null ? fb.lat : null,
        longitude: fb.lng != null ? fb.lng : null,
        slope:     slopeVal
      }).select().single();
      if (insErr) throw insErr;
      courseId = inserted.id;
      currentDetailCourseId = courseId;
    }

    const rowsToSave = holesData.filter(h => h.par !== null || h.stroke_index !== null);
    if (rowsToSave.length) {
      const upsertRows = rowsToSave.map(h => ({ course_id: courseId, hole: h.hole, par: h.par, stroke_index: h.stroke_index }));
      const { error: holesErr } = await sb.from('course_holes').upsert(upsertRows, { onConflict: 'course_id,hole' });
      if (holesErr) throw holesErr;
    }

    status.style.color = 'var(--gold)';
    status.textContent = '\u2713 Saved';
  } catch(e) {
    console.error('Course detail save error:', e);
    status.style.color = 'var(--warning)';
    status.textContent = 'Save failed \u2014 check par (3\u20135) and stroke index (1\u201318) values';
  } finally {
    btn.disabled = false;
  }
}

document.addEventListener('keydown', e => { if (e.key==='Enter' && searchLat!==null) doSearch(); });
