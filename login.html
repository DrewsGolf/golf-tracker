<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0D0D0D">
<link rel="manifest" href="manifest.json">
<title>Shot Tracker — Sign In</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --gold: #C8A96A; --gold-muted: #9A7C47;
    --text-primary: #F2F2F2; --text-secondary: #BDBDBD; --text-muted: #9A9A9A;
    --bg: #0D0D0D; --card: rgba(28,28,28,0.92); --border: rgba(200,169,106,0.15);
    --radius: 14px; --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  html, body { height: 100%; font-family: 'Inter', -apple-system, sans-serif; background: var(--bg); color: var(--text-primary); overflow: hidden; }
  .app { position: relative; width: 100%; height: 100%; max-width: 430px; margin: 0 auto; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; }
  .hero { position: fixed; inset: 0; z-index: 0; }
  .hero img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .hero-overlay { position: absolute; inset: 0; background: rgba(13,13,13,0.88); }
  .login-card { position: relative; z-index: 5; width: 100%; background: var(--card); border: 0.5px solid var(--border); border-radius: var(--radius); backdrop-filter: blur(12px); padding: 32px 24px 28px; }
  .logo-wrap { text-align: center; margin-bottom: 28px; }
  .logo-wrap img { width: 180px; height: auto; }
  .field-label { font-size: 11px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 6px; display: block; }
  .field { width: 100%; background: rgba(13,13,13,0.7); border: 0.5px solid rgba(200,169,106,0.3); border-radius: 9px; padding: 13px 14px; font-size: 16px; color: var(--text-primary); font-family: inherit; margin-bottom: 14px; -webkit-appearance: none; }
  .field:focus { outline: none; border-color: var(--gold); }
  .btn-login { width: 100%; background: var(--gold); color: #0D0D0D; border: none; border-radius: var(--radius); padding: 15px; font-size: 16px; font-weight: 600; cursor: pointer; font-family: inherit; margin-top: 6px; }
  .btn-login:active { opacity: 0.85; }
  .btn-login:disabled { opacity: 0.45; cursor: default; }
  .error-msg { font-size: 13px; color: #e74c3c; text-align: center; margin-top: 12px; min-height: 18px; }
  .loading { display: none; text-align: center; color: var(--text-muted); font-size: 14px; margin-top: 12px; }
</style>
</head>
<body>
<div class="hero">
  <img src="Back_ground_New.jpg" alt="">
  <div class="hero-overlay"></div>
</div>
<div class="app">
  <div class="login-card">
    <div class="logo-wrap">
      <img src="Logo_1.png" alt="Shot Tracker">
    </div>
    <label class="field-label">Email</label>
    <input class="field" type="email" id="email" placeholder="your@email.com" autocomplete="email" inputmode="email">
    <label class="field-label">Password</label>
    <input class="field" type="password" id="password" placeholder="••••••••" autocomplete="current-password">
    <button class="btn-login" id="btn-login" onclick="signIn()">Sign In</button>
    <div class="error-msg" id="error-msg"></div>
    <div class="loading" id="loading">Signing in…</div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://ryqehsqqriavmuqfnzpx.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ5cWVoc3Fxcmlhdm11cWZuenB4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM3NTQ4MzcsImV4cCI6MjA5OTMzMDgzN30.Po2m7uhlMTc43Pdg8pohwvDsQ_UDFRS-n9UnTQ44nXA';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

// If already logged in, go straight to app
sb.auth.getSession().then(({ data }) => {
  if (data.session) window.location.href = 'index.html';
});

async function signIn() {
  const email    = document.getElementById('email').value.trim();
  const password = document.getElementById('password').value;
  const btn      = document.getElementById('btn-login');
  const err      = document.getElementById('error-msg');
  const loading  = document.getElementById('loading');

  err.textContent = '';
  if (!email || !password) { err.textContent = 'Please enter your email and password.'; return; }

  btn.disabled = true;
  loading.style.display = 'block';

  const { error } = await sb.auth.signInWithPassword({ email, password });

  loading.style.display = 'none';
  btn.disabled = false;

  if (error) { err.textContent = error.message; return; }
  window.location.href = 'index.html';
}

// Allow Enter key to submit
document.addEventListener('keydown', e => { if (e.key === 'Enter') signIn(); });
</script>
</body>
</html>
