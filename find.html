<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0D0D0D">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.svg">
<title>Find a Course — Shot Tracker</title>
<script src="courses.js"></script>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }

  :root {
    --bg-primary:   #0D0D0D;
    --bg-card:      #1C1C1C;
    --gold:         #C8A96A;
    --gold-muted:   #9A7C47;
    --text-primary: #F2F2F2;
    --text-secondary: #BDBDBD;
    --text-muted:   #9A9A9A;
    --border:       rgba(200,169,106,0.15);
    --radius:       14px; --radius-sm: 9px;
    --safe-top:     env(safe-area-inset-top, 0px);
    --safe-bottom:  env(safe-area-inset-bottom, 0px);
  }

  html, body { height: 100%; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg-primary); overflow: hidden; }

  .app { position: relative; width: 100%; height: 100%; max-width: 430px; margin: 0 auto; overflow: hidden; }

  /* ── Background ── */
  .hero { position: absolute; inset: 0; width: 100%; height: 100%; }
  .hero-img { width: 100%; height: 100%; object-fit: cover; object-position: center; display: block; }
  .hero-overlay { position: absolute; inset: 0; background: rgba(13,13,13,0.88); }

  /* ── Header ── */
  .header { position: absolute; top: 0; left: 0; right: 0; padding: calc(var(--safe-top) + 20px) 24px 16px; display: flex; align-items: center; gap: 16px; border-bottom: 0.5px solid rgba(200,169,106,0.2); z-index: 20; }
  .header-img-wrap { position: relative; z-index: 10; width: 100%; flex-shrink: 0; }
  .header-img { width: 100%; height: auto; display: block; }
  .header-title { font-size: 13px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-muted); flex: 1; }

  /* ── Scrollable content ── */
  .content { position: absolute; left: 0; right: 0; bottom: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 16px 16px calc(var(--safe-bottom) + 110px); z-index: 10; }

  /* ── Search card ── */
  .search-card { background: rgba(28,28,28,0.9); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; backdrop-filter: blur(8px); }
  .search-card-title { font-size: 10px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--gold-muted); margin-bottom: 12px; }

  /* ── Mode toggle ── */
  .mode-toggle { display: flex; gap: 6px; margin-bottom: 14px; }
  .mode-btn { flex: 1; padding: 10px 6px; font-size: 13px; font-weight: 500; border-radius: var(--radius-sm); border: 0.5px solid rgba(200,169,106,0.2); background: rgba(13,13,13,0.6); color: var(--text-muted); cursor: pointer; text-align: center; transition: background 0.12s; font-family: inherit; }
  .mode-btn.active { background: rgba(200,169,106,0.12); color: var(--gold); border-color: var(--gold); }

  /* ── Location input ── */
  .location-row { display: flex; gap: 8px; margin-bottom: 14px; }
  .location-input { flex: 1; border: 0.5px solid rgba(200,169,106,0.2); border-radius: var(--radius-sm); padding: 12px 14px; font-size: 15px; color: var(--text-primary); background: rgba(13,13,13,0.7); outline: none; font-family: inherit; }
  .location-input:focus { border-color: var(--gold); }
  .location-input::placeholder { color: var(--text-muted); }
  .location-go-btn { background: var(--gold); color: #0D0D0D; border: none; border-radius: var(--radius-sm); padding: 12px 16px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; font-family: inherit; }

  /* ── GPS status ── */
  .gps-status-row { display: flex; align-items: center; gap: 8px; padding: 13px 14px; background: rgba(200,169,106,0.08); border: 0.5px solid rgba(200,169,106,0.2); border-radius: var(--radius-sm); margin-bottom: 10px; }
  .gps-dot { width: 8px; height: 8px; border-radius: 50%; background: var(--gold); flex-shrink: 0; }
  .gps-dot.pulse { animation: pulse 1.2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1;transform:scale(1)} 50%{opacity:0.5;transform:scale(1.4)} }
  .gps-retry-btn { width: 100%; padding: 11px; background: rgba(13,13,13,0.6); border: 0.5px solid var(--border); border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; color: var(--text-muted); cursor: pointer; margin-bottom: 14px; font-family: inherit; }

  /* ── Radius selector ── */
  .radius-label { font-size: 11px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 8px; }
  .radius-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 6px; margin-bottom: 14px; }
  .radius-btn { padding: 10px 4px; font-size: 13px; font-weight: 500; border-radius: var(--radius-sm); border: 0.5px solid rgba(200,169,106,0.2); background: rgba(13,13,13,0.6); color: var(--text-muted); cursor: pointer; text-align: center; font-family: inherit; }
  .radius-btn.active { background: rgba(200,169,106,0.12); color: var(--gold); border-color: var(--gold); }

  /* ── Filter row ── */
  .filter-row { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
  .filter-btn { padding: 7px 11px; font-size: 12px; font-weight: 500; border-radius: 20px; border: 0.5px solid rgba(200,169,106,0.2); background: rgba(13,13,13,0.6); color: var(--text-muted); cursor: pointer; font-family: inherit; }
  .filter-btn.active { background: rgba(200,169,106,0.12); color: var(--gold); border-color: var(--gold); }

  /* ── Search button ── */
  .btn-search { width: 100%; padding: 15px; background: var(--gold); color: #0D0D0D; border: none; border-radius: var(--radius); font-size: 15px; font-weight: 600; cursor: pointer; margin-top: 14px; font-family: inherit; letter-spacing: 0.04em; }
  .btn-search:active { opacity: 0.85; }
  .btn-search:disabled { opacity: 0.35; cursor: default; }

  /* ── Status bar ── */
  .status-bar { font-size: 13px; color: var(--text-muted); text-align: center; padding: 8px 0; min-height: 36px; }

  /* ── Results ── */
  .results-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .results-count { font-size: 11px; font-weight: 500; color: var(--gold-muted); text-transform: uppercase; letter-spacing: 0.1em; }

  .course-card { background: rgba(28,28,28,0.9); border: 0.5px solid var(--border); border-radius: var(--radius); padding: 14px 16px; margin-bottom: 10px; cursor: pointer; backdrop-filter: blur(8px); }
  .course-card:active { background: rgba(200,169,106,0.06); }
  .course-top { display: flex; align-items: flex-start; gap: 10px; margin-bottom: 8px; }
  .course-dist-badge { background: rgba(200,169,106,0.15); color: var(--gold); border: 0.5px solid rgba(200,169,106,0.3); font-size: 12px; font-weight: 600; padding: 4px 10px; border-radius: 20px; white-space: nowrap; flex-shrink: 0; }
  .course-name { font-size: 15px; font-weight: 500; color: var(--text-primary); flex: 1; line-height: 1.3; }
  .course-suburb-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .course-suburb { font-size: 13px; color: var(--text-muted); flex: 1; min-width: 0; }
  .course-meta { display: flex; flex-wrap: wrap; gap: 6px; }
  .course-tag { font-size: 11px; font-weight: 600; padding: 3px 9px; border-radius: 20px; border: 0.5px solid rgba(200,169,106,0.2); white-space: nowrap; }
  .tag-public    { background: rgba(117,139,105,0.15); color: #9ab88a; border-color: rgba(117,139,105,0.3); }
  .tag-semi      { background: rgba(100,120,200,0.12); color: #8a9fd4; border-color: rgba(100,120,200,0.25); }
  .tag-members   { background: rgba(200,169,106,0.1); color: var(--gold); border-color: rgba(200,169,106,0.25); }
  .tag-resort    { background: rgba(180,100,160,0.1); color: #c88ab0; border-color: rgba(180,100,160,0.25); }
  .tag-private   { background: rgba(142,75,75,0.12); color: #c08080; border-color: rgba(142,75,75,0.25); }
  .tag-neutral   { background: rgba(200,169,106,0.12); color: var(--gold); border-color: rgba(200,169,106,0.25); font-weight: 700; }
  .course-notes  { font-size: 12px; color: var(--text-muted); margin-top: 8px; line-height: 1.4; }

  /* ── Empty state ── */
  .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 14px; line-height: 1.6; }
  .empty-icon { font-size: 40px; margin-bottom: 10px; display: block; }

  /* ── Section divider ── */
  .section-divider { font-size: 10px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold-muted); padding: 6px 0 8px; border-bottom: 0.5px solid rgba(200,169,106,0.12); margin-bottom: 10px; }

  /* ── Nav — identical to index.html ── */
  .nav-shell { position: absolute; bottom: 0; left: 0; right: 0; z-index: 100; }
  .nav-row { display: flex; background: rgba(13,13,13,0.92); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  .nav-primary { border-top: 0.5px solid rgba(200,169,106,0.2); padding-bottom: calc(var(--safe-bottom) + 6px); transform: translateY(0); transition: transform 350ms cubic-bezier(0.4,0,0.2,1); will-change: transform; position: relative; z-index: 2; }
  .nav-primary.raised { transform: translateY(-100%); }
  .nav-secondary { border-top: 0.5px solid rgba(200,169,106,0.12); padding-bottom: calc(var(--safe-bottom) + 6px); position: absolute; bottom: 0; left: 0; right: 0; transform: translateY(100%); transition: transform 350ms cubic-bezier(0.4,0,0.2,1); will-change: transform; z-index: 1; }
  .nav-secondary.open { transform: translateY(0); }
  .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px 4px 6px; cursor: pointer; text-decoration: none; background: none; border: none; -webkit-tap-highlight-color: transparent; transition: opacity 0.15s; }
  .nav-item:active { opacity: 0.7; }
  .nav-item img { width: 70px; height: 70px; object-fit: contain; display: block; }
  .nav-overlay { position: absolute; inset: 0; background: rgba(0,0,0,0.5); opacity: 0; pointer-events: none; transition: opacity 350ms ease; z-index: 90; }
  .nav-overlay.open { opacity: 1; pointer-events: auto; }
  /* Auth badge */
  .header-auth-badge { position: absolute; top: 10px; right: 14px; display: none; align-items: center; gap: 6px; background: rgba(13,13,13,0.6); backdrop-filter: blur(6px); border: 0.5px solid rgba(200,169,106,0.2); border-radius: 20px; padding: 5px 10px 5px 8px; z-index: 20; }
  .header-auth-badge.visible { display: flex; }
  .header-auth-dot { width: 8px; height: 8px; border-radius: 50%; background: #2ecc71; flex-shrink: 0; }
  .header-auth-email { font-size: 11px; font-weight: 500; color: var(--gold); white-space: nowrap; }
</style>
</head>
<body>
<div class="app">

  <!-- Background -->
  <div class="hero">
    <img class="hero-img" src="Back_ground_New.jpg" alt="">
    <div class="hero-overlay"></div>
  </div>

  <!-- Header -->
  <div class="header-img-wrap" style="position:relative;">
    <img class="header-img" src="Header.webp" alt="Shot Tracker">
    <div class="header-auth-badge" id="header-badge">
      <div class="header-auth-dot"></div>
      <span class="header-auth-email" id="header-email"></span>
    </div>
  </div>

  <!-- Scrollable content -->
  <div class="content" id="main-content">
    <div class="search-card">
      <div class="search-card-title">Search by</div>

      <!-- Mode toggle -->
      <div class="mode-toggle">
        <button class="mode-btn active" id="mode-gps" onclick="setMode('gps')"><span style="color:var(--gold)">◉</span> My location</button>
        <button class="mode-btn" id="mode-town" onclick="setMode('town')"><span style="color:var(--gold)">◈</span> Town or suburb</button>
      </div>

      <!-- GPS mode -->
      <div id="gps-section">
        <div class="gps-status-row" id="gps-status-row">
          <span class="gps-dot pulse" id="gps-dot"></span>
          <span class="status-bar" id="gps-status" style="padding:0;text-align:left;min-height:auto;">Locating you…</span>
        </div>
        <button class="gps-retry-btn" id="gps-retry-btn" onclick="getMyLocation()" style="display:none;">&#8635; Try again</button>
      </div>

      <!-- Town mode -->
      <div id="town-section" style="display:none">
        <div class="location-row">
          <input class="location-input" type="text" id="town-input" placeholder="e.g. Geelong, Ballarat, Frankston…" autocomplete="off">
          <button class="location-go-btn" onclick="searchByTown()">Go</button>
        </div>
        <div class="status-bar" id="town-status"></div>
      </div>

      <!-- Radius -->
      <div class="radius-label">Distance radius</div>
      <div class="radius-grid">
        <button class="radius-btn active" onclick="setRadius(25,this)">25 km</button>
        <button class="radius-btn" onclick="setRadius(50,this)">50 km</button>
        <button class="radius-btn" onclick="setRadius(100,this)">100 km</button>
        <button class="radius-btn" onclick="setRadius(200,this)">200 km</button>
      </div>

      <!-- Access type filter -->
      <div class="radius-label">Access type</div>
      <div class="filter-row">
        <button class="filter-btn active" onclick="toggleFilter(this,'all')">All</button>
        <button class="filter-btn" onclick="toggleFilter(this,'Public')">Public</button>
        <button class="filter-btn" onclick="toggleFilter(this,'Semi-Private')">Semi-Private</button>
        <button class="filter-btn" onclick="toggleFilter(this,'Members – Visitors Welcome')">Members</button>
        <button class="filter-btn" onclick="toggleFilter(this,'Resort / Public')">Resort</button>
      </div>

      <button class="btn-search" id="search-btn" onclick="doSearch()" disabled>Search</button>
    </div>

    <!-- Results -->
    <div id="results-area"></div>
  </div>

  <!-- Overlay -->
  <div class="nav-overlay" id="nav-overlay" onclick="closeDrawer()"></div>

  <!-- Nav shell -->
  <div class="nav-shell">
    <div class="nav-row nav-primary" id="nav-primary">
      <a class="nav-item" href="index.html"><img src="Home_2.png" alt="Home"></a>
      <a class="nav-item" href="start.html"><img src="Play_2.png" alt="Play"></a>
      <a class="nav-item" href="clubs.html"><img src="Clubs_2.png" alt="Distance"></a>
      <button class="nav-item" id="btn-more" onclick="openDrawer()"><img src="More.png" alt="More" id="icon-more"></button>
    </div>
    <div class="nav-row nav-secondary" id="nav-secondary">
      <a class="nav-item" href="range.html"><img src="Range_2.png" alt="Driving Range"></a>
      <a class="nav-item" href="find.html"><img src="Courses_2.png" alt="Courses"></a>
      <a class="nav-item" href="suggest.html"><img src="Suggets_2.png" alt="Suggest"></a>
      <button class="nav-item" onclick="closeDrawer()"><img src="Back.png" alt="Back"></button>
    </div>
  </div>

</div>

<script>
let searchLat = null, searchLng = null, searchLabel = '';
let selectedRadius = 25;
let selectedAccess = 'all';
let mode = 'gps';

// ── Set content top dynamically after header renders ──────────────────────────
window.addEventListener('DOMContentLoaded', () => {
  const h = document.getElementById('main-header').offsetHeight;
  document.getElementById('main-content').style.top = h + 'px';
});

// ── Mode ──────────────────────────────────────────────────────────────────────
function setMode(m) {
  mode = m;
  document.getElementById('mode-gps').classList.toggle('active', m==='gps');
  document.getElementById('mode-town').classList.toggle('active', m==='town');
  document.getElementById('gps-section').style.display = m==='gps' ? 'block' : 'none';
  document.getElementById('town-section').style.display = m==='town' ? 'block' : 'none';
  if (m === 'gps') {
    if (searchLat !== null && searchLabel === 'your location') {
      document.getElementById('search-btn').disabled = false;
    } else {
      document.getElementById('search-btn').disabled = true;
      getMyLocation();
    }
  } else {
    searchLat = null; searchLng = null;
    document.getElementById('search-btn').disabled = true;
  }
}

// ── Radius ────────────────────────────────────────────────────────────────────
function setRadius(r, btn) {
  selectedRadius = r;
  document.querySelectorAll('.radius-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

// ── Filter ────────────────────────────────────────────────────────────────────
function toggleFilter(btn, val) {
  selectedAccess = val;
  document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
  btn.classList.add('active');
}

// ── GPS location ─────────────────────────────────────────────────────────────
function getMyLocation() {
  const dot = document.getElementById('gps-dot');
  const retryBtn = document.getElementById('gps-retry-btn');
  retryBtn.style.display = 'none';
  if (!navigator.geolocation) {
    dot.style.display = 'none';
    setGPSStatus('GPS not available on this device');
    return;
  }
  dot.style.display = 'block';
  dot.classList.add('pulse');
  setGPSStatus('Locating you…');
  navigator.geolocation.getCurrentPosition(pos => {
    searchLat = pos.coords.latitude;
    searchLng = pos.coords.longitude;
    searchLabel = 'your location';
    dot.classList.remove('pulse');
    setGPSStatus('✓ Location found'); document.getElementById('gps-status').style.color = 'var(--gold)';
    if (mode === 'gps') document.getElementById('search-btn').disabled = false;
  }, err => {
    dot.style.display = 'none';
    setGPSStatusHTML('⚠ Could not get location<br>&nbsp;&nbsp;&nbsp;check location permissions in Settings'); document.getElementById('gps-status').style.color = 'var(--gold)';
    retryBtn.style.display = 'block';
  }, {enableHighAccuracy: true, timeout: 12000});
}

function setGPSStatus(msg) { document.getElementById('gps-status').textContent = msg; }
function setGPSStatusHTML(msg) { document.getElementById('gps-status').innerHTML = msg; }

// Kick off GPS lookup immediately on page load
getMyLocation();

// ── Town search ───────────────────────────────────────────────────────────────
function searchByTown() {
  const val = document.getElementById('town-input').value.trim();
  if (!val) { document.getElementById('town-status').textContent = 'Please enter a town or suburb'; return; }
  document.getElementById('town-status').textContent = 'Looking up ' + val + '…';
  const match = findSuburbCoords(val);
  if (match) {
    searchLat = match.lat; searchLng = match.lng; searchLabel = val;
    document.getElementById('town-status').textContent = '✓ Found ' + val;
    document.getElementById('search-btn').disabled = false;
    doSearch();
    return;
  }
  const url = 'https://nominatim.openstreetmap.org/search?q=' + encodeURIComponent(val + ', Victoria, Australia') + '&format=json&limit=1';
  fetch(url, {headers: {'Accept-Language': 'en', 'User-Agent': 'GolfTrackerApp/1.0'}})
    .then(r => r.json())
    .then(data => {
      if (data && data.length > 0) {
        searchLat = parseFloat(data[0].lat);
        searchLng = parseFloat(data[0].lon);
        searchLabel = val;
        document.getElementById('town-status').textContent = '✓ Found: ' + data[0].display_name.split(',')[0];
        document.getElementById('search-btn').disabled = false;
        doSearch();
      } else {
        document.getElementById('town-status').textContent = 'Could not find "' + val + '" — try a nearby larger town';
      }
    })
    .catch(() => {
      document.getElementById('town-status').textContent = 'Search unavailable offline — try a suburb from the course list';
    });
}

function findSuburbCoords(query) {
  const q = query.toLowerCase().trim();
  const found = COURSES.find(c => c.suburb.toLowerCase() === q);
  if (found) return {lat: found.lat, lng: found.lng};
  const partial = COURSES.find(c => c.suburb.toLowerCase().includes(q) || q.includes(c.suburb.toLowerCase()));
  if (partial) return {lat: partial.lat, lng: partial.lng};
  return null;
}

document.getElementById('town-input').addEventListener('keydown', e => { if (e.key==='Enter') searchByTown(); });

// ── Haversine distance ────────────────────────────────────────────────────────
function distKm(lat1, lng1, lat2, lng2) {
  const R = 6371;
  const dLat = (lat2-lat1)*Math.PI/180, dLng = (lng2-lng1)*Math.PI/180;
  const a = Math.sin(dLat/2)**2 + Math.cos(lat1*Math.PI/180)*Math.cos(lat2*Math.PI/180)*Math.sin(dLng/2)**2;
  return R * 2 * Math.asin(Math.sqrt(a));
}

// ── Search ────────────────────────────────────────────────────────────────────
function doSearch() {
  if (searchLat===null) { return; }
  const area = document.getElementById('results-area');
  let results = COURSES.map(c => ({...c, distKm: distKm(searchLat, searchLng, c.lat, c.lng)})).filter(c => c.distKm <= selectedRadius);
  if (selectedAccess !== 'all') results = results.filter(c => c.access === selectedAccess);
  results.sort((a,b) => a.distKm - b.distKm);
  if (results.length === 0) {
    area.innerHTML = '<div class="empty-state"><span class="empty-icon">🔍</span>No courses found within ' + selectedRadius + 'km of ' + searchLabel + '.<br><br>Try increasing the distance radius.</div>';
    return;
  }
  const accessOrder = ['Public', 'Resort / Public', 'Semi-Private', 'Members – Visitors Welcome', 'Private'];
  const grouped = selectedAccess === 'all';
  let html = '<div class="results-header"><div class="results-count">' + results.length + ' course' + (results.length===1?'':'s') + ' found</div><div style="font-size:12px;color:var(--text-muted)">within ' + selectedRadius + 'km</div></div>';
  if (grouped) {
    accessOrder.forEach(type => {
      const group = results.filter(c => c.access === type);
      if (group.length === 0) return;
      html += '<div class="section-divider">' + type + ' (' + group.length + ')</div>';
      html += group.map(c => courseCard(c)).join('');
    });
    const other = results.filter(c => !accessOrder.includes(c.access));
    if (other.length) { html += '<div class="section-divider">Other (' + other.length + ')</div>'; html += other.map(c => courseCard(c)).join(''); }
  } else {
    html += results.map(c => courseCard(c)).join('');
  }
  area.innerHTML = html;
}

// ── Course card ───────────────────────────────────────────────────────────────
function courseCard(c) {
  const dist = c.distKm < 1 ? Math.round(c.distKm*1000)+'m' : Math.round(c.distKm)+'km';
  const tagClass = {'Public':'tag-public','Semi-Private':'tag-semi','Members – Visitors Welcome':'tag-members','Resort / Public':'tag-resort','Private':'tag-private'}[c.access] || 'tag-neutral';
  const fee = c.holes === 9 ? (c.fee9 && c.fee9 !== 'N/A' ? c.fee9 : null) : (c.fee18 && c.fee18 !== 'N/A' && !c.fee18.includes('Private') ? c.fee18 : null);
  return '<div class="course-card" onclick="toggleCard(this)">' +
    '<div class="course-top"><div class="course-dist-badge">' + dist + '</div><div class="course-name">' + c.name + '</div></div>' +
    '<div class="course-suburb-row"><div class="course-suburb">' + c.suburb + '</div><span class="course-tag ' + tagClass + '">' + c.access + '</span></div>' +
    '<div class="course-meta"><span class="course-tag tag-neutral">' + c.holes + ' holes</span><span class="course-tag tag-neutral">Par ' + c.par + '</span>' + (fee ? '<span class="course-tag tag-neutral">' + fee + '</span>' : '') + '</div>' +
    (c.notes ? '<div class="course-notes">' + c.notes + '</div>' : '') +
    '</div>';
}

function toggleCard(card) { card.classList.toggle('expanded'); }

// ── Nav drawer ────────────────────────────────────────────────────────────────
const primary   = document.getElementById('nav-primary');
const secondary = document.getElementById('nav-secondary');
const overlay   = document.getElementById('nav-overlay');
const btnMore   = document.getElementById('btn-more');
const iconMore  = document.getElementById('icon-more');

function openDrawer() {
  primary.classList.add('raised'); secondary.classList.add('open'); overlay.classList.add('open');
  iconMore.src = 'History_1.png';
  iconMore.alt = 'History';
  btnMore.onclick = () => window.location.href = 'history.html';
}
function closeDrawer() {
  primary.classList.remove('raised'); secondary.classList.remove('open'); overlay.classList.remove('open');
  iconMore.src = 'More.png';
  iconMore.alt = 'More';
  btnMore.onclick = openDrawer;
}
