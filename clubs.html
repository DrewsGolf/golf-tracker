<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0D0D0D">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.svg">
<title>Shot Tracker — Clubs</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap');

  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  :root {
    --gold: #C8A96A; --gold-muted: #9A7C47;
    --text-primary: #F2F2F2; --text-secondary: #BDBDBD; --text-muted: #9A9A9A;
    --bg: #0D0D0D; --card: rgba(28,28,28,0.85); --border: rgba(200,169,106,0.15); --border-mid: rgba(200,169,106,0.25);
    --radius: 14px; --radius-sm: 9px;
    --safe-bottom: env(safe-area-inset-bottom, 0px);
  }
  html, body { height: 100%; font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif; background: var(--bg); color: var(--text-primary); overflow: hidden; }
  .app { position: relative; width: 100%; height: 100%; max-width: 430px; margin: 0 auto; overflow: hidden; }
  #app { display: flex; flex-direction: column; height: 100%; position: relative; z-index: 5; }

  /* Background */
  .hero { position: absolute; inset: 0; width: 100%; height: 100%; z-index: 0; }
  .hero-img { width: 100%; height: 100%; object-fit: cover; object-position: center; display: block; }
  .hero-overlay { position: absolute; inset: 0; background: rgba(13,13,13,0.88); }

  /* Header */
  .header-img-wrap { position: relative; z-index: 10; width: 100%; flex-shrink: 0; }
  .header-img { width: 100%; height: auto; display: block; }

  /* Content */
  .content { flex: 1; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 14px 14px calc(var(--safe-bottom) + 110px); position: relative; z-index: 5; }

  /* Cards */
  .card { background: var(--card); border: 0.5px solid var(--border); border-radius: var(--radius); backdrop-filter: blur(8px); padding: 16px 14px; margin-bottom: 12px; }
  .card-label { font-size: 10px; font-weight: 500; letter-spacing: 0.14em; text-transform: uppercase; color: var(--text-muted); margin-bottom: 10px; }

  /* Club picker trigger */
  .club-picker-trigger { width: 100%; background: rgba(13,13,13,0.7); border: 0.5px solid rgba(200,169,106,0.35); border-radius: var(--radius-sm); padding: 14px 16px; font-size: 17px; font-weight: 500; color: var(--gold); font-family: inherit; cursor: pointer; display: flex; align-items: center; justify-content: space-between; text-align: left; }
  .club-picker-trigger.placeholder { color: var(--text-muted); font-size: 15px; }
  .club-picker-arrow { font-size: 14px; color: var(--gold); flex-shrink: 0; }

  /* Club picker bottom sheet */
  .club-picker-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 300; opacity: 0; pointer-events: none; transition: opacity 0.25s; }
  .club-picker-overlay.open { opacity: 1; pointer-events: auto; }
  .club-picker-sheet { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%) translateY(100%); width: 100%; max-width: 430px; background: #1C1C1C; border-radius: 20px 20px 0 0; border-top: 0.5px solid rgba(200,169,106,0.2); z-index: 301; transition: transform 0.3s cubic-bezier(0.4,0,0.2,1); max-height: 70vh; display: flex; flex-direction: column; }
  .club-picker-sheet.open { transform: translateX(-50%) translateY(0); }
  .club-picker-handle { width: 36px; height: 3px; background: rgba(200,169,106,0.3); border-radius: 2px; margin: 12px auto 4px; flex-shrink: 0; }
  .club-picker-title { font-size: 12px; font-weight: 500; letter-spacing: 0.12em; text-transform: uppercase; color: var(--text-muted); text-align: center; padding: 8px 0 12px; border-bottom: 0.5px solid rgba(200,169,106,0.12); flex-shrink: 0; }
  .club-picker-list { overflow-y: auto; -webkit-overflow-scrolling: touch; padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 16px); }
  .club-picker-item { padding: 16px 24px; font-size: 16px; font-weight: 400; color: #F2F2F2; cursor: pointer; border-bottom: 0.5px solid rgba(200,169,106,0.08); font-family: inherit; display: flex; align-items: center; justify-content: space-between; }
  .club-picker-item:last-child { border-bottom: none; }
  .club-picker-item:active { background: rgba(200,169,106,0.08); }
  .club-picker-item.selected { color: var(--gold); }
  .club-picker-item.selected::after { content: '✓'; font-size: 14px; color: var(--gold); }

  /* GPS progress */
  .gps-progress { display: none; text-align: center; padding: 10px 0 4px; }
  .gps-progress-label { font-size: 11px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--gold-muted); margin-bottom: 8px; }
  .gps-dots { display: flex; justify-content: center; gap: 6px; }
  .gps-dot-pip { font-size: 18px; color: rgba(200,169,106,0.25); transition: color 0.3s; }
  .gps-dot-pip.filled { color: var(--gold); }

  /* Stage instruction */
  .stage-instruction { text-align: center; font-size: 14px; color: var(--text-secondary); font-style: italic; padding: 6px 0 10px; }

  /* Result display */
  .result-card { background: rgba(200,169,106,0.08); border: 0.5px solid rgba(200,169,106,0.3); border-radius: var(--radius); padding: 18px 14px; margin-bottom: 12px; text-align: center; }
  .result-dist { font-size: 56px; font-weight: 300; color: var(--gold); line-height: 1; letter-spacing: -0.04em; }
  .result-unit { font-size: 18px; font-weight: 400; color: var(--gold-muted); margin-left: 4px; }
  .result-club { font-size: 15px; font-weight: 500; color: var(--text-secondary); margin-top: 6px; }

  /* Buttons */
  .btn { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; padding: 15px; border-radius: var(--radius); border: none; font-size: 15px; font-weight: 500; cursor: pointer; transition: opacity 0.15s, transform 0.1s; margin-bottom: 10px; font-family: inherit; letter-spacing: 0.03em; }
  .btn:last-child { margin-bottom: 0; }
  .btn:active { opacity: 0.82; transform: scale(0.985); }
  .btn-primary { background: var(--gold); color: #0D0D0D; }
  .btn-outline { background: transparent; color: var(--gold); border: 0.5px solid var(--gold); }
  .btn-danger { background: rgba(142,75,75,0.3); color: #F2F2F2; border: 0.5px solid rgba(142,75,75,0.5); }
  .btn:disabled { opacity: 0.35; cursor: default; }

  /* History */
  .history-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 10px; }
  .history-title { font-size: 13px; font-weight: 600; color: var(--gold); letter-spacing: 0.06em; text-transform: uppercase; }
  .history-clear { background: transparent; border: none; color: var(--text-muted); font-size: 12px; cursor: pointer; font-family: inherit; }
  .shot-list { display: flex; flex-direction: column; gap: 7px; }
  .shot-item { background: rgba(28,28,28,0.7); border: 0.5px solid var(--border); border-radius: var(--radius-sm); display: flex; align-items: center; padding: 11px 13px; gap: 11px; }
  .shot-bubble { width: 26px; height: 26px; border-radius: 50%; background: rgba(200,169,106,0.15); font-size: 11px; font-weight: 600; color: var(--gold); display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .shot-club { font-size: 14px; font-weight: 600; flex: 1; color: var(--text-primary); }
  .shot-dist { font-size: 15px; font-weight: 500; color: var(--gold); }
  .shot-avg { font-size: 12px; color: var(--text-muted); }
  .empty-state { text-align: center; padding: 24px 16px; color: var(--text-muted); font-size: 14px; }
  .empty-icon { font-size: 32px; margin-bottom: 8px; display: block; }

  /* Dialog */
  .dialog-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 200; display: flex; align-items: flex-end; justify-content: center; animation: fadeIn 0.15s ease; }
  @keyframes fadeIn { from{opacity:0} to{opacity:1} }
  .dialog-sheet { background: #1C1C1C; border-top: 0.5px solid rgba(200,169,106,0.2); border-radius: 22px 22px 0 0; padding: 8px 0 calc(var(--safe-bottom) + 8px); width: 100%; max-width: 430px; animation: slideUp 0.2s ease; }
  @keyframes slideUp { from{transform:translateY(40px);opacity:0} to{transform:translateY(0);opacity:1} }
  .dialog-handle { width: 36px; height: 4px; background: var(--border-mid); border-radius: 2px; margin: 8px auto 16px; }
  .dialog-icon { text-align: center; margin-bottom: 8px; min-height: 36px; display: flex; align-items: center; justify-content: center; font-size: 36px; }
  .dialog-title { font-size: 18px; font-weight: 700; text-align: center; color: var(--text-primary); padding: 0 20px; margin-bottom: 6px; }
  .dialog-sub { font-size: 14px; color: var(--text-secondary); text-align: center; padding: 0 24px; margin-bottom: 20px; line-height: 1.5; }
  .dialog-actions { padding: 0 16px; display: flex; flex-direction: column; gap: 8px; }
  .dialog-btn { display: flex; align-items: center; justify-content: center; width: 100%; padding: 15px; border-radius: var(--radius); border: none; font-size: 15px; font-weight: 600; cursor: pointer; font-family: inherit; }
  .dialog-btn-primary { background: var(--gold); color: #0D0D0D; }
  .dialog-btn-danger { background: #c0392b; color: #fff; }
  .dialog-btn-secondary { background: rgba(28,28,28,0.85); color: var(--text-muted); border: 0.5px solid var(--border); }

  /* Toast */
  #toast { position: fixed; bottom: calc(var(--safe-bottom) + 120px); left: 50%; transform: translateX(-50%) translateY(20px); background: rgba(28,28,28,0.95); color: var(--text-primary); border: 0.5px solid var(--border); padding: 10px 20px; border-radius: 100px; font-size: 13px; font-weight: 500; opacity: 0; transition: opacity 0.25s, transform 0.25s; pointer-events: none; white-space: nowrap; z-index: 999; }
  #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  /* Bottom nav */
  .nav-shell { position: fixed; bottom: 0; left: 50%; transform: translateX(-50%); width: 100%; max-width: 430px; z-index: 150; }
  .nav-row { display: flex; background: rgba(13,13,13,0.95); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
  .nav-primary { border-top: 0.5px solid rgba(200,169,106,0.2); padding-bottom: calc(var(--safe-bottom) + 6px); transform: translateY(0); transition: transform 350ms cubic-bezier(0.4,0,0.2,1); will-change: transform; position: relative; z-index: 2; }
  .nav-primary.raised { transform: translateY(-100%); }
  .nav-secondary { border-top: 0.5px solid rgba(200,169,106,0.12); padding-bottom: calc(var(--safe-bottom) + 6px); position: absolute; bottom: 0; left: 0; right: 0; transform: translateY(100%); transition: transform 350ms cubic-bezier(0.4,0,0.2,1); will-change: transform; z-index: 1; }
  .nav-secondary.open { transform: translateY(0); }
  .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 10px 4px 6px; cursor: pointer; text-decoration: none; background: none; border: none; -webkit-tap-highlight-color: transparent; transition: opacity 0.15s; }
  .nav-item:active { opacity: 0.7; }
  .nav-item img { width: 70px; height: 70px; object-fit: contain; display: block; }
  .nav-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); opacity: 0; pointer-events: none; transition: opacity 350ms ease; z-index: 140; }
  .nav-overlay.open { opacity: 1; pointer-events: auto; }
  /* Auth badge */
  .header-auth-badge { position: absolute; top: 10px; right: 14px; display: none; align-items: center; gap: 6px; background: rgba(13,13,13,0.6); backdrop-filter: blur(6px); border: 0.5px solid rgba(200,169,106,0.2); border-radius: 20px; padding: 5px 10px 5px 8px; z-index: 20; }
  .header-auth-badge.visible { display: flex; }
  .header-auth-dot { width: 8px; height: 8px; border-radius: 50%; background: #2ecc71; flex-shrink: 0; }
  .header-auth-email { font-size: 11px; font-weight: 500; color: var(--gold); white-space: nowrap; }
</style>
</head>
<body>
<div class="app">
<div class="hero">
  <img class="hero-img" src="Back_ground_New.jpg" alt="">
  <div class="hero-overlay"></div>
</div>
<div id="app">
  <div class="header-img-wrap" style="position:relative;">
    <img class="header-img" src="Header.webp" alt="Shot Tracker">
    <div class="header-auth-badge" id="header-badge">
      <div class="header-auth-dot"></div>
      <span class="header-auth-email" id="header-email"></span>
    </div>
  </div>
  <div class="content">

    <!-- CLUB SELECTOR -->
    <div class="card">
      <div class="card-label">Select Club</div>
      <button class="club-picker-trigger placeholder" id="club-trigger" onclick="openClubPicker()">
        <span id="club-label">— Choose a club —</span>
        <span class="club-picker-arrow">&#9662;</span>
      </button>
    </div>

    <!-- SHOT TRACKER -->
    <div class="card" id="tracker-card">
      <div class="card-label" id="tracker-label">Ready</div>

      <!-- GPS progress dots -->
      <div class="gps-progress" id="gps-progress">
        <div class="gps-progress-label" id="gps-progress-label">Acquiring position</div>
        <div class="gps-dots">
          <span class="gps-dot-pip" id="gdot-0">&#9678;</span>
          <span class="gps-dot-pip" id="gdot-1">&#9678;</span>
          <span class="gps-dot-pip" id="gdot-2">&#9678;</span>
          <span class="gps-dot-pip" id="gdot-3">&#9678;</span>
          <span class="gps-dot-pip" id="gdot-4">&#9678;</span>
          <span class="gps-dot-pip" id="gdot-5">&#9678;</span>
          <span class="gps-dot-pip" id="gdot-6">&#9678;</span>
          <span class="gps-dot-pip" id="gdot-7">&#9678;</span>
          <span class="gps-dot-pip" id="gdot-8">&#9678;</span>
          <span class="gps-dot-pip" id="gdot-9">&#9678;</span>
        </div>
      </div>

      <!-- Stage: idle -->
      <div id="stage-idle">
        <p class="stage-instruction">Select a club, stand at the ball, then tap Start Shot</p>
        <button class="btn btn-primary" id="btn-start" onclick="startShot()" disabled>&#9679; Start Shot</button>
      </div>

      <!-- Stage: walking -->
      <div id="stage-walking" style="display:none">
        <p class="stage-instruction">Walk to where your ball landed and tap Mark Landing</p>
        <button class="btn btn-primary" onclick="markLanding()">&#9655; Mark Landing</button>
        <button class="btn btn-danger" onclick="cancelShot()">&#10007; Cancel</button>
      </div>

      <!-- Stage: result -->
      <div id="stage-result" style="display:none">
        <div class="result-card">
          <span class="result-dist" id="result-dist">—</span><span class="result-unit">m</span>
          <div class="result-club" id="result-club"></div>
        </div>
        <button class="btn btn-primary" onclick="saveShot()">&#10003; Save This Shot</button>
        <button class="btn btn-outline" onclick="retakeShot()">&#8635; Retake</button>
      </div>
    </div>

    <!-- HISTORY -->
    <div class="card">
      <div class="history-header">
        <span class="history-title">Recorded Shots</span>
        <button class="history-clear" onclick="confirmClearAll()">Clear all</button>
      </div>
      <div id="shot-history"></div>
    </div>

  </div>
</div>

<!-- Dialog -->
<div id="dialog-overlay" class="dialog-overlay" style="display:none" onclick="closeDialogOutside(event)">
  <div class="dialog-sheet" onclick="event.stopPropagation()">
    <div class="dialog-handle"></div>
    <div id="dialog-icon" class="dialog-icon"></div>
    <div id="dialog-title" class="dialog-title"></div>
    <div id="dialog-sub" class="dialog-sub"></div>
    <div id="dialog-actions" class="dialog-actions"></div>
  </div>
</div>

<div id="toast"></div>

<!-- Club picker bottom sheet -->
<div class="club-picker-overlay" id="club-picker-overlay" onclick="closeClubPicker()"></div>
<div class="club-picker-sheet" id="club-picker-sheet">
  <div class="club-picker-handle"></div>
  <div class="club-picker-title">Select Club</div>
  <div class="club-picker-list" id="club-picker-list"></div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = 'https://ryqehsqqriavmuqfnzpx.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJ5cWVoc3Fxcmlhdm11cWZuenB4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODM3NTQ4MzcsImV4cCI6MjA5OTMzMDgzN30.Po2m7uhlMTc43Pdg8pohwvDsQ_UDFRS-n9UnTQ44nXA';
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let currentUser = null;
sb.auth.getSession().then(({ data }) => {
  if (data.session) {
    currentUser = data.session.user;
    var badge = document.getElementById('header-badge');
    var email = document.getElementById('header-email');
    if (badge) badge.classList.add('visible');
    if (email) email.textContent = data.session.user.email;
  }
});
// ── Club definitions ──────────────────────────────────────────────────────────
const ALL_CLUBS_FULL = {
  'driver':'Driver','3wood':'3-Wood','4wood':'4-Wood','5wood':'5-Wood','7wood':'7-Wood','9wood':'9-Wood',
  '2hybrid':'2-Hybrid','3hybrid':'3-Hybrid','4hybrid':'4-Hybrid','5hybrid':'5-Hybrid','6hybrid':'6-Hybrid',
  '2iron':'2-Iron','3iron':'3-Iron','4iron':'4-Iron','5iron':'5-Iron','6iron':'6-Iron',
  '7iron':'7-Iron','8iron':'8-Iron','9iron':'9-Iron',
  'pw':'Pitching Wedge','gw':'Gap Wedge','sw':'Sand Wedge','lw':'Lob Wedge','putter':'Putter'
};

const savedBag = JSON.parse(localStorage.getItem('golf-bag-v1') || 'null');
const BAG = savedBag || ['driver','3wood','5wood','4hybrid','5iron','6iron','7iron','8iron','9iron','pw','gw','sw','lw','putter'];

// ── State ─────────────────────────────────────────────────────────────────────
let selectedClub   = null;
let startPosition  = null;
let pendingDist    = null;
let pendingClub    = null;

// Distances stored: { 'driver': [220, 215, 230], '7iron': [145, 150], ... }
let clubDistances = JSON.parse(localStorage.getItem('golf-club-distances') || '{}');

function persist() {
  localStorage.setItem('golf-club-distances', JSON.stringify(clubDistances));
}

async function saveDistanceToSupabase(club, dist) {
  if (!currentUser) return;
  try {
    await sb.from('club_distances').insert({
      user_id:  currentUser.id,
      club:     club,
      distance: dist,
      date:     new Date().toISOString().split('T')[0]
    });
  } catch(e) { console.error('Supabase club save error:', e); }
}

async function loadDistancesFromSupabase() {
  if (!currentUser) return;
  try {
    const { data } = await sb.from('club_distances')
      .select('club, distance, date')
      .eq('user_id', currentUser.id)
      .order('created_at', { ascending: true });
    if (!data || data.length === 0) return;
    // Merge into clubDistances
    data.forEach(row => {
      if (!clubDistances[row.club]) clubDistances[row.club] = [];
      // Only add if not already in local (avoid duplicates)
      const exists = clubDistances[row.club].some(s => s.dist === row.distance && s.date === new Date(row.date).toLocaleDateString('en-AU'));
      if (!exists) clubDistances[row.club].push({ dist: row.distance, date: new Date(row.date).toLocaleDateString('en-AU') });
    });
    persist();
    renderHistory();
  } catch(e) { console.error('Supabase club load error:', e); }
}

// ── Club picker ───────────────────────────────────────────────────────────────
function openClubPicker() {
  const list = document.getElementById('club-picker-list');
  list.innerHTML = BAG.map(id =>
    '<div class="club-picker-item' + (selectedClub===id?' selected':'') + '" onclick="selectClub(\''+id+'\')">' +
    (ALL_CLUBS_FULL[id]||id) + '</div>'
  ).join('');
  document.getElementById('club-picker-overlay').classList.add('open');
  document.getElementById('club-picker-sheet').classList.add('open');
}

function closeClubPicker() {
  document.getElementById('club-picker-overlay').classList.remove('open');
  document.getElementById('club-picker-sheet').classList.remove('open');
}

function selectClub(id) {
  selectedClub = id;
  closeClubPicker();
  const trigger = document.getElementById('club-trigger');
  document.getElementById('club-label').textContent = ALL_CLUBS_FULL[id] || id;
  trigger.classList.remove('placeholder');
  document.getElementById('btn-start').disabled = false;
}

// ── GPS ───────────────────────────────────────────────────────────────────────
let gpsDotTimer    = null;
let gpsReadingTimer = null;

function startGPS(onDone) {
  if (gpsDotTimer)     { clearInterval(gpsDotTimer);     gpsDotTimer = null; }
  if (gpsReadingTimer) { clearInterval(gpsReadingTimer); gpsReadingTimer = null; }

  const readings = [];
  let dotIndex   = 0;

  for (let i = 0; i < 10; i++) {
    const d = document.getElementById('gdot-' + i);
    if (d) { d.textContent = '\u25ce'; d.classList.remove('filled'); }
  }
  document.getElementById('gps-progress-label').textContent = 'Acquiring position';
  document.getElementById('gps-progress').style.display = 'block';

  gpsDotTimer = setInterval(() => {
    const d = document.getElementById('gdot-' + dotIndex);
    if (d) { d.textContent = '\u25c9'; d.classList.add('filled'); }
    dotIndex++;
    if (dotIndex >= 10) { clearInterval(gpsDotTimer); gpsDotTimer = null; }
  }, 2000);

  // Settle 5s, then 3 readings at 5s intervals
  setTimeout(() => {
    let count = 0;
    gpsReadingTimer = setInterval(() => {
      if (navigator.geolocation) {
        navigator.geolocation.getCurrentPosition(
          pos => readings.push(pos.coords),
          () => {},
          { enableHighAccuracy: true, timeout: 4500, maximumAge: 0 }
        );
      }
      count++;
      if (count >= 3) {
        clearInterval(gpsReadingTimer); gpsReadingTimer = null;
        if (gpsDotTimer) { clearInterval(gpsDotTimer); gpsDotTimer = null; }
        document.getElementById('gps-progress').style.display = 'none';
        const coords = readings.length > 0 ? bestCoords(readings) : null;
        onDone(coords);
      }
    }, 5000);
  }, 5000);
}

function bestCoords(readings) {
  if (readings.length === 1) return readings[0];
  if (readings.length === 2) return {
    latitude:  (readings[0].latitude  + readings[1].latitude)  / 2,
    longitude: (readings[0].longitude + readings[1].longitude) / 2
  };
  let best = Infinity, a = 0, b = 1;
  for (let i = 0; i < readings.length; i++)
    for (let j = i+1; j < readings.length; j++) {
      const d = haversine(readings[i], readings[j]);
      if (d < best) { best = d; a = i; b = j; }
    }
  return {
    latitude:  (readings[a].latitude  + readings[b].latitude)  / 2,
    longitude: (readings[a].longitude + readings[b].longitude) / 2
  };
}

function haversine(a, b) {
  const R = 6371000, f1 = a.latitude*Math.PI/180, f2 = b.latitude*Math.PI/180;
  const df = (b.latitude-a.latitude)*Math.PI/180;
  const dl = (b.longitude-a.longitude)*Math.PI/180;
  const x  = Math.sin(df/2)**2 + Math.cos(f1)*Math.cos(f2)*Math.sin(dl/2)**2;
  return Math.round(2*R*Math.asin(Math.sqrt(x)));
}

// ── Shot flow ─────────────────────────────────────────────────────────────────
function setStage(name) {
  ['idle','walking','result'].forEach(s => {
    document.getElementById('stage-'+s).style.display = s===name ? 'block' : 'none';
  });
}

function startShot() {
  if (!selectedClub) { showToast('Select a club first'); return; }
  document.getElementById('tracker-label').textContent = 'Marking start position\u2026';
  setStage('idle');
  document.getElementById('btn-start').disabled = true;
  document.getElementById('stage-idle').querySelector('p').textContent = 'Getting your start position\u2026';

  startGPS(coords => {
    if (!coords) { showToast('Could not get GPS position — try again'); resetTracker(); return; }
    startPosition = coords;
    document.getElementById('tracker-label').textContent = 'Walk to your ball';
    setStage('walking');
    showToast('Start marked \u2014 walk to your ball');
  });
}

function markLanding() {
  document.getElementById('tracker-label').textContent = 'Marking landing position\u2026';
  startGPS(coords => {
    if (!coords) { showToast('Could not get GPS position — try again'); return; }
    const dist = haversine(startPosition, coords);
    pendingDist  = dist;
    pendingClub  = selectedClub;
    document.getElementById('result-dist').textContent = dist;
    document.getElementById('result-club').textContent = ALL_CLUBS_FULL[selectedClub] || selectedClub;
    document.getElementById('tracker-label').textContent = 'Shot measured';
    setStage('result');
  });
}

function saveShot() {
  if (!pendingClub || pendingDist === null) return;
  if (!clubDistances[pendingClub]) clubDistances[pendingClub] = [];
  clubDistances[pendingClub].push({ dist: pendingDist, date: new Date().toLocaleDateString('en-AU') });
  persist();
  saveDistanceToSupabase(pendingClub, pendingDist);
  showToast((ALL_CLUBS_FULL[pendingClub]||pendingClub) + ' \u2014 ' + pendingDist + 'm saved');
  resetTracker();
  renderHistory();
}

function retakeShot() {
  // Keep start position, go back to walking stage
  document.getElementById('tracker-label').textContent = 'Walk to your ball';
  setStage('walking');
}

function cancelShot() {
  resetTracker();
}

function resetTracker() {
  startPosition = null; pendingDist = null; pendingClub = null;
  document.getElementById('tracker-label').textContent = 'Ready';
  document.getElementById('stage-idle').querySelector('p').textContent = 'Select a club, stand at the ball, then tap Start Shot';
  document.getElementById('btn-start').disabled = !selectedClub;
  setStage('idle');
}

// ── History ───────────────────────────────────────────────────────────────────
function renderHistory() {
  const el = document.getElementById('shot-history');
  const clubOrder = BAG;
  const entries = clubOrder.filter(id => clubDistances[id] && clubDistances[id].length > 0);

  if (!entries.length) {
    el.innerHTML = '<div class="empty-state"><span class="empty-icon">&#127953;</span>No shots recorded yet.<br>Select a club and start tracking.</div>';
    return;
  }

  el.innerHTML = '<div class="shot-list">' + entries.map(id => {
    const shots = clubDistances[id];
    const dists = shots.map(s => s.dist);
    const avg   = Math.round(dists.reduce((a,v) => a+v, 0) / dists.length);
    const max   = Math.max(...dists);
    const latest = shots[shots.length-1];
    return '<div class="shot-item">' +
      '<div class="shot-bubble">' + shots.length + '</div>' +
      '<div class="shot-club">' + (ALL_CLUBS_FULL[id]||id) + '<br><span class="shot-avg">avg ' + avg + 'm &middot; best ' + max + 'm</span></div>' +
      '<div class="shot-dist">' + latest.dist + 'm</div>' +
      '</div>';
  }).join('') + '</div>';
}

function confirmClearAll() {
  showDialog({
    icon: '&#128465;',
    title: 'Clear All Shots?',
    sub: 'This will permanently delete all recorded club distances.',
    buttons: [
      { label: 'Clear everything', style: 'danger', action: () => {
        clubDistances = {}; persist(); renderHistory(); showToast('All shots cleared');
      }},
      { label: 'Cancel', style: 'secondary', action: () => {} }
    ]
  });
}

// ── Dialog ────────────────────────────────────────────────────────────────────
function showDialog(opts) {
  document.getElementById('dialog-icon').innerHTML    = opts.icon  || '';
  document.getElementById('dialog-title').textContent = opts.title || '';
  document.getElementById('dialog-sub').textContent   = opts.sub   || '';
  document.getElementById('dialog-actions').innerHTML = opts.buttons.map((b,i) =>
    '<button class="dialog-btn dialog-btn-'+(b.style||'secondary')+'" onclick="dialogAction('+i+')">'+b.label+'</button>'
  ).join('');
  window._dialogActions = opts.buttons.map(b => b.action);
  document.getElementById('dialog-overlay').style.display = 'flex';
}
function dialogAction(i) { closeDialog(); window._dialogActions?.[i]?.(); }
function closeDialogOutside(e) { if (e.target===document.getElementById('dialog-overlay')) closeDialog(); }
function closeDialog() { document.getElementById('dialog-overlay').style.display = 'none'; }

// ── Toast ─────────────────────────────────────────────────────────────────────
function showToast(msg) {
  const t = document.getElementById('toast'); t.textContent = msg; t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 2200);
}

// ── Nav drawer ────────────────────────────────────────────────────────────────
function openNavDrawer() {
  document.getElementById('nav-primary').classList.add('raised');
  document.getElementById('nav-secondary').classList.add('open');
  document.getElementById('nav-overlay').classList.add('open');
  document.getElementById('icon-more').src = 'Courses_2.png';
  document.getElementById('btn-more').onclick = () => window.location.href = 'find.html';
}
function closeDrawer() {
  document.getElementById('nav-primary').classList.remove('raised');
  document.getElementById('nav-secondary').classList.remove('open');
  document.getElementById('nav-overlay').classList.remove('open');
  document.getElementById('icon-more').src = 'More.png';
  document.getElementById('btn-more').onclick = openNavDrawer;
}

// ── Init ──────────────────────────────────────────────────────────────────────
renderHistory();
setTimeout(loadDistancesFromSupabase, 500);
if ('serviceWorker' in navigator) { navigator.serviceWorker.register('/sw.js').catch(() => {}); }
</script>
